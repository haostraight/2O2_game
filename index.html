<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dimensional Survival RPG</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800;900&display=swap');

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { background: #05070a; color: #f3f4f6; font-family: 'Plus Jakarta Sans', sans-serif; overflow: hidden; }
        
        #gameCanvas { display: block; width: 100vw; height: 100vh; background: #05070a; cursor: crosshair; }

        /* Damage Vignette */
        #damage-flash {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            background: radial-gradient(circle, rgba(239, 68, 68, 0) 40%, rgba(239, 68, 68, 0.7) 100%);
            pointer-events: none; opacity: 0; transition: opacity 0.15s ease-out; z-index: 5;
        }

        /* Dimension & Biome Toast */
        #toast-container {
            position: absolute; top: 25px; left: 50%; transform: translateX(-50%);
            display: flex; flex-direction: column; align-items: center; gap: 8px; z-index: 20; pointer-events: none;
        }

        .toast {
            font-size: 14px; font-weight: 800; letter-spacing: 1.2px; color: #ffffff;
            background: rgba(13, 17, 23, 0.85); border: 1px solid rgba(255, 255, 255, 0.18);
            padding: 10px 24px; border-radius: 99px; backdrop-filter: blur(16px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.6); opacity: 0; transform: translateY(-15px) scale(0.95);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex; align-items: center; gap: 10px;
        }
        .toast.show { opacity: 1; transform: translateY(0) scale(1); }

        /* Objective & Vitals Top-Left Card */
        #stats-hud {
            position: absolute; top: 20px; left: 20px;
            background: rgba(13, 17, 23, 0.82); border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 18px; border-radius: 20px; backdrop-filter: blur(20px);
            box-shadow: 0 16px 36px rgba(0,0,0,0.6); width: 310px; pointer-events: none; z-index: 10;
        }
        
        .hud-header { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 1.5px; color: #9ca3af; margin-bottom: 8px; display: flex; justify-content: space-between; }
        
        .hp-bar-outer {
            width: 100%; height: 18px; background: rgba(255, 255, 255, 0.08);
            border-radius: 9px; overflow: hidden; margin-bottom: 12px; border: 1px solid rgba(255,255,255,0.08);
            position: relative;
        }
        .hp-bar-inner {
            height: 100%; width: 100%; background: linear-gradient(90deg, #ef4444, #f87171);
            border-radius: 9px; transition: width 0.25s ease;
        }
        .hp-text {
            position: absolute; width: 100%; top: 0; left: 0; height: 100%;
            display: flex; align-items: center; justify-content: center;
            font-size: 11px; font-weight: 800; color: #ffffff; text-shadow: 0 1px 3px rgba(0,0,0,0.9);
        }

        .main-objective-box {
            background: linear-gradient(135deg, rgba(147, 51, 234, 0.18), rgba(59, 130, 246, 0.18));
            border: 1px solid rgba(168, 85, 247, 0.35);
            border-radius: 12px; padding: 10px 12px; margin-bottom: 12px;
        }
        .obj-title { font-size: 10px; font-weight: 900; color: #c084fc; text-transform: uppercase; letter-spacing: 1.2px; }
        .obj-desc { font-size: 12px; font-weight: 700; color: #f3f4f6; margin-top: 3px; line-height: 1.3; }

        .resource-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 12px; }
        .res-card {
            background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 8px 4px; border-radius: 10px; text-align: center; font-size: 13px; font-weight: 800;
        }
        .res-card small { display: block; font-size: 9px; color: #9ca3af; font-weight: 600; margin-top: 2px; }

        .weapon-card {
            display: flex; align-items: center; justify-content: space-between;
            background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 8px 12px; border-radius: 10px; font-size: 12px; font-weight: 700;
        }

        /* Dimensional Teleport Bar */
        #dimension-bar {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 10px; background: rgba(13, 17, 23, 0.88); border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 8px; border-radius: 99px; backdrop-filter: blur(16px);
            box-shadow: 0 16px 36px rgba(0,0,0,0.6); z-index: 15;
        }
        .dim-btn {
            background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1);
            color: #d1d5db; padding: 10px 18px; border-radius: 99px; font-family: inherit;
            font-size: 12px; font-weight: 800; cursor: pointer; transition: all 0.25s ease;
            display: flex; align-items: center; gap: 6px;
        }
        .dim-btn:hover { background: rgba(255, 255, 255, 0.15); color: #fff; transform: translateY(-2px); }
        .dim-btn.active { background: #3b82f6; border-color: #60a5fa; color: #fff; box-shadow: 0 0 15px rgba(59, 130, 246, 0.5); }
        .dim-btn.locked { opacity: 0.5; cursor: not-allowed; }

        /* Modernized Glassmorphism Crafting Panel */
        #crafting-panel {
            position: absolute; top: 20px; right: 20px;
            background: rgba(13, 17, 23, 0.82); border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 16px; border-radius: 20px; backdrop-filter: blur(20px);
            box-shadow: 0 16px 36px rgba(0,0,0,0.6); width: 300px; max-height: 380px; overflow-y: auto; z-index: 10;
        }

        #crafting-panel::-webkit-scrollbar { width: 4px; }
        #crafting-panel::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 4px; }
        
        .craft-btn {
            display: flex; align-items: center; justify-content: space-between;
            width: 100%; margin: 6px 0; padding: 10px 12px;
            background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px; color: #f3f4f6; font-family: inherit; font-size: 12px; font-weight: 700;
            cursor: pointer; transition: all 0.2s ease;
        }
        .craft-btn:hover { background: rgba(255, 255, 255, 0.12); border-color: rgba(255, 255, 255, 0.25); transform: translateY(-2px); }
        .craft-reqs { font-size: 10px; color: #9ca3af; font-weight: 600; }

        /* Minimap with Structures */
        #minimap-container {
            position: absolute; bottom: 20px; right: 20px;
            width: 170px; height: 170px; border-radius: 20px;
            background: rgba(13, 17, 23, 0.88); border: 2px solid rgba(255, 255, 255, 0.18);
            backdrop-filter: blur(14px); overflow: hidden; box-shadow: 0 16px 36px rgba(0,0,0,0.6);
            z-index: 10; pointer-events: none;
        }
        #minimapCanvas { width: 100%; height: 100%; display: block; }

        .rarity-Common { color: #d1d5db; }
        .rarity-Uncommon { color: #4ade80; }
        .rarity-Rare { color: #60a5fa; }
        .rarity-Legendary { color: #fb923c; }
        .rarity-Mythic { color: #c084fc; }
    </style>
</head>
<body>

<canvas id="gameCanvas"></canvas>
<div id="damage-flash"></div>

<div id="toast-container">
    <div id="toast-msg" class="toast"><span>🌎</span><span>WELCOME TO OVERWORLD</span></div>
</div>

<div id="stats-hud">
    <div class="hud-header">
        <span>VITALS & QUEST</span>
        <span id="time-val">00:00</span>
    </div>
    <div class="hp-bar-outer">
        <div id="hp-bar" class="hp-bar-inner"></div>
        <div id="hp-text" class="hp-text">100 / 100</div>
    </div>

    <div class="main-objective-box">
        <div class="obj-title">OVERALL QUEST</div>
        <div id="quest-desc" class="obj-desc">Defeat 3 Dimension Bosses in Nether & Void to unlock Aetherion Goliath!</div>
    </div>
    
    <div class="resource-grid">
        <div class="res-card">🪵 <span id="wood-val">0</span><small>Wood</small></div>
        <div class="res-card">🪨 <span id="stone-val">0</span><small>Stone</small></div>
        <div class="res-card">💎 <span id="ore-val">0</span><small>Ore</small></div>
    </div>

    <div class="weapon-card">
        <span>Equipped</span>
        <span id="weapon-val" class="rarity-Common">Wooden Stick</span>
    </div>
</div>

<div id="dimension-bar">
    <button class="dim-btn active" id="btn-overworld" onclick="switchDimension('overworld')">🌿 Overworld</button>
    <button class="dim-btn" id="btn-nether" onclick="switchDimension('nether')">🔥 Nether</button>
    <button class="dim-btn" id="btn-void" onclick="switchDimension('void')">🔮 The Void</button>
</div>

<div id="crafting-panel">
    <div class="hud-header">Crafting Station</div>
    <button class="craft-btn" onclick="craftItem('key')">
        <span>🔑 Aether Key</span><span class="craft-reqs">30W 30S 20O</span>
    </button>
    <button class="craft-btn" onclick="craftItem('spear')">
        <span>🗡️ Stone Spear</span><span class="craft-reqs">10W 10S</span>
    </button>
    <button class="craft-btn" onclick="craftItem('hammer')">
        <span>🔨 Ore Sledge</span><span class="craft-reqs">15W 20O</span>
    </button>
    <button class="craft-btn" onclick="craftItem('blade')">
        <span>⚡ Plasma Sword</span><span class="craft-reqs">25W 25S 15O</span>
    </button>
    <button class="craft-btn" onclick="craftItem('scythe')">
        <span>🔮 Void Scythe</span><span class="craft-reqs">40W 40S 30O</span>
    </button>
    <button class="craft-btn" onclick="craftItem('heal')">
        <span>🧪 Health Salve</span><span class="craft-reqs">5W 5S</span>
    </button>
</div>

<div id="minimap-container">
    <canvas id="minimapCanvas" width="170" height="170"></canvas>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const minimapCanvas = document.getElementById('minimapCanvas');
const minimapCtx = minimapCanvas.getContext('2d');

function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

const WORLD_SIZE = 8000;
const HALF_WORLD = WORLD_SIZE / 2;

// WEAPONS
const WEAPONS = {
    stick:  { id: 'stick', name: 'Wooden Stick', damage: 20, range: 60, rarity: 'Common', color: '#a3a3a3' },
    spear:  { id: 'spear', name: 'Stone Spear', damage: 40, range: 85, rarity: 'Uncommon', color: '#4ade80' },
    hammer: { id: 'hammer', name: 'Ore Sledge', damage: 75, range: 70, rarity: 'Rare', color: '#60a5fa' },
    blade:  { id: 'blade', name: 'Plasma Sword', damage: 120, range: 105, rarity: 'Legendary', color: '#fb923c' },
    scythe: { id: 'scythe', name: 'Void Scythe', damage: 190, range: 125, rarity: 'Mythic', color: '#c084fc' }
};

// DIMENSIONS CONFIGURATION
const DIMENSIONS = {
    overworld: {
        name: 'OVERWORLD',
        bg: '#0f172a',
        biomes: [
            { name: 'Plains', bg: '#1c3323', icon: '🌲', color: '#22c55e' },
            { name: 'Desert', bg: '#8c6d27', icon: '🏜️', color: '#eab308' },
            { name: 'Snow', bg: '#3a5a68', icon: '❄️', color: '#38bdf8' },
            { name: 'Forest', bg: '#14251a', icon: '🌳', color: '#16a34a' }
        ],
        mobs: ['goblin', 'scout'],
        bossName: 'Forest Warden'
    },
    nether: {
        name: 'NETHER',
        bg: '#1a0505',
        biomes: [
            { name: 'Crimson Wastes', bg: '#450a0a', icon: '🔥', color: '#ef4444' },
            { name: 'Ash Valleys', bg: '#262626', icon: '🌋', color: '#737373' },
            { name: 'Basalt Delta', bg: '#1c1917', icon: '🪨', color: '#a8a29e' },
            { name: 'Lava Ridges', bg: '#7f1d1d', icon: '💥', color: '#f97316' }
        ],
        mobs: ['brute', 'fire_fiend'],
        bossName: 'Nether Lord'
    },
    void: {
        name: 'THE VOID',
        bg: '#090514',
        biomes: [
            { name: 'Astral Plains', bg: '#2e1065', icon: '🔮', color: '#a855f7' },
            { name: 'Nebula Ridges', bg: '#4c1d95', icon: '🌌', color: '#c084fc' },
            { name: 'Ender Wastes', bg: '#1e1b4b', icon: '👁️', color: '#6366f1' },
            { name: 'Starfall Ruins', bg: '#312e81', icon: '✨', color: '#818cf8' }
        ],
        mobs: ['phantom', 'void_stalker'],
        bossName: 'Aetherion Goliath'
    }
};

// MOBS BY DIMENSION & BIOME
const MOBS = {
    goblin: { name: 'Goblin Scout', hp: 100, speed: 2.8, radius: 18, damage: 0.2, color: '#22c55e', dim: 'overworld' },
    scout: { name: 'Wild Hunter', hp: 140, speed: 2.4, radius: 20, damage: 0.3, color: '#16a34a', dim: 'overworld' },
    brute: { name: 'Orc Brute', hp: 260, speed: 1.6, radius: 26, damage: 0.6, color: '#b91c1c', dim: 'nether' },
    fire_fiend: { name: 'Fire Fiend', hp: 200, speed: 2.6, radius: 22, damage: 0.45, color: '#f97316', dim: 'nether' },
    phantom: { name: 'Phantom Mage', hp: 180, speed: 2.2, radius: 20, damage: 0.4, color: '#a855f7', dim: 'void' },
    void_stalker: { name: 'Void Stalker', hp: 320, speed: 3.0, radius: 24, damage: 0.7, color: '#c084fc', dim: 'void' },
    final_boss: { name: 'Aetherion Goliath', hp: 1200, speed: 1.4, radius: 42, damage: 1.2, color: '#facc15', dim: 'void' }
};

// STATE
let currentDim = 'overworld';
let player = {
    x: HALF_WORLD, y: HALF_WORLD, radius: 18, speed: 5.2,
    hp: 100, maxHp: 100, wood: 0, stone: 0, ore: 0,
    weaponKey: 'stick', weapon: WEAPONS.stick, facingAngle: 0,
    isAttacking: false, attackProgress: 0, currentBiome: ''
};

let bossesKilled = { overworld: false, nether: false, void: false };
let dimEntities = {
    overworld: { resources: [], enemies: [], structures: [] },
    nether: { resources: [], enemies: [], structures: [] },
    void: { resources: [], enemies: [], structures: [] }
};

let particles = [];
let floatingTexts = [];
let gameTime = 0;

setInterval(() => { gameTime++; updateTimeDisplay(); }, 1000);

function updateTimeDisplay() {
    const mins = Math.floor(gameTime / 60).toString().padStart(2, '0');
    const secs = (gameTime % 60).toString().padStart(2, '0');
    document.getElementById('time-val').innerText = `${mins}:${secs}`;
}

// GENERATE STRUCTURES AND CHESTS FOR EACH DIMENSION
function initWorldData() {
    Object.keys(DIMENSIONS).forEach(dim => {
        // Generate Resources
        for (let i = 0; i < 400; i++) {
            const types = ['tree', 'stone', 'ore'];
            const type = types[Math.floor(Math.random() * types.length)];
            dimEntities[dim].resources.push({
                x: Math.random() * (WORLD_SIZE - 400) + 200,
                y: Math.random() * (WORLD_SIZE - 400) + 200,
                type: type, hp: type === 'ore' ? 4 : type === 'stone' ? 3 : 2,
                maxHp: type === 'ore' ? 4 : type === 'stone' ? 3 : 2,
                scale: 1
            });
        }

        // Generate Structures & Loot Chests
        for (let i = 0; i < 25; i++) {
            dimEntities[dim].structures.push({
                x: Math.random() * (WORLD_SIZE - 600) + 300,
                y: Math.random() * (WORLD_SIZE - 600) + 300,
                width: 140, height: 140,
                hasChest: true, chestOpened: false
            });
        }

        // Generate Mobs Specific to Dimension
        const mobKeys = DIMENSIONS[dim].mobs;
        for (let i = 0; i < 70; i++) {
            const mKey = mobKeys[Math.floor(Math.random() * mobKeys.length)];
            const base = MOBS[mKey];
            dimEntities[dim].enemies.push({
                key: mKey, x: Math.random() * WORLD_SIZE, y: Math.random() * WORLD_SIZE,
                hp: base.hp, maxHp: base.hp, radius: base.radius, speed: base.speed,
                damage: base.damage, color: base.color, name: base.name, hitFlash: 0
            });
        }
    });

    // Spawn Final Boss in Void Citadel
    dimEntities['void'].enemies.push({
        key: 'final_boss', x: HALF_WORLD, y: HALF_WORLD - 200,
        hp: MOBS.final_boss.hp, maxHp: MOBS.final_boss.hp, radius: MOBS.final_boss.radius,
        speed: MOBS.final_boss.speed, damage: MOBS.final_boss.damage, color: MOBS.final_boss.color,
        name: MOBS.final_boss.name, hitFlash: 0, isBoss: true
    });
}

initWorldData();

// INPUT HANDLING
const keys = {};
let mouseX = canvas.width / 2, mouseY = canvas.height / 2;
window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
window.addEventListener('mousemove', e => { mouseX = e.clientX; mouseY = e.clientY; });

// DIMENSION TELEPORTATION
function switchDimension(dimName) {
    if (currentDim === dimName) return;
    currentDim = dimName;
    document.querySelectorAll('.dim-btn').forEach(btn => btn.classList.remove('active'));
    document.getElementById(`btn-${dimName}`).classList.add('active');
    showToast("🌀", `TELEPORTED TO ${DIMENSIONS[dimName].name}`);
}

// ATTACK & INTERACTION
canvas.addEventListener('pointerdown', () => {
    if (player.hp <= 0) return;

    player.isAttacking = true;
    player.attackProgress = 0;

    const currentData = dimEntities[currentDim];
    const swingX = player.x + Math.cos(player.facingAngle) * player.weapon.range * 0.6;
    const swingY = player.y + Math.sin(player.facingAngle) * player.weapon.range * 0.6;
    createParticles(swingX, swingY, player.weapon.color, 12);

    // Harvest Resources
    currentData.resources.forEach((res, index) => {
        if (Math.hypot(res.x - player.x, res.y - player.y) <= player.weapon.range + 20) {
            res.hp -= 1;
            res.scale = 1.3; // Tween pop scale
            const pColor = res.type === 'tree' ? '#4ade80' : res.type === 'stone' ? '#9ca3af' : '#38bdf8';
            createParticles(res.x, res.y, pColor, 6);
            spawnFloatingText(res.x, res.y, "-1", "#fbbf24");

            if (res.hp <= 0) {
                if (res.type === 'tree') player.wood += Math.floor(Math.random() * 4) + 3;
                if (res.type === 'stone') player.stone += Math.floor(Math.random() * 3) + 2;
                if (res.type === 'ore') player.ore += Math.floor(Math.random() * 3) + 1;
                currentData.resources.splice(index, 1);
                updateHUD();
            }
        }
    });

    // Open Loot Chests in Structures
    currentData.structures.forEach(struct => {
        if (struct.hasChest && !struct.chestOpened) {
            if (Math.hypot(struct.x - player.x, struct.y - player.y) <= player.weapon.range + 30) {
                struct.chestOpened = true;
                player.wood += 20; player.stone += 20; player.ore += 15;
                showToast("🎁", "CHEST OPENED: +20W +20S +15O!");
                createParticles(struct.x, struct.y, "#facc15", 25);
                updateHUD();
            }
        }
    });

    // Hit Mobs
    currentData.enemies.forEach((enemy, index) => {
        if (Math.hypot(enemy.x - player.x, enemy.y - player.y) <= player.weapon.range + enemy.radius) {
            let isCrit = Math.random() < 0.25;
            let dmg = isCrit ? Math.floor(player.weapon.damage * 1.5) : player.weapon.damage;
            
            enemy.hp -= dmg;
            enemy.hitFlash = 10;
            const angle = Math.atan2(enemy.y - player.y, enemy.x - player.x);
            enemy.x += Math.cos(angle) * 30;
            enemy.y += Math.sin(angle) * 30;

            createParticles(enemy.x, enemy.y, '#f87171', 10);
            spawnFloatingText(enemy.x, enemy.y, isCrit ? `💥 CRIT -${dmg}` : `-${dmg}`, isCrit ? "#facc15" : "#f87171");

            if (enemy.hp <= 0) {
                createParticles(enemy.x, enemy.y, '#ef4444', 20);
                if (enemy.isBoss) {
                    bossesKilled[currentDim] = true;
                    showToast("🏆", `${enemy.name.toUpperCase()} DEFEATED!`);
                }
                currentData.enemies.splice(index, 1);
                updateHUD();
            }
        }
    });
});

function createParticles(x, y, color, count) {
    for (let i = 0; i < count; i++) {
        particles.push({
            x: x, y: y,
            vx: (Math.random() - 0.5) * 8, vy: (Math.random() - 0.5) * 8,
            color: color, radius: Math.random() * 3 + 2, alpha: 1
        });
    }
}

function spawnFloatingText(x, y, text, color) {
    floatingTexts.push({ x: x, y: y, text: text, color: color, alpha: 1 });
}

function triggerDamageFlash() {
    const flashElem = document.getElementById('damage-flash');
    flashElem.style.opacity = '1';
    setTimeout(() => { flashElem.style.opacity = '0'; }, 150);
}

function respawnPlayer() {
    player.hp = player.maxHp;
    player.x = HALF_WORLD; player.y = HALF_WORLD;
    showToast("✨", "RESPAWNED! INVENTORY KEPT!");
    updateHUD();
}

function update() {
    if (player.hp <= 0) return;

    let dx = 0, dy = 0;
    if (keys['w']) dy -= 1;
    if (keys['s']) dy += 1;
    if (keys['a']) dx -= 1;
    if (keys['d']) dx += 1;

    if (dx !== 0 && dy !== 0) { dx *= 0.7071; dy *= 0.7071; }

    player.x = Math.max(player.radius, Math.min(WORLD_SIZE - player.radius, player.x + dx * player.speed));
    player.y = Math.max(player.radius, Math.min(WORLD_SIZE - player.radius, player.y + dy * player.speed));

    const cameraX = player.x - canvas.width / 2;
    const cameraY = player.y - canvas.height / 2;
    player.facingAngle = Math.atan2((mouseY + cameraY) - player.y, (mouseX + cameraX) - player.x);

    if (player.isAttacking) {
        player.attackProgress += 0.18;
        if (player.attackProgress >= 1) { player.isAttacking = false; player.attackProgress = 0; }
    }

    // Biome Check
    const dimConfig = DIMENSIONS[currentDim];
    let biomeIdx = 0;
    if (player.x >= HALF_WORLD && player.y < HALF_WORLD) biomeIdx = 1;
    else if (player.x < HALF_WORLD && player.y >= HALF_WORLD) biomeIdx = 2;
    else if (player.x >= HALF_WORLD && player.y >= HALF_WORLD) biomeIdx = 3;

    const currentBiomeObj = dimConfig.biomes[biomeIdx];
    if (player.currentBiome !== currentBiomeObj.name) {
        player.currentBiome = currentBiomeObj.name;
        showToast(currentBiomeObj.icon, `BIOME: ${currentBiomeObj.name}`);
    }

    // Update Particles
    particles.forEach((p, i) => {
        p.x += p.vx; p.y += p.vy; p.alpha -= 0.04;
        if (p.alpha <= 0) particles.splice(i, 1);
    });

    // Enemy AI Movement & Attack
    const currentData = dimEntities[currentDim];
    currentData.enemies.forEach(enemy => {
        if (enemy.hitFlash > 0) enemy.hitFlash--;

        const dist = Math.hypot(player.x - enemy.x, player.y - enemy.y);
        if (dist < 600) {
            const angle = Math.atan2(player.y - enemy.y, player.x - enemy.x);
            enemy.x += Math.cos(angle) * enemy.speed;
            enemy.y += Math.sin(angle) * enemy.speed;
        }

        if (dist < player.radius + enemy.radius) {
            player.hp -= enemy.damage;
            triggerDamageFlash();
            updateHUD();
            if (player.hp <= 0) respawnPlayer();
        }
    });

    // Scale Tweens Decay
    currentData.resources.forEach(res => {
        if (res.scale > 1) res.scale -= 0.05;
    });
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const cameraX = player.x - canvas.width / 2;
    const cameraY = player.y - canvas.height / 2;

    const dimConfig = DIMENSIONS[currentDim];

    // Draw Biomes
    drawBiomeSquare(0, 0, HALF_WORLD, HALF_WORLD, dimConfig.biomes[0], cameraX, cameraY);
    drawBiomeSquare(HALF_WORLD, 0, HALF_WORLD, HALF_WORLD, dimConfig.biomes[1], cameraX, cameraY);
    drawBiomeSquare(0, HALF_WORLD, HALF_WORLD, HALF_WORLD, dimConfig.biomes[2], cameraX, cameraY);
    drawBiomeSquare(HALF_WORLD, HALF_WORLD, HALF_WORLD, HALF_WORLD, dimConfig.biomes[3], cameraX, cameraY);

    // Draw Central Citadel
    const citX = HALF_WORLD - cameraX, citY = HALF_WORLD - cameraY;
    ctx.fillStyle = "rgba(147, 51, 234, 0.25)";
    ctx.beginPath(); ctx.arc(citX, citY, 70, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#c084fc"; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(citX, citY, 70, 0, Math.PI * 2); ctx.stroke();

    const currentData = dimEntities[currentDim];

    // Draw Structures & Loot Chests
    currentData.structures.forEach(struct => {
        const sx = struct.x - cameraX, sy = struct.y - cameraY;
        ctx.fillStyle = "rgba(30, 41, 59, 0.85)";
        ctx.fillRect(sx - struct.width / 2, sy - struct.height / 2, struct.width, struct.height);
        ctx.strokeStyle = "#64748b"; ctx.lineWidth = 3;
        ctx.strokeRect(sx - struct.width / 2, sy - struct.height / 2, struct.width, struct.height);

        if (struct.hasChest) {
            ctx.fillStyle = struct.chestOpened ? "#64748b" : "#fbbf24";
            ctx.fillRect(sx - 12, sy - 12, 24, 24);
        }
    });

    // Draw Resources
    currentData.resources.forEach(res => {
        const rx = res.x - cameraX, ry = res.y - cameraY;
        ctx.save(); ctx.translate(rx, ry); ctx.scale(res.scale, res.scale);
        if (res.type === 'tree') {
            ctx.fillStyle = "#523a28"; ctx.fillRect(-4, -4, 8, 14);
            ctx.fillStyle = "#15803d"; ctx.beginPath(); ctx.arc(0, -12, 16, 0, Math.PI * 2); ctx.fill();
        } else if (res.type === 'stone') {
            ctx.fillStyle = "#6b7280"; ctx.beginPath(); ctx.arc(0, 0, 12, 0, Math.PI * 2); ctx.fill();
        } else if (res.type === 'ore') {
            ctx.fillStyle = "#374151"; ctx.beginPath(); ctx.arc(0, 0, 12, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = "#38bdf8"; ctx.beginPath(); ctx.arc(-2, -2, 6, 0, Math.PI * 2); ctx.fill();
        }
        ctx.restore();
    });

    // Draw Enemies
    currentData.enemies.forEach(e => {
        const ex = e.x - cameraX, ey = e.y - cameraY;
        ctx.fillStyle = e.hitFlash > 0 ? "#ffffff" : e.color;
        ctx.beginPath(); ctx.arc(ex, ey, e.radius, 0, Math.PI * 2); ctx.fill();

        // Enemy Overhead Bar
        const barW = 40, barH = 4;
        ctx.fillStyle = "rgba(0,0,0,0.6)"; ctx.fillRect(ex - barW / 2, ey - e.radius - 12, barW, barH);
        const hpPct = Math.max(0, e.hp / e.maxHp);
        ctx.fillStyle = "#ef4444"; ctx.fillRect(ex - barW / 2, ey - e.radius - 12, barW * hpPct, barH);
    });

    // Draw Player & Weapon
    const px = canvas.width / 2, py = canvas.height / 2;
    ctx.fillStyle = "#2563eb"; ctx.beginPath(); ctx.arc(px, py, player.radius, 0, Math.PI * 2); ctx.fill();

    ctx.save(); ctx.translate(px, py);
    let swingAngle = player.facingAngle;
    if (player.isAttacking) swingAngle += Math.sin(player.attackProgress * Math.PI) * 1.5 - 0.75;
    ctx.rotate(swingAngle);
    ctx.fillStyle = player.weapon.color; ctx.fillRect(10, -3, player.weapon.range * 0.55, 6);
    ctx.restore();

    // Draw Particles & Floating Text
    particles.forEach(p => {
        ctx.fillStyle = p.color; ctx.globalAlpha = p.alpha;
        ctx.beginPath(); ctx.arc(p.x - cameraX, p.y - cameraY, p.radius, 0, Math.PI * 2); ctx.fill(); ctx.globalAlpha = 1.0;
    });

    floatingTexts.forEach((ft, i) => {
        ctx.fillStyle = ft.color; ctx.globalAlpha = ft.alpha;
        ctx.font = "800 14px 'Plus Jakarta Sans', sans-serif"; ctx.textAlign = "center";
        ctx.fillText(ft.text, ft.x - cameraX, ft.y - cameraY);
        ctx.globalAlpha = 1.0; ft.y -= 0.8; ft.alpha -= 0.035;
        if (ft.alpha <= 0) floatingTexts.splice(i, 1);
    });

    drawMinimap();
}

function drawBiomeSquare(x, y, w, h, biomeObj, camX, camY) {
    ctx.fillStyle = biomeObj.bg; ctx.fillRect(x - camX, y - camY, w, h);
}

function drawMinimap() {
    const scale = 170 / WORLD_SIZE;
    minimapCtx.clearRect(0, 0, 170, 170);

    const dimConfig = DIMENSIONS[currentDim];
    minimapCtx.fillStyle = dimConfig.biomes[0].bg; minimapCtx.fillRect(0, 0, 85, 85);
    minimapCtx.fillStyle = dimConfig.biomes[1].bg; minimapCtx.fillRect(85, 0, 85, 85);
    minimapCtx.fillStyle = dimConfig.biomes[2].bg; minimapCtx.fillRect(0, 85, 85, 85);
    minimapCtx.fillStyle = dimConfig.biomes[3].bg; minimapCtx.fillRect(85, 85, 85, 85);

    // Draw Structures on Minimap
    const currentData = dimEntities[currentDim];
    minimapCtx.fillStyle = "#fbbf24";
    currentData.structures.forEach(struct => {
        minimapCtx.fillRect(struct.x * scale - 2, struct.y * scale - 2, 4, 4);
    });

    // Draw Player
    minimapCtx.fillStyle = "#ffffff";
    minimapCtx.beginPath(); minimapCtx.arc(player.x * scale, player.y * scale, 3, 0, Math.PI * 2); minimapCtx.fill();
}

function loop() { update(); draw(); requestAnimationFrame(loop); }

function updateHUD() {
    const hpPct = Math.max(0, (player.hp / player.maxHp) * 100);
    document.getElementById('hp-bar').style.width = `${hpPct}%`;
    document.getElementById('hp-text').innerText = `${Math.ceil(player.hp)} / ${player.maxHp} HP`;
    document.getElementById('wood-val').innerText = player.wood;
    document.getElementById('stone-val').innerText = player.stone;
    document.getElementById('ore-val').innerText = player.ore;
    
    let wElem = document.getElementById('weapon-val');
    wElem.innerText = player.weapon.name;
    wElem.className = `rarity-${player.weapon.rarity}`;
}

function showToast(icon, msg) {
    const container = document.getElementById('toast-container');
    const toast = document.getElementById('toast-msg');
    toast.children[0].innerText = icon;
    toast.children[1].innerText = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2200);
}

function craftItem(type) {
    if (type === 'spear' && player.wood >= 10 && player.stone >= 10) {
        player.wood -= 10; player.stone -= 10; player.weaponKey = 'spear'; player.weapon = WEAPONS.spear;
        showToast("🗡️", "CRAFTED: Stone Spear!");
    } else if (type === 'hammer' && player.wood >= 15 && player.ore >= 20) {
        player.wood -= 15; player.ore -= 20; player.weaponKey = 'hammer'; player.weapon = WEAPONS.hammer;
        showToast("🔨", "CRAFTED: Ore Sledge!");
    } else if (type === 'blade' && player.wood >= 25 && player.stone >= 25 && player.ore >= 15) {
        player.wood -= 25; player.stone -= 25; player.ore -= 15; player.weaponKey = 'blade'; player.weapon = WEAPONS.blade;
        showToast("⚡", "CRAFTED: Plasma Sword!");
    } else if (type === 'scythe' && player.wood >= 40 && player.stone >= 40 && player.ore >= 30) {
        player.wood -= 40; player.stone -= 40; player.ore -= 30; player.weaponKey = 'scythe'; player.weapon = WEAPONS.scythe;
        showToast("🔮", "CRAFTED: Void Scythe!");
    } else if (type === 'heal' && player.wood >= 5 && player.stone >= 5) {
        player.wood -= 5; player.stone -= 5; player.hp = Math.min(100, player.hp + 45);
        showToast("🧪", "RECOVERED +45 HP!");
    } else {
        showToast("⚠️", "NOT ENOUGH MATERIALS!");
    }
    updateHUD();
}

updateHUD();
loop();
</script>
