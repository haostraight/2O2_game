<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Survival Realm</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { background: #0c0d12; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; }
        
        #gameCanvas { display: block; width: 100vw; height: 100vh; background: #111; cursor: crosshair; }

        /* Biome Toast Pop-up */
        #biome-toast {
            position: absolute; top: 8%; left: 50%; transform: translate(-50%, -50%);
            font-size: 22px; font-weight: 800; letter-spacing: 3px; color: #fff;
            text-shadow: 0 4px 12px rgba(0,0,0,0.8); background: rgba(15, 18, 25, 0.88);
            padding: 12px 28px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.25);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5); opacity: 0;
            transition: opacity 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), transform 0.4s ease; pointer-events: none;
        }
        #biome-toast.show { opacity: 1; transform: translate(-50%, -10%); }

        /* Stats HUD */
        #stats-hud {
            position: absolute; top: 20px; left: 20px; background: rgba(18, 22, 32, 0.88);
            padding: 14px 20px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 20px rgba(0,0,0,0.4); font-size: 14px; backdrop-filter: blur(8px); pointer-events: none;
        }
        .stat-bar { margin: 5px 0; font-weight: 600; display: flex; align-items: center; gap: 8px; }
        .rarity-Common { color: #d1d5db; font-weight: 700; }
        .rarity-Uncommon { color: #22c55e; font-weight: 700; }
        .rarity-Rare { color: #3b82f6; font-weight: 700; }
        .rarity-Legendary { color: #f97316; font-weight: 700; }

        /* Crafting Panel */
        #crafting-panel {
            position: absolute; bottom: 20px; left: 20px; background: rgba(18, 22, 32, 0.88);
            border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 14px; padding: 14px; max-width: 320px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4); backdrop-filter: blur(8px);
        }
        #crafting-panel h3 { margin-bottom: 10px; font-size: 14px; color: #fbbf24; text-transform: uppercase; letter-spacing: 1px; }
        .craft-btn {
            display: flex; justify-content: space-between; align-items: center;
            width: 100%; margin: 6px 0; padding: 8px 12px; background: rgba(255, 255, 255, 0.06);
            color: #f3f4f6; border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 8px; cursor: pointer;
            font-size: 12px; font-weight: 600; font-family: inherit; transition: all 0.2s ease;
        }
        .craft-btn:hover { background: rgba(251, 191, 36, 0.2); border-color: #fbbf24; transform: translateY(-1px); }
    </style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<div id="biome-toast">DISCOVERED: PLAINS</div>

<div id="stats-hud">
    <div class="stat-bar">❤️ HP: <span id="hp-val">100</span></div>
    <div class="stat-bar">🪵 Wood: <span id="wood-val">0</span> | 🪨 Stone: <span id="stone-val">0</span> | 💎 Ore: <span id="ore-val">0</span></div>
    <div class="stat-bar">⚔️ Weapon: <span id="weapon-val" class="rarity-Common">Wooden Stick (Common)</span></div>
    <div style="font-size: 11px; color: #9ca3af; margin-top: 6px;">[WASD] Move | [Click] Attack & Mine</div>
</div>

<div id="crafting-panel">
    <h3>Crafting Bench</h3>
    <button class="craft-btn" onclick="craftItem('spear')"><span>🗡️ Stone Spear</span><small>10W 10S</small></button>
    <button class="craft-btn" onclick="craftItem('hammer')"><span>🔨 Ore Sledge</span><small>15W 20O</small></button>
    <button class="craft-btn" onclick="craftItem('blade')"><span>⚡ Plasma Sword</span><small>20W 20S 15O</small></button>
    <button class="craft-btn" onclick="craftItem('heal')"><span>🧪 Healing Salve</span><small>5W 5S</small></button>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

// CONFIGURATION
const WORLD_SIZE = 3600;
const HALF_WORLD = WORLD_SIZE / 2;

const WEAPONS = {
    stick:  { name: 'Wooden Stick', damage: 15, range: 55, rarity: 'Common', color: '#d1d5db', type: 'blunt' },
    spear:  { name: 'Stone Spear', damage: 32, range: 80, rarity: 'Uncommon', color: '#22c55e', type: 'pierce' },
    hammer: { name: 'Ore Sledge', damage: 60, range: 65, rarity: 'Rare', color: '#3b82f6', type: 'heavy' },
    blade:  { name: 'Plasma Sword', damage: 100, range: 95, rarity: 'Legendary', color: '#f97316', type: 'magic' }
};

const BIOMES = {
    TOP_LEFT:     { name: 'VERDANT FORESTS', bg: '#234a31', accent: '#1b3825' },
    TOP_RIGHT:    { name: 'GOLDEN DESERT', bg: '#c29b38', accent: '#a3802b' },
    BOTTOM_LEFT:  { name: 'FROST PEAKS', bg: '#7197a8', accent: '#587a8a' },
    BOTTOM_RIGHT: { name: 'CORRUPTED LANDS', bg: '#3b1c48', accent: '#2a1334' }
};

// PLAYER STATE
let player = {
    x: HALF_WORLD, y: HALF_WORLD,
    radius: 18, speed: 4.2, hp: 100, maxHp: 100,
    wood: 0, stone: 0, ore: 0,
    weapon: WEAPONS.stick, currentBiome: '',
    facingAngle: 0, isAttacking: false, attackProgress: 0
};

// INPUT REGISTRATION
const keys = {};
let mouseX = 0, mouseY = 0;

window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
window.addEventListener('mousemove', e => {
    mouseX = e.clientX;
    mouseY = e.clientY;
});

// GAME ENTITIES
let resources = [];
let enemies = [];
let particles = [];
let floatingTexts = [];

// GENERATE DECORATIVE TILES FOR TERRAIN
const terrainDetails = [];
for (let i = 0; i < 350; i++) {
    terrainDetails.push({
        x: Math.random() * WORLD_SIZE,
        y: Math.random() * WORLD_SIZE,
        size: Math.random() * 8 + 4
    });
}

// SPAWN RESOURCES
for (let i = 0; i < 220; i++) {
    const types = ['tree', 'stone', 'ore'];
    const type = types[Math.floor(Math.random() * types.length)];
    resources.push({
        x: Math.random() * (WORLD_SIZE - 200) + 100,
        y: Math.random() * (WORLD_SIZE - 200) + 100,
        type: type,
        hp: type === 'ore' ? 3 : type === 'stone' ? 2 : 1,
        variation: Math.floor(Math.random() * 3)
    });
}

// SPAWN ENEMIES
for (let i = 0; i < 35; i++) {
    let ex = Math.random() * WORLD_SIZE;
    let ey = Math.random() * WORLD_SIZE;
    if (Math.hypot(ex - player.x, ey - player.y) > 400) {
        enemies.push({ x: ex, y: ey, hp: 50, maxHp: 50, radius: 16, speed: 2.1, pulse: Math.random() * Math.PI });
    }
}

// ATTACK & HARVEST MECHANIC
canvas.addEventListener('pointerdown', () => {
    if (player.hp <= 0) return;

    player.isAttacking = true;
    player.attackProgress = 0;

    // Particle burst at weapon swing location
    const swingX = player.x + Math.cos(player.facingAngle) * player.weapon.range * 0.7;
    const swingY = player.y + Math.sin(player.facingAngle) * player.weapon.range * 0.7;
    
    createParticles(swingX, swingY, player.weapon.color, 12);

    // Harvest Resources
    resources.forEach((res, index) => {
        if (Math.hypot(res.x - player.x, res.y - player.y) <= player.weapon.range + 20) {
            res.hp -= 1;
            createParticles(res.x, res.y, res.type === 'tree' ? '#2d6a4f' : res.type === 'stone' ? '#9ca3af' : '#00ffff', 8);
            spawnFloatingText(res.x, res.y, "-1", "#fbbf24");

            if (res.hp <= 0) {
                if (res.type === 'tree') player.wood += Math.floor(Math.random() * 3) + 3;
                if (res.type === 'stone') player.stone += Math.floor(Math.random() * 3) + 2;
                if (res.type === 'ore') player.ore += Math.floor(Math.random() * 2) + 1;
                resources.splice(index, 1);
                updateHUD();
            }
        }
    });

    // Damage Enemies
    enemies.forEach((enemy, index) => {
        if (Math.hypot(enemy.x - player.x, enemy.y - player.y) <= player.weapon.range + enemy.radius + 10) {
            enemy.hp -= player.weapon.damage;
            
            // Knockback
            const angle = Math.atan2(enemy.y - player.y, enemy.x - player.x);
            enemy.x += Math.cos(angle) * 45;
            enemy.y += Math.sin(angle) * 45;

            createParticles(enemy.x, enemy.y, '#ef4444', 10);
            spawnFloatingText(enemy.x, enemy.y, `-${player.weapon.damage}`, "#ef4444");

            if (enemy.hp <= 0) {
                createParticles(enemy.x, enemy.y, '#f87171', 20);
                enemies.splice(index, 1);
            }
        }
    });
});

function createParticles(x, y, color, count) {
    for (let i = 0; i < count; i++) {
        particles.push({
            x: x, y: y,
            vx: (Math.random() - 0.5) * 8,
            vy: (Math.random() - 0.5) * 8,
            color: color,
            radius: Math.random() * 4 + 2,
            alpha: 1,
            life: Math.random() * 20 + 10
        });
    }
}

function spawnFloatingText(x, y, text, color) {
    floatingTexts.push({ x: x, y: y, text: text, color: color, alpha: 1 });
}

function update() {
    if (player.hp <= 0) return;

    // Movement
    let dx = 0, dy = 0;
    if (keys['w']) dy -= 1;
    if (keys['s']) dy += 1;
    if (keys['a']) dx -= 1;
    if (keys['d']) dx += 1;

    if (dx !== 0 && dy !== 0) { dx *= 0.7071; dy *= 0.7071; }

    player.x = Math.max(player.radius, Math.min(WORLD_SIZE - player.radius, player.x + dx * player.speed));
    player.y = Math.max(player.radius, Math.min(WORLD_SIZE - player.radius, player.y + dy * player.speed));

    // Player Direction Angle to Mouse
    const cameraX = player.x - canvas.width / 2;
    const cameraY = player.y - canvas.height / 2;
    player.facingAngle = Math.atan2((mouseY + cameraY) - player.y, (mouseX + cameraX) - player.x);

    // Weapon Swing Animation Progress
    if (player.isAttacking) {
        player.attackProgress += 0.15;
        if (player.attackProgress >= 1) {
            player.isAttacking = false;
            player.attackProgress = 0;
        }
    }

    // Biome Check
    let biome = BIOMES.TOP_LEFT.name;
    if (player.x >= HALF_WORLD && player.y < HALF_WORLD) biome = BIOMES.TOP_RIGHT.name;
    else if (player.x < HALF_WORLD && player.y >= HALF_WORLD) biome = BIOMES.BOTTOM_LEFT.name;
    else if (player.x >= HALF_WORLD && player.y >= HALF_WORLD) biome = BIOMES.BOTTOM_RIGHT.name;

    if (player.currentBiome !== biome) {
        player.currentBiome = biome;
        showToast("ENTERED: " + biome);
    }

    // Particles Update
    particles.forEach((p, i) => {
        p.x += p.vx; p.y += p.vy;
        p.alpha -= 0.04;
        if (p.alpha <= 0) particles.splice(i, 1);
    });

    // Enemy AI & Attack
    enemies.forEach(enemy => {
        enemy.pulse += 0.05;
        const dist = Math.hypot(player.x - enemy.x, player.y - enemy.y);
        if (dist < 480) {
            const angle = Math.atan2(player.y - enemy.y, player.x - enemy.x);
            enemy.x += Math.cos(angle) * enemy.speed;
            enemy.y += Math.sin(angle) * enemy.speed;
        }

        if (dist < player.radius + enemy.radius) {
            player.hp -= 0.3;
            updateHUD();
            if (player.hp <= 0) showToast("GAME OVER! Refresh to Restart.");
        }
    });
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const cameraX = player.x - canvas.width / 2;
    const cameraY = player.y - canvas.height / 2;

    // Draw Biomes
    ctx.fillStyle = BIOMES.TOP_LEFT.bg;
    ctx.fillRect(0 - cameraX, 0 - cameraY, HALF_WORLD, HALF_WORLD);

    ctx.fillStyle = BIOMES.TOP_RIGHT.bg;
    ctx.fillRect(HALF_WORLD - cameraX, 0 - cameraY, HALF_WORLD, HALF_WORLD);

    ctx.fillStyle = BIOMES.BOTTOM_LEFT.bg;
    ctx.fillRect(0 - cameraX, HALF_WORLD - cameraY, HALF_WORLD, HALF_WORLD);

    ctx.fillStyle = BIOMES.BOTTOM_RIGHT.bg;
    ctx.fillRect(HALF_WORLD - cameraX, HALF_WORLD - cameraY, HALF_WORLD, HALF_WORLD);

    // Draw Decorative Terrain Texture Features
    terrainDetails.forEach(t => {
        ctx.fillStyle = "rgba(0, 0, 0, 0.08)";
        ctx.beginPath();
        ctx.arc(t.x - cameraX, t.y - cameraY, t.size, 0, Math.PI * 2);
        ctx.fill();
    });

    // Draw Detailed Resources
    resources.forEach(res => {
        const rx = res.x - cameraX;
        const ry = res.y - cameraY;

        if (res.type === 'tree') {
            // Shadow
            ctx.fillStyle = "rgba(0,0,0,0.25)";
            ctx.beginPath(); ctx.ellipse(rx, ry + 12, 16, 6, 0, 0, Math.PI * 2); ctx.fill();
            // Trunk
            ctx.fillStyle = "#5c3d2e";
            ctx.fillRect(rx - 5, ry - 4, 10, 16);
            // Foliage Layers
            ctx.fillStyle = "#1b4332";
            ctx.beginPath(); ctx.arc(rx, ry - 12, 18, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = "#2d6a4f";
            ctx.beginPath(); ctx.arc(rx - 4, ry - 16, 12, 0, Math.PI * 2); ctx.fill();
        } else if (res.type === 'stone') {
            // Shadow
            ctx.fillStyle = "rgba(0,0,0,0.25)";
            ctx.beginPath(); ctx.ellipse(rx, ry + 8, 14, 5, 0, 0, Math.PI * 2); ctx.fill();
            // Rock Body
            ctx.fillStyle = "#6b7280";
            ctx.beginPath(); ctx.arc(rx, ry, 14, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = "#9ca3af";
            ctx.beginPath(); ctx.arc(rx - 3, ry - 3, 8, 0, Math.PI * 2); ctx.fill();
        } else if (res.type === 'ore') {
            // Shadow
            ctx.fillStyle = "rgba(0,0,0,0.25)";
            ctx.beginPath(); ctx.ellipse(rx, ry + 8, 12, 4, 0, 0, Math.PI * 2); ctx.fill();
            // Ore Crystals
            ctx.fillStyle = "#4b5563";
            ctx.beginPath(); ctx.arc(rx, ry, 12, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = "#00ffff";
            ctx.beginPath(); ctx.arc(rx - 2, ry - 2, 6, 0, Math.PI * 2); ctx.fill();
        }
    });

    // Draw Detailed Enemies (Slime / Goblin hybrid)
    enemies.forEach(enemy => {
        const ex = enemy.x - cameraX;
        const ey = enemy.y - cameraY;
        const pSize = Math.sin(enemy.pulse) * 1.5;

        // Enemy Shadow
        ctx.fillStyle = "rgba(0,0,0,0.3)";
        ctx.beginPath(); ctx.ellipse(ex, ey + 12, 14, 5, 0, 0, Math.PI * 2); ctx.fill();

        // Enemy Body
        ctx.fillStyle = "#dc2626";
        ctx.beginPath(); ctx.arc(ex, ey, enemy.radius + pSize, 0, Math.PI * 2); ctx.fill();

        // Glowing Eyes
        ctx.fillStyle = "#fef08a";
        ctx.beginPath(); ctx.arc(ex - 4, ey - 3, 3, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(ex + 4, ey - 3, 3, 0, Math.PI * 2); ctx.fill();
        
        // Pupil
        ctx.fillStyle = "#000";
        ctx.beginPath(); ctx.arc(ex - 4, ey - 3, 1.5, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(ex + 4, ey - 3, 1.5, 0, Math.PI * 2); ctx.fill();
    });

    // Draw Player Character
    const px = canvas.width / 2;
    const py = canvas.height / 2;

    // Player Shadow
    ctx.fillStyle = "rgba(0,0,0,0.35)";
    ctx.beginPath(); ctx.ellipse(px, py + 14, 16, 6, 0, 0, Math.PI * 2); ctx.fill();

    // Body/Tunic
    ctx.fillStyle = "#0284c7";
    ctx.beginPath(); ctx.arc(px, py, player.radius, 0, Math.PI * 2); ctx.fill();

    // Head/Skin Tone
    ctx.fillStyle = "#fde047";
    ctx.beginPath(); ctx.arc(px, py - 2, player.radius * 0.6, 0, Math.PI * 2); ctx.fill();

    // Eyes pointing towards cursor
    const eyeOffset = 3;
    const eyeX = px + Math.cos(player.facingAngle) * eyeOffset;
    const eyeY = py + Math.sin(player.facingAngle) * eyeOffset - 2;
    ctx.fillStyle = "#0f172a";
    ctx.beginPath(); ctx.arc(eyeX - 2, eyeY, 2, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(eyeX + 2, eyeY, 2, 0, Math.PI * 2); ctx.fill();

    // Weapon Swing Animation
    ctx.save();
    ctx.translate(px, py);
    let swingAngle = player.facingAngle;
    if (player.isAttacking) {
        swingAngle += Math.sin(player.attackProgress * Math.PI) * 1.2 - 0.6;
    }
    ctx.rotate(swingAngle);

    // Draw Equipped Weapon
    ctx.fillStyle = player.weapon.color;
    ctx.fillRect(10, -3, player.weapon.range * 0.6, 6);
    ctx.restore();

    // Draw Particles
    particles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.alpha;
        ctx.beginPath(); ctx.arc(p.x - cameraX, p.y - cameraY, p.radius, 0, Math.PI * 2); ctx.fill();
        ctx.globalAlpha = 1.0;
    });

    // Floating Text
    floatingTexts.forEach((ft, i) => {
        ctx.fillStyle = ft.color;
        ctx.globalAlpha = ft.alpha;
        ctx.font = "800 16px sans-serif";
        ctx.fillText(ft.text, ft.x - cameraX, ft.y - cameraY);
        ctx.globalAlpha = 1.0;
        ft.y -= 0.8; ft.alpha -= 0.03;
        if (ft.alpha <= 0) floatingTexts.splice(i, 1);
    });

    // Minimap Rendering
    const mapSize = 140;
    const mapX = canvas.width - mapSize - 20;
    const mapY = 20;
    const scale = mapSize / WORLD_SIZE;

    ctx.fillStyle = "rgba(15, 23, 42, 0.9)";
    ctx.fillRect(mapX, mapY, mapSize, mapSize);
    ctx.strokeStyle = "rgba(255, 255, 255, 0.2)";
    ctx.lineWidth = 2;
    ctx.strokeRect(mapX, mapY, mapSize, mapSize);

    // Player Dot
    ctx.fillStyle = "#38bdf8";
    ctx.beginPath(); ctx.arc(mapX + player.x * scale, mapY + player.y * scale, 3.5, 0, Math.PI * 2); ctx.fill();

    // Enemy Dots
    ctx.fillStyle = "#ef4444";
    enemies.forEach(e => { ctx.fillRect(mapX + e.x * scale, mapY + e.y * scale, 2.5, 2.5); });
}

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}

function updateHUD() {
    document.getElementById('hp-val').innerText = Math.max(0, Math.floor(player.hp));
    document.getElementById('wood-val').innerText = player.wood;
    document.getElementById('stone-val').innerText = player.stone;
    document.getElementById('ore-val').innerText = player.ore;
    
    let wElem = document.getElementById('weapon-val');
    wElem.innerText = `${player.weapon.name} (${player.weapon.rarity})`;
    wElem.className = `rarity-${player.weapon.rarity}`;
}

function showToast(msg) {
    const toast = document.getElementById('biome-toast');
    toast.innerText = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2200);
}

function craftItem(type) {
    if (type === 'spear' && player.wood >= 10 && player.stone >= 10) {
        player.wood -= 10; player.stone -= 10; player.weapon = WEAPONS.spear;
        showToast("CRAFTED: Stone Spear!");
    } else if (type === 'hammer' && player.wood >= 15 && player.ore >= 20) {
        player.wood -= 15; player.ore -= 20; player.weapon = WEAPONS.hammer;
        showToast("CRAFTED: Ore Sledge!");
    } else if (type === 'blade' && player.wood >= 20 && player.stone >= 20 && player.ore >= 15) {
        player.wood -= 20; player.stone -= 20; player.ore -= 15; player.weapon = WEAPONS.blade;
        showToast("CRAFTED: Plasma Sword!");
    } else if (type === 'heal' && player.wood >= 5 && player.stone >= 5) {
        player.wood -= 5; player.stone -= 5; player.hp = Math.min(100, player.hp + 40);
        showToast("HEALED +40 HP!");
    } else {
        showToast("NOT ENOUGH RESOURCES!");
    }
    updateHUD();
}

loop();
</script>
</body>
</html>
