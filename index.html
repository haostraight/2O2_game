<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Survival Realm: Multi-Dimensional Quest</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        :root {
            --font-sans: 'Plus Jakarta Sans', sans-serif;
            --font-display: 'Space Grotesk', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: #030712;
            color: #f9fafb;
            font-family: var(--font-sans);
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        #gameCanvas {
            display: block;
            width: 100vw;
            height: 100vh;
            background: #030712;
            cursor: crosshair;
        }

        .glass-panel {
            background: rgba(15, 23, 42, 0.90);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        .glass-panel-glow {
            box-shadow: 0 0 30px rgba(99, 102, 241, 0.2), 0 20px 50px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.2);
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.5); border-radius: 99px; }
        ::-webkit-scrollbar-thumb { background: rgba(99, 102, 241, 0.5); border-radius: 99px; }

        /* ROBLOX-STYLE HOTBAR SLOTS WITH TEXT LABELS */
        .roblox-slot {
            width: 72px;
            height: 64px;
            position: relative;
            background: rgba(15, 23, 42, 0.85);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.12s ease-in-out;
            padding: 2px;
        }

        .roblox-slot:hover {
            border-color: rgba(255, 255, 255, 0.6);
            background: rgba(30, 41, 59, 0.9);
        }

        .roblox-slot.equipped {
            border-color: #38bdf8;
            box-shadow: 0 0 18px rgba(56, 189, 248, 0.8);
            background: rgba(14, 116, 144, 0.6);
            transform: translateY(-4px);
        }

        .roblox-key-num {
            position: absolute;
            top: 2px;
            left: 5px;
            font-size: 10px;
            font-weight: 900;
            color: rgba(255, 255, 255, 0.7);
            font-family: var(--font-display);
        }

        .item-count {
            position: absolute;
            top: 2px;
            right: 4px;
            font-size: 10px;
            font-weight: 800;
            color: #38bdf8;
            background: rgba(0, 0, 0, 0.8);
            padding: 0 4px;
            border-radius: 4px;
        }

        .slot-title {
            font-size: 9px;
            font-weight: 700;
            color: #e2e8f0;
            text-align: center;
            line-height: 1;
            margin-top: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 66px;
        }
    </style>
</head>
<body class="relative min-h-screen select-none overflow-hidden bg-gray-950 font-sans text-gray-100">

<canvas id="gameCanvas"></canvas>
<div id="toast-container" class="pointer-events-none absolute top-6 left-1/2 z-30 flex -translate-x-1/2 flex-col items-center gap-2"></div>

<!-- CHEST INTERACTION PROMPT -->
<div id="chest-prompt" class="pointer-events-none fixed bottom-28 left-1/2 z-30 hidden -translate-x-1/2 rounded-full border border-amber-400/40 bg-slate-900/90 px-5 py-2 text-xs font-bold text-amber-300 shadow-2xl backdrop-blur-md">
    📦 Press <span class="rounded bg-amber-500/20 px-2 py-0.5 text-white border border-amber-400/50">[E]</span> to Open Loot Chest
</div>

<!-- REFRESHED SURVIVOR HUD -->
<div id="stats-hud" class="glass-panel glass-panel-glow pointer-events-auto absolute top-5 left-5 z-20 w-80 rounded-2xl p-4">
    <div class="mb-3 flex items-center justify-between border-b border-white/10 pb-2">
        <div class="flex items-center gap-2">
            <span class="inline-block h-2.5 w-2.5 rounded-full bg-emerald-400 shadow-[0_0_8px_#34d399]"></span>
            <span class="font-display text-xs font-bold tracking-widest text-gray-300 uppercase">SURVIVOR STATUS</span>
        </div>
        <button onclick="toggleBackpack()" class="rounded-lg bg-indigo-600/30 px-2.5 py-1 text-xs font-bold text-indigo-300 border border-indigo-400/30 hover:bg-indigo-600/50 transition-all">
            🎒 Backpack [`]
        </button>
    </div>

    <!-- Health Bar -->
    <div class="relative mb-3.5">
        <div class="mb-1 flex items-center justify-between text-xs font-bold">
            <span class="text-rose-400">HEALTH</span>
            <span id="hp-text" class="text-gray-200">100 / 100</span>
        </div>
        <div class="relative h-4 w-full overflow-hidden rounded-full border border-white/10 bg-black/50 p-0.5">
            <div id="hp-bar" class="h-full w-full rounded-full bg-gradient-to-r from-rose-600 via-rose-500 to-amber-500 transition-all duration-150"></div>
        </div>
    </div>

    <!-- Resource Grid (Clear Labels) -->
    <div class="mb-3 grid grid-cols-2 gap-2 text-left">
        <div class="rounded-lg border border-white/10 bg-white/[0.04] p-2 flex items-center justify-between">
            <span class="text-xs text-gray-300 font-medium">🪵 Wood</span>
            <span id="wood-val" class="font-display text-sm font-bold text-amber-300">0</span>
        </div>
        <div class="rounded-lg border border-white/10 bg-white/[0.04] p-2 flex items-center justify-between">
            <span class="text-xs text-gray-300 font-medium">🪨 Stone</span>
            <span id="stone-val" class="font-display text-sm font-bold text-slate-300">0</span>
        </div>
        <div class="rounded-lg border border-white/10 bg-white/[0.04] p-2 flex items-center justify-between">
            <span class="text-xs text-gray-300 font-medium">💎 Ore</span>
            <span id="ore-val" class="font-display text-sm font-bold text-cyan-300">0</span>
        </div>
        <div class="rounded-lg border border-purple-500/30 bg-purple-950/40 p-2 flex items-center justify-between">
            <span id="shard-label" class="text-xs text-purple-200 font-medium">🌿 Shards</span>
            <span id="shard-val" class="font-display text-sm font-bold text-emerald-300">0/3</span>
        </div>
    </div>

    <!-- Equipped Gear HUD -->
    <div class="flex flex-col gap-1.5 rounded-xl border border-white/10 bg-black/40 p-2.5 text-xs">
        <div class="flex items-center justify-between">
            <span class="text-gray-400">Weapon:</span>
            <span id="weapon-val" class="font-bold text-indigo-300">None</span>
        </div>
        <div class="flex flex-col border-t border-white/10 pt-1.5">
            <div class="flex items-center justify-between">
                <span class="text-gray-400">Armor:</span>
                <span id="armor-val" class="font-bold text-emerald-400">None</span>
            </div>
            <div id="armor-buff-val" class="mt-0.5 text-[10px] font-semibold text-emerald-300/80">
                Buff: No Active Armor
            </div>
        </div>
    </div>
</div>

<!-- ROBLOX-STYLE TOP HOTBAR BAR (1-9) WITH NAMES -->
<div class="pointer-events-auto absolute top-5 left-1/2 z-30 flex -translate-x-1/2 items-center gap-1.5 glass-panel rounded-2xl p-2 border-slate-700">
    <div id="roblox-hotbar" class="flex items-center gap-1.5"></div>
</div>

<!-- DIMENSION SELECTOR -->
<div id="dimension-bar" class="glass-panel pointer-events-auto absolute bottom-5 left-5 z-20 flex items-center gap-2 rounded-full p-2">
    <button id="btn-overworld" onclick="switchDimension('overworld')" class="dim-btn flex items-center gap-2 rounded-full px-4 py-2 font-display text-xs font-bold transition-all bg-indigo-600 text-white">Overworld Realm</button>
    <button id="btn-nether" onclick="switchDimension('nether')" class="dim-btn flex items-center gap-2 rounded-full px-4 py-2 font-display text-xs font-bold transition-all bg-white/5 text-gray-400 opacity-60">Nether Realm (Locked)</button>
    <button id="btn-void" onclick="switchDimension('void')" class="dim-btn flex items-center gap-2 rounded-full px-4 py-2 font-display text-xs font-bold transition-all bg-white/5 text-gray-400 opacity-60">Void Realm (Locked)</button>
</div>

<!-- CRAFTING PANEL -->
<div id="crafting-panel" class="glass-panel pointer-events-auto absolute top-5 right-5 z-20 w-80 rounded-2xl p-4 shadow-2xl">
    <div class="mb-3 flex items-center justify-between border-b border-white/10 pb-2">
        <div class="flex items-center gap-2">
            <span class="font-display text-xs font-bold tracking-wider text-gray-200 uppercase">CRAFTING MATRIX</span>
        </div>
        <button onclick="resetGameData()" class="rounded bg-rose-600/30 px-2 py-0.5 text-[11px] font-extrabold text-rose-300 border border-rose-500/40 hover:bg-rose-600/60 transition-all">
            RESET DATA
        </button>
    </div>
    <div id="compact-craft-list" class="flex flex-col gap-2 max-h-80 overflow-y-auto pr-1"></div>
</div>

<!-- ROBLOX BACKPACK GUI MODAL -->
<div id="backpack-modal" class="glass-panel pointer-events-auto fixed inset-x-12 top-20 bottom-12 z-50 hidden flex-col rounded-3xl p-6 shadow-2xl backdrop-blur-2xl">
    <div class="flex items-center justify-between border-b border-white/10 pb-4">
        <div>
            <h2 class="font-display text-2xl font-extrabold tracking-wide text-white">🎒 ROBLOX BACKPACK & INVENTORY</h2>
            <p class="text-xs text-gray-400">Click items to move them into active hotbar slots!</p>
        </div>
        <button onclick="toggleBackpack(false)" class="rounded-xl bg-rose-600/30 px-4 py-2 font-display text-xs font-bold text-rose-200 border border-rose-500/40 hover:bg-rose-600/50">
            Close Backpack [`]
        </button>
    </div>

    <div class="mt-6 flex flex-1 gap-6 overflow-hidden">
        <div class="flex-1 overflow-y-auto pr-2">
            <h3 class="mb-3 font-display text-xs font-bold tracking-wider text-indigo-300 uppercase">STORED TOOLS & ITEMS</h3>
            <div id="backpack-grid" class="grid grid-cols-4 sm:grid-cols-6 lg:grid-cols-8 gap-3"></div>
        </div>
    </div>
</div>

<script>
// CANVAS SETUP
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false });
const WORLD_SIZE = 8000;
const HALF_WORLD = WORLD_SIZE / 2;

function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

const WEAPONS = {
    stick:  { id: 'stick', name: 'Wooden Stick', damage: 20, range: 65, color: '#a3e635', knockback: 12 },
    spear:  { id: 'spear', name: 'Stone Spear', damage: 40, range: 90, color: '#cbd5e1', knockback: 18 },
    hammer: { id: 'hammer', name: 'Ore Sledge', damage: 75, range: 75, color: '#38bdf8', knockback: 30 },
    blade:  { id: 'blade', name: 'Plasma Sword', damage: 120, range: 110, color: '#facc15', knockback: 22 },
    scythe: { id: 'scythe', name: 'Void Scythe', damage: 190, range: 130, color: '#c084fc', knockback: 28 },
    bow:    { id: 'bow', name: 'Frostbite Bow', damage: 95, range: 140, color: '#60a5fa', knockback: 20 }
};

const ARMORS = {
    padded: { id: 'padded', name: 'Reinforced Plating', icon: '🛡️', hpBonus: 30, desc: '+30 Max HP Protection' },
    shadow: { id: 'shadow', name: 'Shadow Cloak', icon: '🧥', hpBonus: 75, desc: '+75 Max HP Dark Shield' },
    aegis:  { id: 'aegis', name: 'Aegis Plate', icon: '🦾', hpBonus: 130, desc: '+130 Max HP Aegis Barrier' }
};

const CRAFTABLES = [
    { id: 'padded', name: 'Reinforced Plating', type: 'armor', armorKey: 'padded', icon: '🛡️', stats: '+30 Max HP', cost: { wood: 15, stone: 20, ore: 5 } },
    { id: 'shadow', name: 'Shadow Cloak', type: 'armor', armorKey: 'shadow', icon: '🧥', stats: '+75 Max HP', cost: { wood: 25, stone: 25, ore: 20 } },
    { id: 'aegis', name: 'Aegis Plate', type: 'armor', armorKey: 'aegis', icon: '🦾', stats: '+130 Max HP', cost: { wood: 40, stone: 40, ore: 35 } },
    { id: 'spear', name: 'Stone Spear', type: 'weapon', weaponKey: 'spear', icon: '🗡️', stats: '+40 Damage', cost: { wood: 10, stone: 10, ore: 0 } },
    { id: 'hammer', name: 'Ore Sledge', type: 'weapon', weaponKey: 'hammer', icon: '🔨', stats: '+75 Damage', cost: { wood: 15, stone: 0, ore: 20 } },
    { id: 'bow', name: 'Frostbite Bow', type: 'weapon', weaponKey: 'bow', icon: '🏹', stats: '+95 Damage', cost: { wood: 30, stone: 15, ore: 10 } },
    { id: 'blade', name: 'Plasma Sword', type: 'weapon', weaponKey: 'blade', icon: '⚡', stats: '+120 Damage', cost: { wood: 25, stone: 25, ore: 15 } },
    { id: 'scythe', name: 'Void Scythe', type: 'weapon', weaponKey: 'scythe', icon: '🔮', stats: '+190 Damage', cost: { wood: 40, stone: 40, ore: 30 } },
    { id: 'heal', name: 'Health Salve', type: 'consumable', icon: '🧪', stats: '+45 Vitality', cost: { wood: 5, stone: 5, ore: 0 } },
    { id: 'elixir', name: 'Full Elixir', type: 'consumable', icon: '🍷', stats: 'Full Healing', cost: { wood: 15, stone: 15, ore: 10 } }
];

const DIMENSION_SHARDS = {
    overworld: { name: 'Verdant Shard', label: '🌿 Verdant Shards', req: 3, unlock: 'nether' },
    nether:    { name: 'Crimson Shard', label: '🔥 Crimson Shards', req: 3, unlock: 'void' },
    void:      { name: 'Astral Shard',  label: '✨ Astral Shards', req: 3, unlock: null }
};

let currentDim = 'overworld';
let equippedSlotIndex = 0;
let keys = {};
let mousePos = { x: 0, y: 0 };
let nearbyChest = null;

let player = {
    x: HALF_WORLD, y: HALF_WORLD, radius: 20, speed: 5.2,
    hp: 100, maxHp: 100, baseMaxHp: 100, wood: 0, stone: 0, ore: 0,
    shards: { overworld: 0, nether: 0, void: 0 },
    unlockedDims: { overworld: true, nether: false, void: false },
    hotbar: [
        { id: 'stick', name: 'Wooden Stick', type: 'weapon', weaponKey: 'stick', icon: '🪵', count: 1 },
        null, null, null, null, null, null, null, null
    ],
    backpack: [],
    ownedWeapons: ['stick'],
    ownedArmors: [],
    armorKey: null, armor: null,
    weaponKey: 'stick', weapon: WEAPONS.stick,
    facingAngle: 0, isAttacking: false, attackAngle: 0
};

let dimEntities = {
    overworld: { resources: [], enemies: [], chests: [] },
    nether: { resources: [], enemies: [], chests: [] },
    void: { resources: [], enemies: [], chests: [] }
};

const RESOURCE_TYPES = {
    tree:  { name: 'Ancient Tree', emoji: '🌳', color: '#15803d', borderColor: '#22c55e' },
    rock:  { name: 'Granite Rock', emoji: '🪨', color: '#475569', borderColor: '#94a3b8' },
    ore:   { name: 'Crystal Ore',  emoji: '💎', color: '#0284c7', borderColor: '#38bdf8' },
    shard: { name: 'Shard Cluster', emoji: '🔮', color: '#7e22ce', borderColor: '#c084fc' }
};

const MOB_TYPES = {
    overworld: [
        { name: 'Goblin Scout', emoji: '👺', color: '#15803d', borderColor: '#4ade80', hp: 50, damage: 6, speed: 2.2, shardDropChance: 0.25 },
        { name: 'Forest Fiend', emoji: '👹', color: '#047857', borderColor: '#34d399', hp: 75, damage: 10, speed: 2.4, shardDropChance: 0.35 }
    ],
    nether: [
        { name: 'Fiery Demon', emoji: '😈', color: '#b91c1c', borderColor: '#fca5a5', hp: 130, damage: 16, speed: 2.7, shardDropChance: 0.4 },
        { name: 'Lava Imp', emoji: '👾', color: '#c2410c', borderColor: '#fdba74', hp: 95, damage: 14, speed: 3.1, shardDropChance: 0.3 }
    ],
    void: [
        { name: 'Void Stalker', emoji: '👽', color: '#581c87', borderColor: '#e9d5ff', hp: 220, damage: 24, speed: 3.0, shardDropChance: 0.5 },
        { name: 'Shadow Phantom', emoji: '👻', color: '#312e81', borderColor: '#a5b4fc', hp: 180, damage: 28, speed: 3.5, shardDropChance: 0.45 }
    ]
};

// GROUND PATTERNS
let groundPatterns = {};
function createGroundPatterns() {
    const p1 = document.createElement('canvas'); p1.width = 128; p1.height = 128;
    const c1 = p1.getContext('2d');
    c1.fillStyle = '#112318'; c1.fillRect(0, 0, 128, 128);
    c1.fillStyle = '#162e20';
    for(let i = 0; i < 16; i++) c1.fillRect((i*29)%128, (i*47)%128, 24, 24);
    groundPatterns.overworld = ctx.createPattern(p1, 'repeat');

    const p2 = document.createElement('canvas'); p2.width = 128; p2.height = 128;
    const c2 = p2.getContext('2d');
    c2.fillStyle = '#2a0909'; c2.fillRect(0, 0, 128, 128);
    c2.fillStyle = '#3f0e0e';
    for(let i = 0; i < 12; i++) c2.fillRect((i*31)%128, (i*41)%128, 32, 32);
    groundPatterns.nether = ctx.createPattern(p2, 'repeat');

    const p3 = document.createElement('canvas'); p3.width = 128; p3.height = 128;
    const c3 = p3.getContext('2d');
    c3.fillStyle = '#090514'; c3.fillRect(0, 0, 128, 128);
    c3.strokeStyle = '#2e1065'; c3.lineWidth = 1.5;
    c3.strokeRect(0, 0, 128, 128);
    groundPatterns.void = ctx.createPattern(p3, 'repeat');
}
createGroundPatterns();

function loadSavedData() {
    const saved = localStorage.getItem('survival_realm_v6');
    if (saved) {
        try {
            const data = JSON.parse(saved);
            player.wood = data.wood || 0;
            player.stone = data.stone || 0;
            player.ore = data.ore || 0;
            player.shards = data.shards || { overworld: 0, nether: 0, void: 0 };
            player.unlockedDims = data.unlockedDims || { overworld: true, nether: false, void: false };
            player.hotbar = data.hotbar || player.hotbar;
            player.backpack = data.backpack || [];
            player.ownedWeapons = data.ownedWeapons || ['stick'];
            player.ownedArmors = data.ownedArmors || [];
            player.armorKey = data.armorKey || null;
            if (player.armorKey && ARMORS[player.armorKey]) {
                player.armor = ARMORS[player.armorKey];
                player.maxHp = player.baseMaxHp + player.armor.hpBonus;
            }
        } catch (e) { console.error(e); }
    }
}

function saveData() {
    const data = {
        wood: player.wood, stone: player.stone, ore: player.ore,
        shards: player.shards, unlockedDims: player.unlockedDims,
        hotbar: player.hotbar, backpack: player.backpack,
        ownedWeapons: player.ownedWeapons, ownedArmors: player.ownedArmors, armorKey: player.armorKey
    };
    localStorage.setItem('survival_realm_v6', JSON.stringify(data));
}

function resetGameData() {
    if (confirm("Reset ALL progress, inventory, and unlocked gear?")) {
        localStorage.removeItem('survival_realm_v6');
        location.reload();
    }
}

function showToast(title, msg) {
    const container = document.getElementById('toast-container');
    const toast = document.createElement('div');
    toast.className = 'glass-panel flex items-center gap-3 rounded-2xl px-4 py-3 shadow-2xl border-indigo-500/30';
    toast.innerHTML = `<div><div class="text-xs font-bold text-indigo-300">${title}</div><div class="text-[11px] text-gray-300">${msg}</div></div>`;
    container.appendChild(toast);
    setTimeout(() => toast.remove(), 2500);
}

function generateDimension(dimKey) {
    const res = [];
    const count = dimKey === 'overworld' ? 320 : dimKey === 'nether' ? 280 : 240;
    
    for (let i = 0; i < count; i++) {
        let type = 'tree';
        let r = Math.random();
        if (dimKey === 'overworld') type = r < 0.4 ? 'tree' : r < 0.7 ? 'rock' : r < 0.85 ? 'ore' : 'shard';
        else if (dimKey === 'nether') type = r < 0.3 ? 'rock' : r < 0.6 ? 'ore' : 'shard';
        else type = r < 0.2 ? 'rock' : r < 0.5 ? 'ore' : 'shard';

        res.push({
            id: i,
            x: Math.random() * (WORLD_SIZE - 200) + 100,
            y: Math.random() * (WORLD_SIZE - 200) + 100,
            type: type,
            hp: type === 'tree' ? 30 : type === 'rock' ? 50 : type === 'ore' ? 80 : 35,
            maxHp: type === 'tree' ? 30 : type === 'rock' ? 50 : type === 'ore' ? 80 : 35,
            radius: 22
        });
    }

    const enemies = [];
    const mobPool = MOB_TYPES[dimKey];
    const eCount = dimKey === 'overworld' ? 45 : dimKey === 'nether' ? 70 : 90;

    for (let i = 0; i < eCount; i++) {
        const mobTemplate = mobPool[Math.floor(Math.random() * mobPool.length)];
        enemies.push({
            id: i, x: Math.random() * (WORLD_SIZE - 200) + 100, y: Math.random() * (WORLD_SIZE - 200) + 100,
            vx: 0, vy: 0, hp: mobTemplate.hp, maxHp: mobTemplate.hp, speed: mobTemplate.speed,
            damage: mobTemplate.damage, radius: 20, shardDropChance: mobTemplate.shardDropChance, typeData: mobTemplate
        });
    }

    const chests = [];
    const chestCount = dimKey === 'overworld' ? 22 : dimKey === 'nether' ? 28 : 35;
    for (let i = 0; i < chestCount; i++) {
        chests.push({ id: i, name: 'Loot Chest', x: Math.random() * (WORLD_SIZE - 200) + 100, y: Math.random() * (WORLD_SIZE - 200) + 100, radius: 24, opened: false });
    }

    dimEntities[dimKey] = { resources: res, enemies: enemies, chests: chests };
}

generateDimension('overworld');
generateDimension('nether');
generateDimension('void');

function pressHotbarSlot(index) {
    if (equippedSlotIndex === index) {
        equippedSlotIndex = -1;
        player.weapon = null;
        player.weaponKey = null;
    } else {
        equippedSlotIndex = index;
        const item = player.hotbar[index];
        if (item && item.type === 'weapon' && WEAPONS[item.weaponKey]) {
            player.weaponKey = item.weaponKey;
            player.weapon = WEAPONS[item.weaponKey];
        } else {
            player.weapon = null;
            player.weaponKey = null;
        }
    }
    updateHUD();
}

function useActiveItem() {
    if (equippedSlotIndex < 0) return;
    let item = player.hotbar[equippedSlotIndex];
    if (!item) return;

    if (item.type === 'consumable') {
        if (item.id === 'heal') {
            player.hp = Math.min(player.maxHp, player.hp + 45);
            showToast("🧪 Consumed Salve", "Restored +45 Vitality!");
        } else if (item.id === 'elixir') {
            player.hp = player.maxHp;
            showToast("🍷 Consumed Elixir", "Fully Restored Vitality!");
        }

        item.count--;
        if (item.count <= 0) {
            player.hotbar[equippedSlotIndex] = null;
        }
        updateHUD();
        saveData();
    }
}

function switchDimension(dimKey) {
    if (dimKey === currentDim) return;

    if (!player.unlockedDims[dimKey]) {
        const reqConfig = dimKey === 'nether' ? DIMENSION_SHARDS.overworld : DIMENSION_SHARDS.nether;
        const reqDimKey = dimKey === 'nether' ? 'overworld' : 'nether';

        if (player.shards[reqDimKey] >= reqConfig.req) {
            player.unlockedDims[dimKey] = true;
            showToast("🌀 Realm Portal Unlocked", `Entered ${dimKey.toUpperCase()} Realm!`);
        } else {
            showToast("🔒 Realm Locked", `Need ${reqConfig.req}x ${reqConfig.name} from${reqDimKey.toUpperCase()} Realm!`);
            return;
        }
    }

    currentDim = dimKey;
    document.querySelectorAll('.dim-btn').forEach(btn => btn.classList.add('opacity-60', 'bg-white/5'));
    document.getElementById(`btn-${dimKey}`).classList.remove('opacity-60', 'bg-white/5');
    document.getElementById(`btn-${dimKey}`).classList.add('bg-indigo-600');
    updateHUD();
}

function openChest(chest) {
    if (!chest || chest.opened) return;
    chest.opened = true;

    const wGain = Math.floor(Math.random() * 25) + 15;
    const sGain = Math.floor(Math.random() * 20) + 10;
    const oGain = Math.floor(Math.random() * 15) + 5;

    player.wood += wGain;
    player.stone += sGain;
    player.ore += oGain;

    let bonusMessage = "";
    const currentShardInfo = DIMENSION_SHARDS[currentDim];
    if (player.shards[currentDim] < currentShardInfo.req) {
        player.shards[currentDim]++;
        bonusMessage += ` +1 ${currentShardInfo.name}!`;
    }

    if (Math.random() < 0.5) {
        const healItem = CRAFTABLES.find(c => c.id === 'heal');
        addItemToRobloxInventory({ ...healItem, count: 2 });
        bonusMessage += " + 2x Health Salves!";
    }

    showToast("📦 Chest Looted!", `Obtained Wood +${wGain}, Stone +${sGain}, Ore +${oGain}${bonusMessage}`);

    const chests = dimEntities[currentDim].chests;
    const idx = chests.indexOf(chest);
    if (idx !== -1) chests.splice(idx, 1);

    updateHUD();
    saveData();
}

function updateHUD() {
    document.getElementById('wood-val').textContent = player.wood;
    document.getElementById('stone-val').textContent = player.stone;
    document.getElementById('ore-val').textContent = player.ore;
    
    const shardConfig = DIMENSION_SHARDS[currentDim];
    document.getElementById('shard-label').textContent = shardConfig.label;
    document.getElementById('shard-val').textContent = `${player.shards[currentDim]}/${shardConfig.req}`;

    document.getElementById('weapon-val').textContent = player.weapon ? player.weapon.name : 'None';

    if (player.armor) {
        document.getElementById('armor-val').textContent = player.armor.name;
        document.getElementById('armor-buff-val').textContent = `Buff: ${player.armor.desc}`;
    } else {
        document.getElementById('armor-val').textContent = 'None';
        document.getElementById('armor-buff-val').textContent = 'Buff: No Active Armor';
    }

    updateHealthBarOnly();

    // RENDER 9-SLOT ROBLOX HOTBAR WITH TEXT LABELS
    document.getElementById('roblox-hotbar').innerHTML = player.hotbar.map((item, i) => `
        <div onclick="pressHotbarSlot(${i})" class="roblox-slot ${i === equippedSlotIndex ? 'equipped' : ''}">
            <span class="roblox-key-num">${i + 1}</span>${item ? `<span class="text-lg leading-none mt-1">${item.icon}</span><span class="slot-title">${item.name}</span>` : '<span class="text-[10px] text-gray-500 mt-3">Empty</span>'}
            ${item && item.count > 1 ? `<span class="item-count">x${item.count}</span>` : ''}
        </div>
    `).join('');

    // UPDATE DIMENSION BUTTON TEXTS
    document.getElementById('btn-overworld').textContent = player.unlockedDims.overworld ? 'Overworld' : 'Overworld (Locked)';
    document.getElementById('btn-nether').textContent = player.unlockedDims.nether ? 'Nether Realm' : 'Nether (3x Shards Needed)';
    document.getElementById('btn-void').textContent = player.unlockedDims.void ? 'Void Realm' : 'Void (3x Shards Needed)';

    renderCraftingUI();
    renderBackpackUI();
}

function updateHealthBarOnly() {
    document.getElementById('hp-text').textContent = `${Math.ceil(player.hp)} /${player.maxHp}`;
    document.getElementById('hp-bar').style.width = `${Math.max(0, (player.hp / player.maxHp) * 100)}%`;
}

function renderCraftingUI() {
    document.getElementById('compact-craft-list').innerHTML = CRAFTABLES.map(item => {
        const isToolOwned = (item.type === 'weapon' && player.ownedWeapons.includes(item.weaponKey)) ||
                            (item.type === 'armor' && player.ownedArmors.includes(item.armorKey));

        const canAfford = !isToolOwned && player.wood >= item.cost.wood && player.stone >= item.cost.stone && player.ore >= item.cost.ore;

        return `
            <button onclick="craftItem('${item.id}')" ${!canAfford ? 'disabled' : ''} class="flex items-center justify-between rounded-xl border border-white/10 bg-white/[0.04] p-2.5 text-left hover:bg-white/[0.1] disabled:opacity-40 transition-all">
                <div>
                    <div class="text-xs font-bold ${isToolOwned ? 'text-emerald-400' : 'text-indigo-300'} flex items-center gap-1.5">
                        <span>${item.icon}</span> <span>${item.name}</span>${isToolOwned ? '✓' : ''}
                    </div>
                    <div class="text-[10px] text-gray-400">${item.stats}</div>
                </div>
                <div class="text-right text-[10px] font-mono text-gray-300">
                    ${isToolOwned ? '<span class="font-bold text-emerald-400">OWNED</span>' : `Wood: ${item.cost.wood}<br>Stone: ${item.cost.stone}<br>Ore: ${item.cost.ore}`}
                </div>
            </button>
        `;
    }).join('');
}

function craftItem(id) {
    const item = CRAFTABLES.find(c => c.id === id);
    if (!item) return;

    if (item.type === 'weapon' && player.ownedWeapons.includes(item.weaponKey)) {
        showToast("⚠️ Tool Owned", "You already own this weapon/tool!");
        return;
    }
    if (item.type === 'armor' && player.ownedArmors.includes(item.armorKey)) {
        showToast("⚠️ Armor Owned", "You already own this armor!");
        return;
    }

    if (player.wood >= item.cost.wood && player.stone >= item.cost.stone && player.ore >= item.cost.ore) {
        player.wood -= item.cost.wood;
        player.stone -= item.cost.stone;
        player.ore -= item.cost.ore;

        if (item.type === 'armor') {
            player.ownedArmors.push(item.armorKey);
            player.armorKey = item.armorKey;
            player.armor = ARMORS[item.armorKey];
            player.maxHp = player.baseMaxHp + player.armor.hpBonus;
            showToast("🛡️ Armor Equipped", `Equipped ${item.name}!`);
        } else if (item.type === 'weapon') {
            player.ownedWeapons.push(item.weaponKey);
            addItemToRobloxInventory({ ...item, count: 1 });
            showToast(`${item.icon} Weapon Crafted!`, `Acquired ${item.name}! Added to hotbar.`);
        } else {
            addItemToRobloxInventory({ ...item, count: 1 });
            showToast(`${item.icon} Consumable Crafted!`, `Created ${item.name}!`);
        }

        updateHUD();
        saveData();
    }
}

function addItemToRobloxInventory(newItem) {
    if (newItem.type === 'consumable') {
        let hotbarItem = player.hotbar.find(i => i && i.id === newItem.id);
        if (hotbarItem) { hotbarItem.count += (newItem.count || 1); return; }
        let backpackItem = player.backpack.find(i => i && i.id === newItem.id);
        if (backpackItem) { backpackItem.count += (newItem.count || 1); return; }
    }

    let emptySlot = player.hotbar.findIndex(slot => slot === null);
    if (emptySlot !== -1) {
        player.hotbar[emptySlot] = newItem;
    } else {
        player.backpack.push(newItem);
    }
}

function toggleBackpack(force) {
    const modal = document.getElementById('backpack-modal');
    if (force === false || !modal.classList.contains('hidden')) {
        modal.classList.replace('flex', 'hidden');
    } else {
        modal.classList.replace('hidden', 'flex');
    }
}

function renderBackpackUI() {
    document.getElementById('backpack-grid').innerHTML = player.backpack.map((item, i) => `
        <div onclick="equipFromBackpack(${i})" class="roblox-slot border-indigo-500/20 flex-col hover:border-indigo-400 w-full h-20">
            <span class="text-xl mt-1">${item.icon}</span>
            <span class="slot-title">${item.name}</span>${item.count > 1 ? `<span class="item-count">x${item.count}</span>` : ''}
        </div>
    `).join('');
}

function equipFromBackpack(backpackIdx) {
    let item = player.backpack[backpackIdx];
    let emptySlot = player.hotbar.findIndex(slot => slot === null);

    if (emptySlot !== -1) {
        player.hotbar[emptySlot] = item;
        player.backpack.splice(backpackIdx, 1);
    } else {
        let activeIdx = equippedSlotIndex >= 0 ? equippedSlotIndex : 0;
        let temp = player.hotbar[activeIdx];
        player.hotbar[activeIdx] = item;
        player.backpack[backpackIdx] = temp;
    }

    updateHUD();
    saveData();
}

window.addEventListener('keydown', e => {
    keys[e.key.toLowerCase()] = true;
    if (e.key === '`' || e.key === '~') { e.preventDefault(); toggleBackpack(); }
    if (e.key === 'Escape') toggleBackpack(false);
    if (e.key.toLowerCase() === 'e' && nearbyChest) openChest(nearbyChest);

    if (['1','2','3','4','5','6','7','8','9'].includes(e.key)) {
        pressHotbarSlot(parseInt(e.key) - 1);
    }
});

window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
window.addEventListener('mousemove', e => { mousePos = { x: e.clientX, y: e.clientY }; });

window.addEventListener('mousedown', e => {
    if (e.button === 0) {
        if (nearbyChest) {
            openChest(nearbyChest);
            return;
        }

        if (equippedSlotIndex >= 0 && player.hotbar[equippedSlotIndex] && player.hotbar[equippedSlotIndex].type === 'consumable') {
            useActiveItem();
            return;
        }

        if (!player.isAttacking && player.weapon) {
            player.isAttacking = true;
            player.attackAngle = -Math.PI / 3;
            performAttack();
        }
    }
});

function performAttack() {
    if (!player.weapon) return;
    const currentWeapon = player.weapon;
    const currentEnemies = dimEntities[currentDim].enemies;
    const currentResources = dimEntities[currentDim].resources;

    for (let i = currentEnemies.length - 1; i >= 0; i--) {
        const enemy = currentEnemies[i];
        const dx = enemy.x - player.x;
        const dy = enemy.y - player.y;
        if (dx * dx + dy * dy <= (currentWeapon.range + enemy.radius) ** 2) {
            enemy.hp -= currentWeapon.damage;

            const angle = Math.atan2(dy, dx);
            const kbForce = currentWeapon.knockback || 15;
            enemy.vx += Math.cos(angle) * kbForce;
            enemy.vy += Math.sin(angle) * kbForce;

            if (enemy.hp <= 0) {
                currentEnemies.splice(i, 1);
                player.wood += Math.floor(Math.random() * 4) + 2;
                player.stone += Math.floor(Math.random() * 3) + 1;
                
                if (Math.random() < enemy.shardDropChance) {
                    player.shards[currentDim] += 1;
                    showToast("✨ Shard Dropped", `Acquired +1 ${DIMENSION_SHARDS[currentDim].name}!`);
                }

                updateHUD();
                saveData();
            }
        }
    }

    for (let i = currentResources.length - 1; i >= 0; i--) {
        const res = currentResources[i];
        const dx = res.x - player.x;
        const dy = res.y - player.y;
        if (dx * dx + dy * dy <= (currentWeapon.range + res.radius) ** 2) {
            res.hp -= currentWeapon.damage;
            if (res.hp <= 0) {
                if (res.type === 'tree') player.wood += 6;
                else if (res.type === 'rock') player.stone += 6;
                else if (res.type === 'ore') player.ore += 4;
                else if (res.type === 'shard') {
                    player.shards[currentDim] += 2;
                    showToast("✨ Shard Harvested", `Harvested +2 ${DIMENSION_SHARDS[currentDim].name}s!`);
                }

                currentResources.splice(i, 1);
                updateHUD();
                saveData();
            }
        }
    }
}

let lastTime = performance.now();
const deltaStep = 1000 / 60;
let accum = 0;

function update(dt) {
    let dx = 0; let dy = 0;
    if (keys['w'] || keys['arrowup']) dy -= 1;
    if (keys['s'] || keys['arrowdown']) dy += 1;
    if (keys['a'] || keys['arrowleft']) dx -= 1;
    if (keys['d'] || keys['arrowright']) dx += 1;

    if (dx !== 0 && dy !== 0) { dx *= 0.7071; dy *= 0.7071; }

    player.x = Math.max(player.radius, Math.min(WORLD_SIZE - player.radius, player.x + dx * player.speed));
    player.y = Math.max(player.radius, Math.min(WORLD_SIZE - player.radius, player.y + dy * player.speed));

    const screenCenterX = canvas.width * 0.5;
    const screenCenterY = canvas.height * 0.5;
    player.facingAngle = Math.atan2(mousePos.y - screenCenterY, mousePos.x - screenCenterX);

    if (player.isAttacking) {
        player.attackAngle += 0.55;
        if (player.attackAngle >= Math.PI / 3) player.isAttacking = false;
    }

    nearbyChest = null;
    const currentChests = dimEntities[currentDim].chests;
    for (let chest of currentChests) {
        if (Math.hypot(chest.x - player.x, chest.y - player.y) <= player.radius + chest.radius + 30) {
            nearbyChest = chest;
            break;
        }
    }

    const chestPrompt = document.getElementById('chest-prompt');
    if (nearbyChest) chestPrompt.classList.remove('hidden');
    else chestPrompt.classList.add('hidden');

    const currentEnemies = dimEntities[currentDim].enemies;
    let tookDamage = false;

    for (let i = 0; i < currentEnemies.length; i++) {
        const enemy = currentEnemies[i];
        enemy.x += enemy.vx; enemy.y += enemy.vy;
        enemy.vx *= 0.82; enemy.vy *= 0.82;

        const edx = player.x - enemy.x;
        const edy = player.y - enemy.y;
        const angle = Math.atan2(edy, edx);
        enemy.x += Math.cos(angle) * enemy.speed;
        enemy.y += Math.sin(angle) * enemy.speed;

        if (edx * edx + edy * edy < (player.radius + enemy.radius) ** 2) {
            player.hp -= enemy.damage / 60;
            tookDamage = true;
            if (player.hp <= 0) {
                player.hp = player.maxHp;
                player.x = HALF_WORLD; player.y = HALF_WORLD;
                showToast("☠️ Respawned", "Respawned at home base.");
            }
        }
    }

    if (tookDamage) updateHealthBarOnly();
}

// RENDER ENGINE WITH SPRITE NAMES ABOVE OBJECTS
function render() {
    const camX = canvas.width * 0.5 - player.x;
    const camY = canvas.height * 0.5 - player.y;

    const viewLeft = player.x - canvas.width * 0.5 - 100;
    const viewRight = player.x + canvas.width * 0.5 + 100;
    const viewTop = player.y - canvas.height * 0.5 - 100;
    const viewBottom = player.y + canvas.height * 0.5 + 100;

    ctx.save();
    ctx.translate(camX, camY);
    ctx.fillStyle = groundPatterns[currentDim] || '#030712';
    ctx.fillRect(viewLeft, viewTop, canvas.width + 200, canvas.height + 200);

    // Resources
    const currentResources = dimEntities[currentDim].resources;
    for (let i = 0; i < currentResources.length; i++) {
        const res = currentResources[i];
        if (res.x < viewLeft || res.x > viewRight || res.y < viewTop || res.y > viewBottom) continue;

        const resDef = RESOURCE_TYPES[res.type];
        ctx.beginPath();
        ctx.arc(res.x, res.y, res.radius, 0, Math.PI * 2);
        ctx.fillStyle = resDef.color;
        ctx.fill();
        ctx.strokeStyle = resDef.borderColor;
        ctx.lineWidth = 3;
        ctx.stroke();

        ctx.font = '16px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(resDef.emoji, res.x, res.y);

        // TEXT LABEL OVER RESOURCE
        ctx.font = 'bold 11px sans-serif';
        ctx.fillStyle = '#ffffff';
        ctx.shadowColor = 'black';
        ctx.shadowBlur = 4;
        ctx.fillText(resDef.name, res.x, res.y - res.radius - 8);
        ctx.shadowBlur = 0;

        if (res.hp < res.maxHp) {
            ctx.fillStyle = 'rgba(0,0,0,0.6)';
            ctx.fillRect(res.x - 20, res.y - res.radius - 20, 40, 4);
            ctx.fillStyle = '#22c55e';
            ctx.fillRect(res.x - 20, res.y - res.radius - 20, (res.hp / res.maxHp) * 40, 4);
        }
    }

    // Chests
    const currentChests = dimEntities[currentDim].chests;
    for (let chest of currentChests) {
        if (chest.x < viewLeft || chest.x > viewRight || chest.y < viewTop || chest.y > viewBottom) continue;

        ctx.beginPath();
        ctx.arc(chest.x, chest.y, chest.radius, 0, Math.PI * 2);
        ctx.fillStyle = '#854d0e';
        ctx.fill();
        ctx.strokeStyle = '#facc15';
        ctx.lineWidth = 3;
        ctx.stroke();

        ctx.font = '18px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('📦', chest.x, chest.y);

        // TEXT LABEL OVER CHEST
        ctx.font = 'bold 11px sans-serif';
        ctx.fillStyle = '#fde047';
        ctx.shadowColor = 'black';
        ctx.shadowBlur = 4;
        ctx.fillText('Loot Chest', chest.x, chest.y - chest.radius - 8);
        ctx.shadowBlur = 0;
    }

    // Enemies
    const currentEnemies = dimEntities[currentDim].enemies;
    for (let i = 0; i < currentEnemies.length; i++) {
        const enemy = currentEnemies[i];
        if (enemy.x < viewLeft || enemy.x > viewRight || enemy.y < viewTop || enemy.y > viewBottom) continue;

        const visualRadius = enemy.radius * 1.4;
        const mobDef = enemy.typeData;

        ctx.beginPath();
        ctx.arc(enemy.x, enemy.y, visualRadius + 2, 0, Math.PI * 2);
        ctx.fillStyle = mobDef.borderColor;
        ctx.fill();

        ctx.beginPath();
        ctx.arc(enemy.x, enemy.y, visualRadius, 0, Math.PI * 2);
        ctx.fillStyle = mobDef.color;
        ctx.fill();

        ctx.font = '18px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(mobDef.emoji, enemy.x, enemy.y);

        // TEXT LABEL OVER MOB
        ctx.font = 'bold 11px sans-serif';
        ctx.fillStyle = '#fca5a5';
        ctx.shadowColor = 'black';
        ctx.shadowBlur = 4;
        ctx.fillText(mobDef.name, enemy.x, enemy.y - visualRadius - 10);
        ctx.shadowBlur = 0;

        if (enemy.hp < enemy.maxHp) {
            ctx.fillStyle = 'rgba(0,0,0,0.6)';
            ctx.fillRect(enemy.x - 20, enemy.y - visualRadius - 22, 40, 4);
            ctx.fillStyle = '#ef4444';
            ctx.fillRect(enemy.x - 20, enemy.y - visualRadius - 22, (enemy.hp / enemy.maxHp) * 40, 4);
        }
    }

    // Player
    ctx.beginPath();
    ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
    ctx.fillStyle = '#6366f1';
    ctx.fill();
    ctx.strokeStyle = '#818cf8';
    ctx.lineWidth = 3;
    ctx.stroke();

    // TEXT LABEL OVER PLAYER
    ctx.font = 'bold 12px sans-serif';
    ctx.fillStyle = '#6366f1';
    ctx.textAlign = 'center';
    ctx.shadowColor = 'black';
    ctx.shadowBlur = 4;
    ctx.fillText('You', player.x, player.y - player.radius - 10);
    ctx.shadowBlur = 0;

    // Weapon Render
    if (player.weapon) {
        const activeWeapon = player.weapon;
        ctx.save();
        ctx.translate(player.x, player.y);
        ctx.rotate(player.facingAngle + (player.isAttacking ? player.attackAngle : 0));
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(activeWeapon.range, 0);
        ctx.strokeStyle = activeWeapon.color;
        ctx.lineWidth = player.isAttacking ? 6 : 3;
        ctx.stroke();
        ctx.restore();
    }

    ctx.restore();
}

function gameLoop(time) {
    const dt = time - lastTime;
    lastTime = time;
    accum += dt;

    while (accum >= deltaStep) {
        update(deltaStep);
        accum -= deltaStep;
    }

    render();
    requestAnimationFrame(gameLoop);
}

loadSavedData();
updateHUD();
requestAnimationFrame(gameLoop);
</script>
</body>
</html>
