<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Survival Realm: Multi-Dimensional Quest</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        :root {
            --font-sans: 'Plus Jakarta Sans', sans-serif;
            --font-display: 'Space Grotesk', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: #030712;
            color: #f9fafb;
            font-family: var(--font-sans);
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        #gameCanvas {
            display: block;
            width: 100vw;
            height: 100vh;
            background: #030712;
            cursor: crosshair;
        }

        .glass-panel {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        .glass-panel-glow {
            box-shadow: 0 0 30px rgba(99, 102, 241, 0.2), 0 20px 50px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.2);
        }

        #damage-flash {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle, rgba(239, 68, 68, 0) 30%, rgba(239, 68, 68, 0.65) 100%);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.15s ease-out;
            z-index: 5;
        }

        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.5); border-radius: 99px; }
        ::-webkit-scrollbar-thumb { background: rgba(99, 102, 241, 0.5); border-radius: 99px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(129, 140, 248, 0.8); }

        @keyframes shardGlow {
            0%, 100% { filter: drop-shadow(0 0 6px rgba(192, 132, 252, 0.8)); transform: scale(1); }
            50% { filter: drop-shadow(0 0 14px rgba(192, 132, 252, 1)); transform: scale(1.08); }
        }

        .shard-pulse { animation: shardGlow 2.5s infinite ease-in-out; }

        @keyframes toastIn {
            from { opacity: 0; transform: translateY(-20px) scale(0.92); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .animate-toast { animation: toastIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    </style>
</head>
<body class="relative min-h-screen select-none overflow-hidden bg-gray-950 font-sans text-gray-100">

<canvas id="gameCanvas"></canvas>
<div id="damage-flash"></div>

<div id="toast-container" class="pointer-events-none absolute top-6 left-1/2 z-30 flex -translate-x-1/2 flex-col items-center gap-2"></div>

<div id="stats-hud" class="glass-panel glass-panel-glow pointer-events-auto absolute top-5 left-5 z-20 w-80 rounded-2xl p-4 transition-all duration-300">
    <div class="mb-3 flex items-center justify-between border-b border-white/10 pb-2">
        <div class="flex items-center gap-2">
            <span class="inline-block h-2.5 w-2.5 rounded-full bg-emerald-400 shadow-[0_0_8px_#34d399]"></span>
            <span class="font-display text-xs font-bold tracking-widest text-gray-300 uppercase">SURVIVOR STATUS</span>
        </div>
        <div class="flex items-center gap-1.5 rounded-full bg-black/40 px-2.5 py-0.5 text-[11px] font-semibold text-gray-400 border border-white/5">
            <span>⏱️</span>
            <span id="time-val" class="font-mono text-gray-200">00:00</span>
        </div>
    </div>

    <!-- Health Bar -->
    <div class="relative mb-3.5">
        <div class="mb-1 flex items-center justify-between text-xs font-bold">
            <span class="text-rose-400">VITALITY</span>
            <span id="hp-text" class="text-gray-200">100 / 100</span>
        </div>
        <div class="relative h-4 w-full overflow-hidden rounded-full border border-white/10 bg-black/50 p-0.5">
            <div id="hp-bar" class="h-full w-full rounded-full bg-gradient-to-r from-rose-600 via-rose-500 to-amber-500 shadow-[0_0_12px_rgba(244,63,94,0.6)] transition-all duration-300"></div>
        </div>
    </div>

    <!-- Quest Objective -->
    <div class="mb-3.5 rounded-xl border border-indigo-500/30 bg-gradient-to-r from-indigo-950/50 via-purple-950/30 to-slate-900/50 p-3 shadow-inner">
        <div class="flex items-center justify-between">
            <span class="text-[10px] font-extrabold tracking-wider text-indigo-400 uppercase">MAIN OBJECTIVE</span>
            <span id="objective-tag" class="rounded bg-indigo-500/20 px-1.5 py-0.5 text-[9px] font-bold text-indigo-300">DIMENSION 1</span>
        </div>
        <p id="quest-desc" class="mt-1 text-xs font-semibold leading-relaxed text-gray-200">
            Search chest ruins to locate <span class="font-bold text-purple-300">5 Overworld Shards</span> to ignite the Nether Portal!
        </p>
    </div>

    <!-- Resource Grid -->
    <div class="mb-3 grid grid-cols-4 gap-1.5 text-center">
        <div class="rounded-lg border border-white/5 bg-white/[0.03] p-1.5 transition-colors hover:bg-white/[0.08]">
            <div class="text-base">🪵</div>
            <div id="wood-val" class="font-display text-xs font-bold text-amber-200">0</div>
            <div class="text-[9px] font-medium text-gray-400 uppercase">Wood</div>
        </div>
        <div class="rounded-lg border border-white/5 bg-white/[0.03] p-1.5 transition-colors hover:bg-white/[0.08]">
            <div class="text-base">🪨</div>
            <div id="stone-val" class="font-display text-xs font-bold text-slate-300">0</div>
            <div class="text-[9px] font-medium text-gray-400 uppercase">Stone</div>
        </div>
        <div class="rounded-lg border border-white/5 bg-white/[0.03] p-1.5 transition-colors hover:bg-white/[0.08]">
            <div class="text-base">💎</div>
            <div id="ore-val" class="font-display text-xs font-bold text-cyan-300">0</div>
            <div class="text-[9px] font-medium text-gray-400 uppercase">Ore</div>
        </div>
        <div class="shard-pulse rounded-lg border border-purple-500/30 bg-purple-950/40 p-1.5 shadow-[0_0_10px_rgba(168,85,247,0.2)]">
            <div class="text-base">🔮</div>
            <div id="shard-val" class="font-display text-xs font-bold text-purple-300">0/5</div>
            <div class="text-[9px] font-medium text-purple-200 uppercase">Shards</div>
        </div>
    </div>

    <!-- Equipped Weapon -->
    <div class="flex items-center justify-between rounded-xl border border-white/10 bg-black/40 px-3 py-2 text-xs">
        <span class="text-gray-400">Weapon</span>
        <span id="weapon-val" class="font-bold text-gray-200">Wooden Stick</span>
    </div>
</div>

<!-- Dimension Selector -->
<div id="dimension-bar" class="glass-panel pointer-events-auto absolute bottom-5 left-1/2 z-20 flex -translate-x-1/2 items-center gap-2 rounded-full p-2 shadow-2xl">
    <button id="btn-overworld" onclick="switchDimension('overworld')" class="dim-btn flex items-center gap-2 rounded-full px-5 py-2.5 font-display text-xs font-bold transition-all duration-200 bg-indigo-600 text-white shadow-[0_0_15px_rgba(79,70,229,0.5)]">
        <span>🌿</span> Overworld
    </button>
    <button id="btn-nether" onclick="switchDimension('nether')" class="dim-btn flex items-center gap-2 rounded-full px-5 py-2.5 font-display text-xs font-bold transition-all duration-200 bg-white/5 text-gray-400 border border-white/10 opacity-60 hover:opacity-100">
        <span>🔒</span> Nether [5 Shards Required]
    </button>
    <button id="btn-void" onclick="switchDimension('void')" class="dim-btn flex items-center gap-2 rounded-full px-5 py-2.5 font-display text-xs font-bold transition-all duration-200 bg-white/5 text-gray-400 border border-white/10 opacity-60 hover:opacity-100">
        <span>🔒</span> The Void [5 Shards Required]
    </button>
</div>

<!-- Crafting Panel -->
<div id="crafting-panel" class="glass-panel pointer-events-auto absolute top-5 right-5 z-20 w-72 rounded-2xl p-4 shadow-2xl transition-all">
    <div class="mb-3 flex items-center justify-between border-b border-white/10 pb-2">
        <div class="flex items-center gap-2">
            <span class="text-sm">⚒️</span>
            <span class="font-display text-xs font-bold tracking-wider text-gray-200 uppercase">CRAFTING MATRIX</span>
        </div>
        <button onclick="resetGameData()" class="text-[10px] font-semibold text-rose-400 hover:text-rose-300 underline">Reset Save</button>
    </div>

    <div class="flex flex-col gap-2 max-h-80 overflow-y-auto pr-1">
        <button id="craft-spear" onclick="craftItem('spear')" class="craft-btn flex items-center justify-between rounded-xl border border-white/10 bg-white/[0.04] p-2.5 text-left transition-all hover:bg-white/[0.1] active:scale-95 disabled:opacity-40 disabled:pointer-events-none">
            <div>
                <div class="text-xs font-bold text-emerald-400">🗡️ Stone Spear</div>
                <div class="text-[10px] text-gray-400">+40 Damage • Long Reach</div>
            </div>
            <div class="text-right text-[10px] font-mono font-semibold text-gray-300">10W • 10S</div>
        </button>

        <button id="craft-hammer" onclick="craftItem('hammer')" class="craft-btn flex items-center justify-between rounded-xl border border-white/10 bg-white/[0.04] p-2.5 text-left transition-all hover:bg-white/[0.1] active:scale-95 disabled:opacity-40 disabled:pointer-events-none">
            <div>
                <div class="text-xs font-bold text-sky-400">🔨 Ore Sledge</div>
                <div class="text-[10px] text-gray-400">+75 Damage • Heavy Hit</div>
            </div>
            <div class="text-right text-[10px] font-mono font-semibold text-gray-300">15W • 20O</div>
        </button>

        <button id="craft-blade" onclick="craftItem('blade')" class="craft-btn flex items-center justify-between rounded-xl border border-white/10 bg-white/[0.04] p-2.5 text-left transition-all hover:bg-white/[0.1] active:scale-95 disabled:opacity-40 disabled:pointer-events-none">
            <div>
                <div class="text-xs font-bold text-amber-400">⚡ Plasma Sword</div>
                <div class="text-[10px] text-gray-400">+120 Damage • Rapid Arc</div>
            </div>
            <div class="text-right text-[10px] font-mono font-semibold text-gray-300">25W • 25S • 15O</div>
        </button>

        <button id="craft-scythe" onclick="craftItem('scythe')" class="craft-btn flex items-center justify-between rounded-xl border border-white/10 bg-white/[0.04] p-2.5 text-left transition-all hover:bg-white/[0.1] active:scale-95 disabled:opacity-40 disabled:pointer-events-none">
            <div>
                <div class="text-xs font-bold text-purple-400">🔮 Void Scythe</div>
                <div class="text-[10px] text-gray-400">+190 Damage • Void Cleave</div>
            </div>
            <div class="text-right text-[10px] font-mono font-semibold text-gray-300">40W • 40S • 30O</div>
        </button>

        <button id="craft-heal" onclick="craftItem('heal')" class="craft-btn flex items-center justify-between rounded-xl border border-emerald-500/30 bg-emerald-950/20 p-2.5 text-left transition-all hover:bg-emerald-900/30 active:scale-95 disabled:opacity-40 disabled:pointer-events-none">
            <div>
                <div class="text-xs font-bold text-emerald-300">🧪 Health Salve</div>
                <div class="text-[10px] text-emerald-400/80">Restore +45 HP</div>
            </div>
            <div class="text-right text-[10px] font-mono font-semibold text-emerald-200">5W • 5S</div>
        </button>
    </div>
</div>

<div id="minimap-container" class="glass-panel pointer-events-none absolute bottom-5 right-5 z-20 h-40 w-40 overflow-hidden rounded-2xl border-2 border-white/15 shadow-2xl">
    <canvas id="minimapCanvas" width="160" height="160" class="block h-full w-full"></canvas>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const minimapCanvas = document.getElementById('minimapCanvas');
const minimapCtx = minimapCanvas.getContext('2d');

function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

const WORLD_SIZE = 8000;
const HALF_WORLD = WORLD_SIZE / 2;

const WEAPONS = {
    stick:  { id: 'stick', name: 'Wooden Stick', damage: 20, range: 65, rarity: 'Common', color: '#9ca3af' },
    spear:  { id: 'spear', name: 'Stone Spear', damage: 40, range: 90, rarity: 'Uncommon', color: '#34d399' },
    hammer: { id: 'hammer', name: 'Ore Sledge', damage: 75, range: 75, rarity: 'Rare', color: '#38bdf8' },
    blade:  { id: 'blade', name: 'Plasma Sword', damage: 120, range: 110, rarity: 'Legendary', color: '#fbbf24' },
    scythe: { id: 'scythe', name: 'Void Scythe', damage: 190, range: 130, rarity: 'Mythic', color: '#c084fc' }
};

const MOBS_CONFIG = {
    gerard:  { name: 'Gerard', spriteSrc: 'images/Gerard.JPEG', hp: 100, speed: 2.8, radius: 24, damage: 0.25, fallbackColor: '#ef4444' },
    jason:   { name: 'Jason', spriteSrc: 'images/Jason.JPEG', hp: 130, speed: 2.5, radius: 24, damage: 0.35, fallbackColor: '#f97316' },
    liuji:   { name: 'Liu Ji', spriteSrc: 'images/Liu%20Ji.JPEG', hp: 220, speed: 1.8, radius: 28, damage: 0.55, fallbackColor: '#dc2626' },
    matthew: { name: 'Matthew', spriteSrc: 'images/Matthew.JPEG', hp: 200, speed: 2.7, radius: 26, damage: 0.45, fallbackColor: '#b91c1c' },
    travia:  { name: 'Travia', spriteSrc: 'images/Travia.JPEG', hp: 280, speed: 2.2, radius: 26, damage: 0.60, fallbackColor: '#9333ea' },
    xayven:  { name: 'Xayven', spriteSrc: 'images/Xayven.JPEG', hp: 350, speed: 3.0, radius: 30, damage: 0.75, fallbackColor: '#7e22ce' },
    xuchen:  { name: 'Xuchen', spriteSrc: 'images/Xuchen.JPEG', hp: 1250, speed: 1.5, radius: 46, damage: 1.20, fallbackColor: '#a855f7', isBoss: true }
};

const loadedSprites = {};
Object.keys(MOBS_CONFIG).forEach(key => {
    const img = new Image();
    img.src = MOBS_CONFIG[key].spriteSrc;
    img.isLoaded = false;
    img.onload = () => { img.isLoaded = true; };
    img.onerror = () => { img.isLoaded = false; };
    loadedSprites[key] = img;
});

const DIMENSIONS = {
    overworld: {
        id: 'overworld', name: 'OVERWORLD',
        biomes: [
            { name: 'Verdant Plains', bg: '#0b291a', grid: '#133e28', decor: '#1e5336' },
            { name: 'Sunburnt Dunes', bg: '#2b1d0c', grid: '#3d2b14', decor: '#4f391c' },
            { name: 'Frostbite Tundra', bg: '#0f2332', grid: '#173347', decor: '#214660' },
            { name: 'Shadowwood Forest', bg: '#0f1d16', grid: '#182f24', decor: '#224233' }
        ],
        mobs: ['gerard', 'jason'], requiredShards: 0, nextDim: 'nether'
    },
    nether: {
        id: 'nether', name: 'NETHER',
        biomes: [
            { name: 'Crimson Wastes', bg: '#2b0707', grid: '#400c0c', decor: '#571212' },
            { name: 'Ash Valley', bg: '#17171a', grid: '#242429', decor: '#33333b' },
            { name: 'Basalt Delta', bg: '#1c1510', grid: '#2b211a', decor: '#3d2e24' },
            { name: 'Lava Ridges', bg: '#360a02', grid: '#4d1004', decor: '#661707' }
        ],
        mobs: ['liuji', 'matthew'], requiredShards: 5, nextDim: 'void'
    },
    void: {
        id: 'void', name: 'THE VOID',
        biomes: [
            { name: 'Astral Abyss', bg: '#15092b', grid: '#231142', decor: '#32195e' },
            { name: 'Nebula Ridges', bg: '#1f0933', grid: '#30104e', decor: '#43176d' },
            { name: 'Ender Wastes', bg: '#0b0821', grid: '#141036', decor: '#1e184e' },
            { name: 'Starfall Ruins', bg: '#100c2e', grid: '#1a1447', decor: '#261f63' }
        ],
        mobs: ['travia', 'xayven'], requiredShards: 5, nextDim: null
    }
};

let currentDim = 'overworld';
let player = {
    x: HALF_WORLD, y: HALF_WORLD, radius: 18, speed: 5.2,
    hp: 100, maxHp: 100, wood: 0, stone: 0, ore: 0,
    shards: { overworld: 0, nether: 0, void: 0 },
    unlockedDims: { overworld: true, nether: false, void: false },
    weaponKey: 'stick', weapon: WEAPONS.stick,
    facingAngle: 0, isAttacking: false, attackProgress: 0
};

let dimEntities = {
    overworld: { resources: [], enemies: [], structures: [] },
    nether: { resources: [], enemies: [], structures: [] },
    void: { resources: [], enemies: [], structures: [] }
};

let particles = [];
let gameTime = 0;

function loadSavedData() {
    const saved = localStorage.getItem('survival_realm_save');
    if (saved) {
        try {
            const data = JSON.parse(saved);
            player.wood = data.wood || 0;
            player.stone = data.stone || 0;
            player.ore = data.ore || 0;
            player.shards = data.shards || { overworld: 0, nether: 0, void: 0 };
            player.unlockedDims = data.unlockedDims || { overworld: true, nether: false, void: false };
            if (data.weaponKey && WEAPONS[data.weaponKey]) {
                player.weaponKey = data.weaponKey;
                player.weapon = WEAPONS[data.weaponKey];
            }
            gameTime = data.gameTime || 0;
        } catch (e) { console.error("Failed loading save:", e); }
    }
}

function saveData() {
    const data = {
        wood: player.wood, stone: player.stone, ore: player.ore,
        shards: player.shards, unlockedDims: player.unlockedDims,
        weaponKey: player.weaponKey, gameTime: gameTime
    };
    localStorage.setItem('survival_realm_save', JSON.stringify(data));
}

function resetGameData() {
    if (confirm("Reset all game progress?")) {
        localStorage.removeItem('survival_realm_save');
        location.reload();
    }
}

function updateHUD() {
    document.getElementById('wood-val').innerText = player.wood;
    document.getElementById('stone-val').innerText = player.stone;
    document.getElementById('ore-val').innerText = player.ore;
    document.getElementById('shard-val').innerText = `${player.shards[currentDim]}/5`;
    document.getElementById('weapon-val').innerText = player.weapon.name;
    document.getElementById('hp-text').innerText = `${Math.max(0, Math.ceil(player.hp))} / ${player.maxHp}`;
    
    const pct = Math.max(0, (player.hp / player.maxHp) * 100);
    document.getElementById('hp-bar').style.width = `${pct}%`;

    Object.keys(player.unlockedDims).forEach(dim => {
        const btn = document.getElementById(`btn-${dim}`);
        if (btn && player.unlockedDims[dim]) {
            btn.innerText = dim.toUpperCase();
            btn.style.opacity = '1';
        }
    });
}

function showToast(title, desc) {
    const container = document.getElementById('toast-container');
    const toast = document.createElement('div');
    toast.className = 'animate-toast glass-panel rounded-xl px-4 py-2 text-center text-xs shadow-lg border border-indigo-500/30';
    toast.innerHTML = `<div class="font-bold text-indigo-300">${title}</div><div class="text-gray-300 text-[11px]">${desc}</div>`;
    container.appendChild(toast);
    setTimeout(() => toast.remove(), 3500);
}

loadSavedData();

setInterval(() => {
    gameTime++;
    const mins = Math.floor(gameTime / 60).toString().padStart(2, '0');
    const secs = (gameTime % 60).toString().padStart(2, '0');
    document.getElementById('time-val').innerText = `${mins}:${secs}`;
    saveData();
}, 1000);

function initWorld() {
    Object.keys(DIMENSIONS).forEach(dim => {
        dimEntities[dim].resources = [];
        dimEntities[dim].structures = [];
        dimEntities[dim].enemies = [];

        for (let i = 0; i < 320; i++) {
            const types = ['tree', 'stone', 'ore'];
            const type = types[Math.floor(Math.random() * types.length)];
            dimEntities[dim].resources.push({
                x: Math.random() * (WORLD_SIZE - 400) + 200,
                y: Math.random() * (WORLD_SIZE - 400) + 200,
                type: type,
                hp: type === 'ore' ? 4 : type === 'stone' ? 3 : 2,
                maxHp: type === 'ore' ? 4 : type === 'stone' ? 3 : 2,
                scale: 1,
                rotation: Math.random() * Math.PI * 2
            });
        }

        let shardsRemaining = 5;
        for (let i = 0; i < 25; i++) {
            const containsShard = shardsRemaining > 0 && Math.random() < 0.4;
            if (containsShard) shardsRemaining--;

            dimEntities[dim].structures.push({
                x: Math.random() * (WORLD_SIZE - 600) + 300,
                y: Math.random() * (WORLD_SIZE - 600) + 300,
                width: 120, height: 120,
                hasChest: true, chestOpened: false, containsShard: containsShard
            });
        }

        const mobKeys = DIMENSIONS[dim].mobs;
        for (let i = 0; i < 50; i++) {
            const mKey = mobKeys[Math.floor(Math.random() * mobKeys.length)];
            const base = MOBS_CONFIG[mKey];
            dimEntities[dim].enemies.push({
                key: mKey, x: Math.random() * WORLD_SIZE, y: Math.random() * WORLD_SIZE,
                hp: base.hp, maxHp: base.hp, radius: base.radius, speed: base.speed,
                damage: base.damage, name: base.name, hitFlash: 0
            });
        }
    });
}

initWorld();
updateHUD();

const keys = {};
let mouseX = canvas.width / 2, mouseY = canvas.height / 2;

window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
window.addEventListener('mousemove', e => {
    mouseX = e.clientX;
    mouseY = e.clientY;
});

function switchDimension(dimName) {
    if (!player.unlockedDims[dimName]) {
        showToast("🔒 Portal Sealed!", `Collect 5 Shards in current realm to unlock ${DIMENSIONS[dimName].name}!`);
        return;
    }
    if (currentDim === dimName) return;

    currentDim = dimName;
    document.querySelectorAll('.dim-btn').forEach(btn => {
        btn.className = "dim-btn flex items-center gap-2 rounded-full px-5 py-2.5 font-display text-xs font-bold transition-all duration-200 bg-white/5 text-gray-400 border border-white/10 opacity-60 hover:opacity-100";
    });

    const activeBtn = document.getElementById(`btn-${dimName}`);
    if (activeBtn) {
        activeBtn.className = "dim-btn flex items-center gap-2 rounded-full px-5 py-2.5 font-display text-xs font-bold transition-all duration-200 bg-indigo-600 text-white shadow-[0_0_15px_rgba(79,70,229,0.5)]";
    }

    showToast("🌀 Realm Shift", `Warped into ${DIMENSIONS[dimName].name}`);
    updateHUD();
    saveData();
}

function craftItem(itemKey) {
    if (itemKey === 'spear' && player.wood >= 10 && player.stone >= 10) {
        player.wood -= 10; player.stone -= 10;
        player.weaponKey = 'spear'; player.weapon = WEAPONS.spear;
        showToast("🗡️ Weapon Crafted", "Equipped Stone Spear!");
    } else if (itemKey === 'hammer' && player.wood >= 15 && player.ore >= 20) {
        player.wood -= 15; player.ore -= 20;
        player.weaponKey = 'hammer'; player.weapon = WEAPONS.hammer;
        showToast("🔨 Weapon Crafted", "Equipped Ore Sledge!");
    } else if (itemKey === 'blade' && player.wood >= 25 && player.stone >= 25 && player.ore >= 15) {
        player.wood -= 25; player.stone -= 25; player.ore -= 15;
        player.weaponKey = 'blade'; player.weapon = WEAPONS.blade;
        showToast("⚡ Weapon Crafted", "Equipped Plasma Sword!");
    } else if (itemKey === 'scythe' && player.wood >= 40 && player.stone >= 40 && player.ore >= 30) {
        player.wood -= 40; player.stone -= 40; player.ore -= 30;
        player.weaponKey = 'scythe'; player.weapon = WEAPONS.scythe;
        showToast("🔮 Weapon Crafted", "Equipped Void Scythe!");
    } else if (itemKey === 'heal' && player.wood >= 5 && player.stone >= 5) {
        player.wood -= 5; player.stone -= 5;
        player.hp = Math.min(player.maxHp, player.hp + 45);
        showToast("🧪 Vitality Restored", "Gained +45 HP!");
    } else {
        showToast("❌ Missing Resources", "Gather resources to craft this item.");
    }
    updateHUD();
    saveData();
}

canvas.addEventListener('pointerdown', () => {
    if (player.hp <= 0) return;

    player.isAttacking = true;
    player.attackProgress = 0;

    const currentData = dimEntities[currentDim];
    const swingX = player.x + Math.cos(player.facingAngle) * player.weapon.range * 0.6;
    const swingY = player.y + Math.sin(player.facingAngle) * player.weapon.range * 0.6;
    createParticles(swingX, swingY, player.weapon.color, 8);

    currentData.resources.forEach((res, index) => {
        if (Math.hypot(res.x - player.x, res.y - player.y) <= player.weapon.range + 20) {
            res.hp -= 1;
            res.scale = 1.3;
            const pColor = res.type === 'tree' ? '#34d399' : res.type === 'stone' ? '#9ca3af' : '#38bdf8';
            createParticles(res.x, res.y, pColor, 5);

            if (res.hp <= 0) {
                if (res.type === 'tree') player.wood += Math.floor(Math.random() * 4) + 3;
                if (res.type === 'stone') player.stone += Math.floor(Math.random() * 3) + 2;
                if (res.type === 'ore') player.ore += Math.floor(Math.random() * 3) + 1;
                currentData.resources.splice(index, 1);
                updateHUD();
                saveData();
            }
        }
    });

    currentData.structures.forEach(struct => {
        if (struct.hasChest && !struct.chestOpened) {
            if (Math.hypot(struct.x - player.x, struct.y - player.y) <= player.weapon.range + 30) {
                struct.chestOpened = true;
                player.wood += 20; player.stone += 20; player.ore += 15;

                if (struct.containsShard && player.shards[currentDim] < 5) {
                    player.shards[currentDim]++;
                    showToast("🔮 PORTAL SHARD DISCOVERED!", `Collected (${player.shards[currentDim]}/5) Shards!`);

                    if (player.shards[currentDim] >= 5) {
                        const nextDim = DIMENSIONS[currentDim].nextDim;
                        if (nextDim) {
                            player.unlockedDims[nextDim] = true;
                            showToast("🌟 PORTAL IGNITED!", `${DIMENSIONS[nextDim].name} IS UNLOCKED!`);
                        }
                    }
                } else {
                    showToast("🎁 Ancient Loot Chest", "+20 Wood, +20 Stone, +15 Ore acquired!");
                }

                createParticles(struct.x, struct.y, "#c084fc", 20);
                updateHUD();
                saveData();
            }
        }
    });

    currentData.enemies.forEach((enemy, index) => {
        if (Math.hypot(enemy.x - player.x, enemy.y - player.y) <= player.weapon.range + enemy.radius) {
            let isCrit = Math.random() < 0.25;
            let dmg = isCrit ? Math.floor(player.weapon.damage * 1.5) : player.weapon.damage;

            enemy.hp -= dmg;
            enemy.hitFlash = 8;
            const angle = Math.atan2(enemy.y - player.y, enemy.x - player.x);
            enemy.x += Math.cos(angle) * 18;
            enemy.y += Math.sin(angle) * 18;

            createParticles(enemy.x, enemy.y, '#f87171', 8);

            if (enemy.hp <= 0) {
                createParticles(enemy.x, enemy.y, '#ef4444', 20);
                currentData.enemies.splice(index, 1);
                updateHUD();
                saveData();
            }
        }
    });
});

function createParticles(x, y, color, count) {
    for (let i = 0; i < count; i++) {
        particles.push({
            x: x, y: y,
            vx: (Math.random() - 0.5) * 6, vy: (Math.random() - 0.5) * 6,
            color: color, radius: Math.random() * 3 + 2, alpha: 1
        });
    }
}

function triggerDamageFlash() {
    const flashElem = document.getElementById('damage-flash');
    flashElem.style.opacity = '1';
    setTimeout(() => { flashElem.style.opacity = '0'; }, 150);
}

function respawnPlayer() {
    player.hp = player.maxHp;
    player.x = HALF_WORLD;
    player.y = HALF_WORLD;
    showToast("✨ REGENERATED", "Restored vitality at realm spawn point.");
    updateHUD();
}

function update() {
    if (player.hp <= 0) return;

    let dx = 0, dy = 0;
    if (keys['w'] || keys['arrowup']) dy -= 1;
    if (keys['s'] || keys['arrowdown']) dy += 1;
    if (keys['a'] || keys['arrowleft']) dx -= 1;
    if (keys['d'] || keys['arrowright']) dx += 1;

    if (dx !== 0 && dy !== 0) { dx *= 0.7071; dy *= 0.7071; }

    player.x = Math.max(player.radius, Math.min(WORLD_SIZE - player.radius, player.x + dx * player.speed));
    player.y = Math.max(player.radius, Math.min(WORLD_SIZE - player.radius, player.y + dy * player.speed));

    const cameraX = player.x - canvas.width / 2;
    const cameraY = player.y - canvas.height / 2;
    player.facingAngle = Math.atan2((mouseY + cameraY) - player.y, (mouseX + cameraX) - player.x);

    particles.forEach((p, i) => {
        p.x += p.vx; p.y += p.vy; p.alpha -= 0.04;
        if (p.alpha <= 0) particles.splice(i, 1);
    });

    const currentData = dimEntities[currentDim];
    currentData.resources.forEach(res => {
        if (res.scale > 1) res.scale -= 0.05;
    });

    currentData.enemies.forEach(enemy => {
        if (enemy.hitFlash > 0) enemy.hitFlash--;

        const dist = Math.hypot(player.x - enemy.x, player.y - enemy.y);
        if (dist < 500) {
            const angle = Math.atan2(player.y - enemy.y, player.x - enemy.x);
            enemy.x += Math.cos(angle) * enemy.speed;
            enemy.y += Math.sin(angle) * enemy.speed;
        }

        if (dist < player.radius + enemy.radius) {
            player.hp -= enemy.damage;
            triggerDamageFlash();
            updateHUD();
            if (player.hp <= 0) respawnPlayer();
        }
    });
}

// --- GRAPHICS RENDERING HELPERS ---
function drawBiomeSquare(x, y, w, h, biome, camX, camY) {
    const rx = x - camX, ry = y - camY;
    if (rx + w < 0 || rx > canvas.width || ry + h < 0 || ry > canvas.height) return;
    
    // Biome Ground Base
    ctx.fillStyle = biome.bg;
    ctx.fillRect(rx, ry, w, h);

    // Grid Texture Pattern
    ctx.strokeStyle = biome.grid;
    ctx.lineWidth = 1;
    const step = 100;
    const startX = Math.floor(Math.max(rx, 0) / step) * step;
    const endX = Math.min(rx + w, canvas.width);
    const startY = Math.floor(Math.max(ry, 0) / step) * step;
    const endY = Math.min(ry + h, canvas.height);

    for (let gx = startX; gx < endX; gx += step) {
        ctx.beginPath();
        ctx.moveTo(gx, Math.max(ry, 0));
        ctx.lineTo(gx, endY);
        ctx.stroke();
    }
    for (let gy = startY; gy < endY; gy += step) {
        ctx.beginPath();
        ctx.moveTo(Math.max(rx, 0), gy);
        ctx.lineTo(endX, gy);
        ctx.stroke();
    }
}

function drawResource(res, rx, ry) {
    ctx.save();
    ctx.translate(rx, ry);
    ctx.scale(res.scale, res.scale);

    if (res.type === 'tree') {
        // Tree Shadow
        ctx.fillStyle = 'rgba(0,0,0,0.25)';
        ctx.beginPath();
        ctx.ellipse(0, 18, 22, 10, 0, 0, Math.PI * 2);
        ctx.fill();

        // Trunk
        ctx.fillStyle = '#78350f';
        ctx.fillRect(-5, -5, 10, 22);

        // Leaves Foliage (Multi-layered pine tree)
        ctx.fillStyle = '#047857';
        ctx.beginPath();
        ctx.arc(0, -12, 22, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#10b981';
        ctx.beginPath();
        ctx.arc(-6, -18, 14, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#34d399';
        ctx.beginPath();
        ctx.arc(4, -22, 10, 0, Math.PI * 2);
        ctx.fill();
    } else if (res.type === 'stone') {
        // Rock Base & Shadow
        ctx.fillStyle = 'rgba(0,0,0,0.3)';
        ctx.beginPath();
        ctx.ellipse(0, 10, 18, 8, 0, 0, Math.PI * 2);
        ctx.fill();

        // Bouldered Stone Shape
        ctx.fillStyle = '#64748b';
        ctx.beginPath();
        ctx.moveTo(-16, 8);
        ctx.lineTo(-20, -6);
        ctx.lineTo(-6, -18);
        ctx.lineTo(14, -14);
        ctx.lineTo(20, 4);
        ctx.lineTo(8, 14);
        ctx.closePath();
        ctx.fill();

        // Stone Highlight Facet
        ctx.fillStyle = '#94a3b8';
        ctx.beginPath();
        ctx.moveTo(-6, -18);
        ctx.lineTo(14, -14);
        ctx.lineTo(2, -2);
        ctx.lineTo(-12, -4);
        ctx.closePath();
        ctx.fill();
    } else if (res.type === 'ore') {
        // Glowing Ore Node
        ctx.fillStyle = 'rgba(0,0,0,0.35)';
        ctx.beginPath();
        ctx.ellipse(0, 10, 20, 8, 0, 0, Math.PI * 2);
        ctx.fill();

        // Dark Ore Base Rock
        ctx.fillStyle = '#334155';
        ctx.beginPath();
        ctx.moveTo(-18, 6);
        ctx.lineTo(-14, -14);
        ctx.lineTo(10, -18);
        ctx.lineTo(18, -2);
        ctx.lineTo(12, 12);
        ctx.lineTo(-10, 14);
        ctx.closePath();
        ctx.fill();

        // Glowing Crystals
        ctx.fillStyle = '#06b6d4';
        ctx.shadowColor = '#38bdf8';
        ctx.shadowBlur = 10;
        
        ctx.beginPath();
        ctx.moveTo(-8, 2); ctx.lineTo(-2, -12); ctx.lineTo(4, 2); ctx.closePath();
        ctx.fill();

        ctx.beginPath();
        ctx.moveTo(2, 0); ctx.lineTo(12, -10); ctx.lineTo(12, 4); ctx.closePath();
        ctx.fill();
        ctx.shadowBlur = 0;
    }
    ctx.restore();
}

function drawStructure(struct, cameraX, cameraY) {
    const sx = struct.x - cameraX, sy = struct.y - cameraY;
    if (sx < -150 || sx > canvas.width + 150 || sy < -150 || sy > canvas.height + 150) return;

    // Ancient Ruin Floor
    ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
    ctx.fillRect(sx - struct.width / 2, sy - struct.height / 2, struct.width, struct.height);
    
    // Border Pillars
    ctx.strokeStyle = struct.containsShard && !struct.chestOpened ? '#c084fc' : '#475569';
    ctx.lineWidth = 3;
    ctx.strokeRect(sx - struct.width / 2, sy - struct.height / 2, struct.width, struct.height);

    // Chest Object
    if (struct.hasChest) {
        ctx.fillStyle = 'rgba(0,0,0,0.4)';
        ctx.fillRect(sx - 14, sy - 10, 28, 24);

        if (struct.chestOpened) {
            ctx.fillStyle = '#475569';
            ctx.fillRect(sx - 12, sy - 12, 24, 20);
            ctx.fillStyle = '#1e293b';
            ctx.fillRect(sx - 10, sy - 10, 20, 8);
        } else {
            ctx.fillStyle = struct.containsShard ? '#9333ea' : '#d97706';
            ctx.fillRect(sx - 12, sy - 12, 24, 20);

            // Lock / Latch
            ctx.fillStyle = struct.containsShard ? '#e9d5ff' : '#fef08a';
            ctx.fillRect(sx - 3, sy - 4, 6, 8);
        }
    }
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const cameraX = player.x - canvas.width / 2;
    const cameraY = player.y - canvas.height / 2;

    const dimConfig = DIMENSIONS[currentDim];

    // Render Biomes Backgrounds
    drawBiomeSquare(0, 0, HALF_WORLD, HALF_WORLD, dimConfig.biomes[0], cameraX, cameraY);
    drawBiomeSquare(HALF_WORLD, 0, HALF_WORLD, HALF_WORLD, dimConfig.biomes[1], cameraX, cameraY);
    drawBiomeSquare(0, HALF_WORLD, HALF_WORLD, HALF_WORLD, dimConfig.biomes[2], cameraX, cameraY);
    drawBiomeSquare(HALF_WORLD, HALF_WORLD, HALF_WORLD, HALF_WORLD, dimConfig.biomes[3], cameraX, cameraY);

    const currentData = dimEntities[currentDim];

    // Render Ruins & Structures
    currentData.structures.forEach(struct => drawStructure(struct, cameraX, cameraY));

    // Render Resources
    currentData.resources.forEach(res => {
        const rx = res.x - cameraX, ry = res.y - cameraY;
        if (rx >= -40 && rx <= canvas.width + 40 && ry >= -40 && ry <= canvas.height + 40) {
            drawResource(res, rx, ry);
        }
    });

    // Render Enemies & Mobs
    currentData.enemies.forEach(enemy => {
        const ex = enemy.x - cameraX, ey = enemy.y - cameraY;
        if (ex < -50 || ex > canvas.width + 50 || ey < -50 || ey > canvas.height + 50) return;

        const sprite = loadedSprites[enemy.key];

        // Enemy Shadow
        ctx.fillStyle = 'rgba(0,0,0,0.35)';
        ctx.beginPath();
        ctx.ellipse(ex, ey + enemy.radius * 0.8, enemy.radius * 0.9, enemy.radius * 0.4, 0, 0, Math.PI * 2);
        ctx.fill();

        if (sprite && sprite.isLoaded) {
            ctx.save();
            ctx.beginPath();
            ctx.arc(ex, ey, enemy.radius, 0, Math.PI * 2);
            ctx.clip();
            ctx.drawImage(sprite, ex - enemy.radius, ey - enemy.radius, enemy.radius * 2, enemy.radius * 2);
            ctx.restore();

            ctx.strokeStyle = enemy.hitFlash > 0 ? '#ffffff' : 'rgba(255,255,255,0.4)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(ex, ey, enemy.radius, 0, Math.PI * 2);
            ctx.stroke();
        } else {
            // Fallback Circle
            ctx.fillStyle = enemy.hitFlash > 0 ? '#ffffff' : MOBS_CONFIG[enemy.key].fallbackColor;
            ctx.beginPath();
            ctx.arc(ex, ey, enemy.radius, 0, Math.PI * 2);
            ctx.fill();
        }

        // ENEMY NAME TAG & HP BAR
        ctx.font = 'bold 11px "Plus Jakarta Sans", sans-serif';
        ctx.textAlign = 'center';
        ctx.fillStyle = '#f3f4f6';
        ctx.shadowColor = '#000000';
        ctx.shadowBlur = 4;
        ctx.fillText(enemy.name, ex, ey - enemy.radius - 14);
        ctx.shadowBlur = 0;

        // Health Bar
        const barWidth = Math.max(36, enemy.radius * 1.6);
        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        ctx.fillRect(ex - barWidth / 2, ey - enemy.radius - 9, barWidth, 5);
        ctx.fillStyle = '#ef4444';
        ctx.fillRect(ex - barWidth / 2, ey - enemy.radius - 9, (Math.max(0, enemy.hp) / enemy.maxHp) * barWidth, 5);
    });

    // Render Particles
    particles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.alpha;
        ctx.beginPath();
        ctx.arc(p.x - cameraX, p.y - cameraY, p.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1.0;
    });

    // Render Player
    const px = canvas.width / 2, py = canvas.height / 2;
    ctx.save();
    ctx.translate(px, py);

    // Player Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.beginPath();
    ctx.ellipse(0, 14, player.radius * 0.9, player.radius * 0.4, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.rotate(player.facingAngle);

    // Weapon Swing
    ctx.strokeStyle = player.weapon.color;
    ctx.lineWidth = 6;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(player.weapon.range, 0);
    ctx.stroke();

    // Player Avatar Circle
    ctx.fillStyle = '#6366f1';
    ctx.beginPath();
    ctx.arc(0, 0, player.radius, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = '#a5b4fc';
    ctx.lineWidth = 3;
    ctx.stroke();

    // Eye Indicators
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(6, -5, 3.5, 0, Math.PI * 2);
    ctx.arc(6, 5, 3.5, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();

    // Minimap
    minimapCtx.fillStyle = '#030712';
    minimapCtx.fillRect(0, 0, 160, 160);
    const mmScale = 160 / WORLD_SIZE;
    minimapCtx.fillStyle = '#6366f1';
    minimapCtx.fillRect(player.x * mmScale - 2, player.y * mmScale - 2, 5, 5);
}

function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

gameLoop();
</script>
