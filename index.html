<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Survival Realm</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { background: #000; color: #fff; font-family: 'Segoe UI', monospace; overflow: hidden; }
        
        #gameCanvas { display: block; width: 100vw; height: 100vh; background: #222; }

        /* Biome Announcement Popup */
        #biome-toast {
            position: absolute; top: 10%; left: 50%; transform: translate(-50%, -50%);
            font-size: 24px; font-weight: bold; letter-spacing: 2px; color: #fff;
            text-shadow: 2px 2px 8px #000; background: rgba(0,0,0,0.75);
            padding: 10px 24px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2);
            opacity: 0; transition: opacity 0.5s ease, transform 0.5s ease; pointer-events: none;
        }
        #biome-toast.show { opacity: 1; transform: translate(-50%, -20%); }

        /* Stats HUD */
        #stats-hud {
            position: absolute; top: 20px; left: 20px; background: rgba(15, 15, 20, 0.85);
            padding: 12px 18px; border-radius: 8px; border: 1px solid #444; font-size: 14px;
            backdrop-filter: blur(4px); pointer-events: none;
        }
        .stat-bar { margin: 4px 0; }
        .rarity-Common { color: #aaaaaa; }
        .rarity-Uncommon { color: #1eff00; }
        .rarity-Rare { color: #0070dd; }
        .rarity-Legendary { color: #ff8000; }

        /* Crafting Panel */
        #crafting-panel {
            position: absolute; bottom: 20px; left: 20px; background: rgba(15, 15, 20, 0.85);
            border: 1px solid #444; border-radius: 10px; padding: 12px; max-width: 320px;
            backdrop-filter: blur(4px);
        }
        #crafting-panel h3 { margin-bottom: 8px; font-size: 15px; color: #ffcc00; text-transform: uppercase; }
        .craft-btn {
            display: block; width: 100%; margin: 4px 0; padding: 8px 10px; background: #222;
            color: #eee; border: 1px solid #555; border-radius: 6px; cursor: pointer; text-align: left;
            font-size: 12px; font-family: inherit; transition: 0.2s;
        }
        .craft-btn:hover { background: #3a3a4a; border-color: #ffcc00; }
    </style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<div id="biome-toast">DISCOVERED: PLAINS</div>

<div id="stats-hud">
    <div class="stat-bar">❤️ HP: <span id="hp-val">100</span></div>
    <div class="stat-bar">🪵 Wood: <span id="wood-val">0</span> | 🪨 Stone: <span id="stone-val">0</span> | 💎 Ore: <span id="ore-val">0</span></div>
    <div class="stat-bar">⚔️ Weapon: <span id="weapon-val" class="rarity-Common">Wooden Stick (Common)</span></div>
    <div style="font-size: 11px; color: #aaa; margin-top: 6px;">[WASD] Move | [Click] Attack/Harvest</div>
</div>

<div id="crafting-panel">
    <h3>Crafting Station</h3>
    <button class="craft-btn" onclick="craftItem('spear')">🗡️ Stone Spear (10 W, 10 S)</button>
    <button class="craft-btn" onclick="craftItem('hammer')">🔨 Ore Sledge (15 W, 20 O)</button>
    <button class="craft-btn" onclick="craftItem('blade')">⚡ Plasma Sword (20 W, 20 S, 15 O)</button>
    <button class="craft-btn" onclick="craftItem('heal')">🧪 Healing Salve (5 W, 5 S)</button>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

// CONFIGURATION
const WORLD_SIZE = 3000;
const HALF_WORLD = WORLD_SIZE / 2;

const WEAPONS = {
    stick:  { name: 'Wooden Stick', damage: 15, range: 50, rarity: 'Common', color: '#aaaaaa', ability: 'None' },
    spear:  { name: 'Stone Spear', damage: 30, range: 75, rarity: 'Uncommon', color: '#1eff00', ability: 'Knockback' },
    hammer: { name: 'Ore Sledge', damage: 55, range: 60, rarity: 'Rare', color: '#0070dd', ability: 'Heavy Stun' },
    blade:  { name: 'Plasma Sword', damage: 95, range: 90, rarity: 'Legendary', color: '#ff8000', ability: 'Area Burst' }
};

const BIOMES = {
    TOP_LEFT:     { name: 'GRASSLANDS', color: '#2d6a4f' },
    TOP_RIGHT:    { name: 'DESERT WASTES', color: '#e9c46a' },
    BOTTOM_LEFT:  { name: 'FROST TUNDRA', color: '#a8dadc' },
    BOTTOM_RIGHT: { name: 'CORRUPTED REALM', color: '#3d0c02' }
};

// PLAYER STATE
let player = {
    x: HALF_WORLD,
    y: HALF_WORLD,
    radius: 16,
    speed: 4,
    hp: 100,
    maxHp: 100,
    wood: 0,
    stone: 0,
    ore: 0,
    weapon: WEAPONS.stick,
    currentBiome: ''
};

// INPUT REGISTRATION
const keys = {};
window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

// GAME ENTITIES
let resources = [];
let enemies = [];
let floatingTexts = [];
let attackFx = null;

// SPAWN RESOURCES
for (let i = 0; i < 200; i++) {
    const types = ['tree', 'stone', 'ore'];
    const type = types[Math.floor(Math.random() * types.length)];
    resources.push({
        x: Math.random() * (WORLD_SIZE - 200) + 100,
        y: Math.random() * (WORLD_SIZE - 200) + 100,
        type: type,
        hp: type === 'ore' ? 3 : type === 'stone' ? 2 : 1
    });
}

// SPAWN ENEMIES
for (let i = 0; i < 30; i++) {
    let ex = Math.random() * WORLD_SIZE;
    let ey = Math.random() * WORLD_SIZE;
    if (Math.hypot(ex - player.x, ey - player.y) > 400) {
        enemies.push({ x: ex, y: ey, hp: 50, radius: 14, speed: 2 });
    }
}

// ATTACK MECHANIC
canvas.addEventListener('pointerdown', (e) => {
    if (player.hp <= 0) return;

    const cameraX = player.x - canvas.width / 2;
    const cameraY = player.y - canvas.height / 2;
    const mouseWorldX = e.clientX + cameraX;
    const mouseWorldY = e.clientY + cameraY;

    attackFx = { x: player.x, y: player.y, radius: player.weapon.range, alpha: 0.6, color: player.weapon.color };

    // Harvest Resources
    resources.forEach((res, index) => {
        if (Math.hypot(res.x - player.x, res.y - player.y) <= player.weapon.range + 15) {
            res.hp -= 1;
            spawnFloatingText(res.x, res.y, "-1", "#ffcc00");
            if (res.hp <= 0) {
                if (res.type === 'tree') player.wood += Math.floor(Math.random() * 3) + 2;
                if (res.type === 'stone') player.stone += Math.floor(Math.random() * 3) + 2;
                if (res.type === 'ore') player.ore += Math.floor(Math.random() * 2) + 1;
                resources.splice(index, 1);
                updateHUD();
            }
        }
    });

    // Damage Enemies
    enemies.forEach((enemy, index) => {
        if (Math.hypot(enemy.x - player.x, enemy.y - player.y) <= player.weapon.range + enemy.radius) {
            enemy.hp -= player.weapon.damage;
            
            // Knockback effect
            if (player.weapon.ability === 'Knockback' || player.weapon.ability === 'Area Burst') {
                const angle = Math.atan2(enemy.y - player.y, enemy.x - player.x);
                enemy.x += Math.cos(angle) * 50;
                enemy.y += Math.sin(angle) * 50;
            }

            spawnFloatingText(enemy.x, enemy.y, `-${player.weapon.damage}`, "#ff4444");

            if (enemy.hp <= 0) {
                enemies.splice(index, 1);
            }
        }
    });
});

function spawnFloatingText(x, y, text, color) {
    floatingTexts.push({ x: x, y: y, text: text, color: color, alpha: 1, life: 30 });
}

function update() {
    if (player.hp <= 0) return;

    // Movement
    let dx = 0, dy = 0;
    if (keys['w']) dy -= 1;
    if (keys['s']) dy += 1;
    if (keys['a']) dx -= 1;
    if (keys['d']) dx += 1;

    if (dx !== 0 && dy !== 0) {
        dx *= 0.7071;
        dy *= 0.7071;
    }

    player.x = Math.max(player.radius, Math.min(WORLD_SIZE - player.radius, player.x + dx * player.speed));
    player.y = Math.max(player.radius, Math.min(WORLD_SIZE - player.radius, player.y + dy * player.speed));

    // Biome Check
    let biome = BIOMES.TOP_LEFT.name;
    if (player.x >= HALF_WORLD && player.y < HALF_WORLD) biome = BIOMES.TOP_RIGHT.name;
    else if (player.x < HALF_WORLD && player.y >= HALF_WORLD) biome = BIOMES.BOTTOM_LEFT.name;
    else if (player.x >= HALF_WORLD && player.y >= HALF_WORLD) biome = BIOMES.BOTTOM_RIGHT.name;

    if (player.currentBiome !== biome) {
        player.currentBiome = biome;
        showToast("ENTERED: " + biome);
    }

    // Enemy AI & Collision
    enemies.forEach(enemy => {
        const dist = Math.hypot(player.x - enemy.x, player.y - enemy.y);
        if (dist < 450) {
            const angle = Math.atan2(player.y - enemy.y, player.x - enemy.x);
            enemy.x += Math.cos(angle) * enemy.speed;
            enemy.y += Math.sin(angle) * enemy.speed;
        }

        if (dist < player.radius + enemy.radius) {
            player.hp -= 0.25;
            updateHUD();
            if (player.hp <= 0) showToast("GAME OVER! Refresh to Restart.");
        }
    });
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const cameraX = player.x - canvas.width / 2;
    const cameraY = player.y - canvas.height / 2;

    // Draw Biomes Background
    ctx.fillStyle = BIOMES.TOP_LEFT.color;
    ctx.fillRect(0 - cameraX, 0 - cameraY, HALF_WORLD, HALF_WORLD);

    ctx.fillStyle = BIOMES.TOP_RIGHT.color;
    ctx.fillRect(HALF_WORLD - cameraX, 0 - cameraY, HALF_WORLD, HALF_WORLD);

    ctx.fillStyle = BIOMES.BOTTOM_LEFT.color;
    ctx.fillRect(0 - cameraX, HALF_WORLD - cameraY, HALF_WORLD, HALF_WORLD);

    ctx.fillStyle = BIOMES.BOTTOM_RIGHT.color;
    ctx.fillRect(HALF_WORLD - cameraX, HALF_WORLD - cameraY, HALF_WORLD, HALF_WORLD);

    // Draw Map Grid Lines
    ctx.strokeStyle = "rgba(0, 0, 0, 0.15)";
    ctx.lineWidth = 2;
    for (let x = 0; x < WORLD_SIZE; x += 100) {
        ctx.beginPath();
        ctx.moveTo(x - cameraX, 0 - cameraY);
        ctx.lineTo(x - cameraX, WORLD_SIZE - cameraY);
        ctx.stroke();
    }
    for (let y = 0; y < WORLD_SIZE; y += 100) {
        ctx.beginPath();
        ctx.moveTo(0 - cameraX, y - cameraY);
        ctx.lineTo(WORLD_SIZE - cameraX, y - cameraY);
        ctx.stroke();
    }

    // Draw Resources
    resources.forEach(res => {
        const rx = res.x - cameraX;
        const ry = res.y - cameraY;

        if (res.type === 'tree') {
            ctx.fillStyle = "#8b5a2b";
            ctx.fillRect(rx - 4, ry, 8, 14);
            ctx.fillStyle = "#2d6a4f";
            ctx.beginPath();
            ctx.arc(rx, ry - 4, 14, 0, Math.PI * 2);
            ctx.fill();
        } else if (res.type === 'stone') {
            ctx.fillStyle = "#808080";
            ctx.beginPath();
            ctx.arc(rx, ry, 12, 0, Math.PI * 2);
            ctx.fill();
        } else if (res.type === 'ore') {
            ctx.fillStyle = "#00ffff";
            ctx.beginPath();
            ctx.arc(rx, ry, 10, 0, Math.PI * 2);
            ctx.fill();
        }
    });

    // Draw Enemies
    enemies.forEach(enemy => {
        const ex = enemy.x - cameraX;
        const ey = enemy.y - cameraY;
        ctx.fillStyle = "#e63946";
        ctx.beginPath();
        ctx.arc(ex, ey, enemy.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = "#fff";
        ctx.lineWidth = 1.5;
        ctx.stroke();
    });

    // Draw Player
    const px = canvas.width / 2;
    const py = canvas.height / 2;
    ctx.fillStyle = "#00b4d8";
    ctx.beginPath();
    ctx.arc(px, py, player.radius, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 2;
    ctx.stroke();

    // Draw Attack Animation
    if (attackFx) {
        ctx.fillStyle = attackFx.color;
        ctx.globalAlpha = attackFx.alpha;
        ctx.beginPath();
        ctx.arc(px, py, attackFx.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1.0;

        attackFx.alpha -= 0.08;
        if (attackFx.alpha <= 0) attackFx = null;
    }

    // Draw Floating Damage Text
    floatingTexts.forEach((ft, i) => {
        ctx.fillStyle = ft.color;
        ctx.globalAlpha = ft.alpha;
        ctx.font = "bold 15px monospace";
        ctx.fillText(ft.text, ft.x - cameraX, ft.y - cameraY);
        ctx.globalAlpha = 1.0;
        ft.y -= 0.8;
        ft.alpha -= 0.03;
        if (ft.alpha <= 0) floatingTexts.splice(i, 1);
    });

    // Draw Minimap (Top Right)
    const mapSize = 130;
    const mapX = canvas.width - mapSize - 20;
    const mapY = 20;
    const scale = mapSize / WORLD_SIZE;

    ctx.fillStyle = "rgba(0, 0, 0, 0.75)";
    ctx.fillRect(mapX, mapY, mapSize, mapSize);
    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 2;
    ctx.strokeRect(mapX, mapY, mapSize, mapSize);

    // Minimap Player Dot
    ctx.fillStyle = "#00ffff";
    ctx.beginPath();
    ctx.arc(mapX + player.x * scale, mapY + player.y * scale, 3, 0, Math.PI * 2);
    ctx.fill();

    // Minimap Enemy Dots
    ctx.fillStyle = "#ff0000";
    enemies.forEach(e => {
        ctx.fillRect(mapX + e.x * scale, mapY + e.y * scale, 2, 2);
    });
}

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}

function updateHUD() {
    document.getElementById('hp-val').innerText = Math.max(0, Math.floor(player.hp));
    document.getElementById('wood-val').innerText = player.wood;
    document.getElementById('stone-val').innerText = player.stone;
    document.getElementById('ore-val').innerText = player.ore;
    
    let wElem = document.getElementById('weapon-val');
    wElem.innerText = `${player.weapon.name} (${player.weapon.rarity})`;
    wElem.className = `rarity-${player.weapon.rarity}`;
}

function showToast(msg) {
    const toast = document.getElementById('biome-toast');
    toast.innerText = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2200);
}

function craftItem(type) {
    if (type === 'spear' && player.wood >= 10 && player.stone >= 10) {
        player.wood -= 10; player.stone -= 10;
        player.weapon = WEAPONS.spear;
        showToast("CRAFTED: Stone Spear!");
    } else if (type === 'hammer' && player.wood >= 15 && player.ore >= 20) {
        player.wood -= 15; player.ore -= 20;
        player.weapon = WEAPONS.hammer;
        showToast("CRAFTED: Ore Sledge!");
    } else if (type === 'blade' && player.wood >= 20 && player.stone >= 20 && player.ore >= 15) {
        player.wood -= 20; player.stone -= 20; player.ore -= 15;
        player.weapon = WEAPONS.blade;
        showToast("CRAFTED: Plasma Sword!");
    } else if (type === 'heal' && player.wood >= 5 && player.stone >= 5) {
        player.wood -= 5; player.stone -= 5;
        player.hp = Math.min(100, player.hp + 40);
        showToast("HEALED +40 HP!");
    } else {
        showToast("NOT ENOUGH RESOURCES!");
    }
    updateHUD();
}

// Start Game
loop();
</script>
</body>
</html>
