<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Survival Realm: Directory-Based Enemy Faces & Crafting</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800;900&display=swap');

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { background: #07090e; color: #f3f4f6; font-family: 'Plus Jakarta Sans', sans-serif; overflow: hidden; }
        
        #gameCanvas { display: block; width: 100vw; height: 100vh; background: #0a0d14; cursor: crosshair; }

        /* Damage Screen Vignette Overlay */
        #damage-flash {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            background: radial-gradient(circle, rgba(239, 68, 68, 0) 50%, rgba(239, 68, 68, 0.6) 100%);
            pointer-events: none; opacity: 0; transition: opacity 0.15s ease-out; z-index: 5;
        }

        /* Biome Toast */
        #biome-toast {
            position: absolute; top: 5%; left: 50%; transform: translate(-50%, -50%) scale(0.9);
            font-size: 15px; font-weight: 800; letter-spacing: 1.5px; color: #ffffff;
            background: rgba(13, 17, 23, 0.88); border: 1px solid rgba(255, 255, 255, 0.18);
            padding: 10px 22px; border-radius: 99px; backdrop-filter: blur(12px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.6); opacity: 0; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); pointer-events: none;
            display: flex; align-items: center; gap: 8px; z-index: 10;
        }
        #biome-toast.show { opacity: 1; transform: translate(-50%, 0) scale(1); }

        /* Stats HUD Panel */
        #stats-hud {
            position: absolute; top: 20px; left: 20px;
            background: rgba(13, 17, 23, 0.88); border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 16px; border-radius: 18px; backdrop-filter: blur(16px);
            box-shadow: 0 16px 32px rgba(0,0,0,0.5); width: 270px; pointer-events: none; z-index: 10;
        }
        
        .hud-header { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 1.5px; color: #9ca3af; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
        
        .hp-bar-outer {
            width: 100%; height: 16px; background: rgba(255, 255, 255, 0.08);
            border-radius: 8px; overflow: hidden; margin-bottom: 12px; border: 1px solid rgba(255,255,255,0.08);
            position: relative;
        }
        .hp-bar-inner {
            height: 100%; width: 100%; background: linear-gradient(90deg, #ef4444, #f87171);
            border-radius: 8px; transition: width 0.2s ease;
        }
        .hp-text {
            position: absolute; width: 100%; top: 0; left: 0; height: 100%;
            display: flex; align-items: center; justify-content: center;
            font-size: 10px; font-weight: 800; color: #ffffff; text-shadow: 0 1px 3px rgba(0,0,0,0.8);
        }

        .resource-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 12px; }
        .res-card {
            background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 8px 6px; border-radius: 10px; text-align: center; font-size: 13px; font-weight: 800;
        }
        .res-card small { display: block; font-size: 9px; color: #9ca3af; font-weight: 600; margin-top: 2px; }

        .weapon-card {
            display: flex; align-items: center; justify-content: space-between;
            background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 8px 12px; border-radius: 10px; font-size: 12px; font-weight: 700; margin-bottom: 10px;
        }

        .stats-summary {
            display: flex; justify-content: space-between; font-size: 11px; font-weight: 700; color: #9ca3af;
            background: rgba(0,0,0,0.2); padding: 6px 10px; border-radius: 8px;
        }
        .stats-summary span { color: #f3f4f6; }

        .rarity-Common { color: #d1d5db; }
        .rarity-Uncommon { color: #4ade80; }
        .rarity-Rare { color: #60a5fa; }
        .rarity-Legendary { color: #fb923c; }
        .rarity-Mythic { color: #c084fc; }

        /* Crafting Scroll Panel UI */
        #crafting-panel {
            position: absolute; bottom: 20px; left: 20px;
            background: rgba(13, 17, 23, 0.88); border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 14px; border-radius: 18px; backdrop-filter: blur(16px);
            box-shadow: 0 16px 32px rgba(0,0,0,0.5); width: 320px; max-height: 260px; overflow-y: auto; z-index: 10;
        }

        #crafting-panel::-webkit-scrollbar { width: 4px; }
        #crafting-panel::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 4px; }
        
        .craft-btn {
            display: flex; align-items: center; justify-content: space-between;
            width: 100%; margin: 6px 0; padding: 9px 12px;
            background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px; color: #f3f4f6; font-family: inherit; font-size: 12px; font-weight: 700;
            cursor: pointer; transition: all 0.2s ease;
        }
        .craft-btn:hover { background: rgba(255, 255, 255, 0.12); border-color: rgba(255, 255, 255, 0.25); transform: translateY(-1px); }
        .craft-reqs { font-size: 10px; color: #9ca3af; font-weight: 600; }

        /* Minimap Overlay */
        #minimap-container {
            position: absolute; bottom: 20px; right: 20px;
            width: 150px; height: 150px; border-radius: 18px;
            background: rgba(13, 17, 23, 0.88); border: 2px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px); overflow: hidden; box-shadow: 0 16px 32px rgba(0,0,0,0.6);
            z-index: 10; pointer-events: none;
        }
        #minimapCanvas { width: 100%; height: 100%; display: block; }

        /* Controls & Save Overlay */
        #top-right-bar { position: absolute; top: 20px; right: 20px; display: flex; gap: 10px; align-items: center; z-index: 10; }
        .ui-btn {
            background: rgba(13, 17, 23, 0.88); border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 8px 14px; border-radius: 99px; backdrop-filter: blur(12px);
            font-size: 11px; font-weight: 700; color: #f3f4f6; cursor: pointer; transition: all 0.2s;
        }
        .ui-btn.danger:hover { background: rgba(239, 68, 68, 0.25); border-color: #ef4444; }

        #save-status {
            font-size: 10px; font-weight: 700; color: #4ade80; text-transform: uppercase; letter-spacing: 1px;
            background: rgba(13, 17, 23, 0.85); padding: 6px 12px; border-radius: 99px; border: 1px solid rgba(74, 222, 128, 0.2);
        }
    </style>
</head>
<body>

<canvas id="gameCanvas"></canvas>
<div id="damage-flash"></div>

<div id="biome-toast"><span id="toast-icon">🌲</span><span id="toast-text">DISCOVERED: PLAINS</span></div>

<div id="top-right-bar">
    <div id="save-status">💾 Auto-Saved</div>
    <button class="ui-btn danger" onclick="resetSaveData()">Reset Save</button>
</div>

<div id="stats-hud">
    <div class="hud-header">
        <span>Vitals & Stats</span>
        <span id="time-val">00:00</span>
    </div>
    <div class="hp-bar-outer">
        <div id="hp-bar" class="hp-bar-inner"></div>
        <div id="hp-text" class="hp-text">100 / 100</div>
    </div>
    
    <div class="resource-grid">
        <div class="res-card">🪵 <span id="wood-val">0</span><small>Wood</small></div>
        <div class="res-card">🪨 <span id="stone-val">0</span><small>Stone</small></div>
        <div class="res-card">💎 <span id="ore-val">0</span><small>Ore</small></div>
    </div>

    <div class="weapon-card">
        <span>Equipped</span>
        <span id="weapon-val" class="rarity-Common">Wooden Stick</span>
    </div>

    <div class="stats-summary">
        <div>Kills: <span id="kills-val">0</span></div>
        <div>DPS: <span id="dps-val">18</span></div>
    </div>
</div>

<div id="crafting-panel">
    <div class="hud-header">Crafting Recipe Book</div>
    <button class="craft-btn" onclick="craftItem('spear')">
        <span>🗡️ Stone Spear</span><span class="craft-reqs">10W 10S</span>
    </button>
    <button class="craft-btn" onclick="craftItem('hammer')">
        <span>🔨 Ore Sledge</span><span class="craft-reqs">15W 20O</span>
    </button>
    <button class="craft-btn" onclick="craftItem('blade')">
        <span>⚡ Plasma Sword</span><span class="craft-reqs">25W 25S 15O</span>
    </button>
    <button class="craft-btn" onclick="craftItem('scythe')">
        <span>🔮 Void Scythe</span><span class="craft-reqs">40W 40S 30O</span>
    </button>
    <button class="craft-btn" onclick="craftItem('heal')">
        <span>🧪 Health Salve</span><span class="craft-reqs">5W 5S</span>
    </button>
</div>

<div id="minimap-container">
    <canvas id="minimapCanvas" width="150" height="150"></canvas>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const minimapCanvas = document.getElementById('minimapCanvas');
const minimapCtx = minimapCanvas.getContext('2d');

function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

const WORLD_SIZE = 3800;
const HALF_WORLD = WORLD_SIZE / 2;

// HELPER TO LOAD ENEMY IMAGE FROM DIRECTORY
function loadDirectoryImage(filePath) {
    if (!filePath) return null;
    const img = new Image();
    img.src = filePath;
    return img;
}

// MATCHING EXACT RELATIVE PATHS FOR GITHUB PAGES
const ENEMY_TYPES = {
    goblin: {
        name: "Jason Teo",
        trait: "Fast & Agile",
        hp: 120,
        speed: 2.5,
        radius: 18,
        damage: 0.2,
        color: "#22c55e",
        img: loadDirectoryImage('images/goblin.JPEG')
    },
    brute: {
        name: "Satthew",
        trait: "Heavy Tank",
        hp: 240,
        speed: 1.5,
        radius: 26,
        damage: 0.65,
        color: "#b91c1c",
        img: loadDirectoryImage('images/brute.JPEG')
    },
    phantom: {
        name: "Liu Gay",
        trait: "Teleporter",
        hp: 90,
        speed: 2.3,
        radius: 20,
        damage: 0.35,
        color: "#a855f7",
        img: loadDirectoryImage('images/phantom.JPEG')
    },
    goliath: {
        name: "Xuchen",
        trait: "Elite Boss",
        hp: 500,
        speed: 1.1,
        radius: 36,
        damage: 1.1,
        color: "#f97316",
        img: loadDirectoryImage('images/goliath.JPEG')
    }
};

const WEAPONS = {
    stick:  { id: 'stick', name: 'Wooden Stick', damage: 18, range: 60, rarity: 'Common', color: '#a3a3a3' },
    spear:  { id: 'spear', name: 'Stone Spear', damage: 36, range: 85, rarity: 'Uncommon', color: '#4ade80' },
    hammer: { id: 'hammer', name: 'Ore Sledge', damage: 68, range: 70, rarity: 'Rare', color: '#60a5fa' },
    blade:  { id: 'blade', name: 'Plasma Sword', damage: 110, range: 105, rarity: 'Legendary', color: '#fb923c' },
    scythe: { id: 'scythe', name: 'Void Scythe', damage: 175, range: 125, rarity: 'Mythic', color: '#c084fc' }
};

const BIOMES = {
    TOP_LEFT:     { name: 'VERDANT WILDWOOD', bg: '#1c3323', accent: '#14251a', icon: '🌲' },
    TOP_RIGHT:    { name: 'SUNSCORCH DUNES', bg: '#8c6d27', accent: '#69511c', icon: '🏜️' },
    BOTTOM_LEFT:  { name: 'FROSTBITE TUNDRA', bg: '#3a5a68', accent: '#2a424d', icon: '❄️' },
    BOTTOM_RIGHT: { name: 'ABYSSAL WASTES', bg: '#2f1238', accent: '#210c28', icon: '🔮' }
};

// PLAYER STATE
let player = {
    x: HALF_WORLD, y: HALF_WORLD,
    radius: 18, speed: 4.5, hp: 100, maxHp: 100,
    wood: 0, stone: 0, ore: 0, kills: 0,
    weaponKey: 'stick', weapon: WEAPONS.stick,
    currentBiome: '', facingAngle: 0, isAttacking: false, attackProgress: 0
};

let gameTime = 0;
setInterval(() => { gameTime++; updateTimeDisplay(); }, 1000);

function updateTimeDisplay() {
    const mins = Math.floor(gameTime / 60).toString().padStart(2, '0');
    const secs = (gameTime % 60).toString().padStart(2, '0');
    const timeElem = document.getElementById('time-val');
    if (timeElem) timeElem.innerText = `${mins}:${secs}`;
}

// LOAD GAME DATA
function loadGameData() {
    const saved = localStorage.getItem('SURVIVAL_REALM_SAVE');
    if (saved) {
        try {
            const data = JSON.parse(saved);
            player.wood = data.wood || 0;
            player.stone = data.stone || 0;
            player.ore = data.ore || 0;
            player.hp = data.hp || 100;
            player.kills = data.kills || 0;
            player.x = data.x || HALF_WORLD;
            player.y = data.y || HALF_WORLD;
            if (data.weaponKey && WEAPONS[data.weaponKey]) {
                player.weaponKey = data.weaponKey; 
                player.weapon = WEAPONS[data.weaponKey];
            }
        } catch(e) { console.error("Error loading save data:", e); }
    }
}

function saveGameData() {
    const data = {
        wood: player.wood, stone: player.stone, ore: player.ore,
        hp: player.hp, kills: player.kills, x: player.x, y: player.y,
        weaponKey: player.weaponKey
    };
    localStorage.setItem('SURVIVAL_REALM_SAVE', JSON.stringify(data));
    
    const saveElem = document.getElementById('save-status');
    if (saveElem) {
        saveElem.innerText = '💾 Saved!';
        setTimeout(() => { saveElem.innerText = '💾 Auto-Saved'; }, 1000);
    }
}

function resetSaveData() {
    if (confirm("Reset player inventory, weapon, and position?")) {
        localStorage.removeItem('SURVIVAL_REALM_SAVE');
        location.reload();
    }
}

loadGameData();
setInterval(saveGameData, 5000);

// INPUTS
const keys = {};
let mouseX = canvas.width / 2, mouseY = canvas.height / 2;
window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
window.addEventListener('mousemove', e => { mouseX = e.clientX; mouseY = e.clientY; });

// ENTITIES
let resources = [];
let enemies = [];
let particles = [];
let floatingTexts = [];

// SPAWN INITIAL RESOURCES
for (let i = 0; i < 240; i++) {
    const types = ['tree', 'stone', 'ore'];
    const type = types[Math.floor(Math.random() * types.length)];
    resources.push({
        x: Math.random() * (WORLD_SIZE - 200) + 100,
        y: Math.random() * (WORLD_SIZE - 200) + 100,
        type: type, hp: type === 'ore' ? 4 : type === 'stone' ? 3 : 2,
        maxHp: type === 'ore' ? 4 : type === 'stone' ? 3 : 2
    });
}

// SPAWN DIFFERENT ENEMY TYPES
const typeKeys = Object.keys(ENEMY_TYPES);
for (let i = 0; i < 50; i++) {
    let ex = Math.random() * WORLD_SIZE;
    let ey = Math.random() * WORLD_SIZE;
    if (Math.hypot(ex - player.x, ey - player.y) > 450) {
        const randTypeKey = typeKeys[Math.floor(Math.random() * typeKeys.length)];
        const baseStats = ENEMY_TYPES[randTypeKey];
        enemies.push({
            typeKey: randTypeKey,
            x: ex, y: ey,
            hp: baseStats.hp, maxHp: baseStats.hp,
            radius: baseStats.radius, speed: baseStats.speed,
            damage: baseStats.damage, trait: baseStats.trait,
            teleportTimer: 0, hitFlash: 0
        });
    }
}

// ATTACK & MINING
canvas.addEventListener('pointerdown', () => {
    if (player.hp <= 0) return;

    player.isAttacking = true;
    player.attackProgress = 0;

    const swingX = player.x + Math.cos(player.facingAngle) * player.weapon.range * 0.6;
    const swingY = player.y + Math.sin(player.facingAngle) * player.weapon.range * 0.6;
    createParticles(swingX, swingY, player.weapon.color, 10);

    // Harvest Resources
    resources.forEach((res, index) => {
        if (Math.hypot(res.x - player.x, res.y - player.y) <= player.weapon.range + 20) {
            res.hp -= 1;
            const pColor = res.type === 'tree' ? '#4ade80' : res.type === 'stone' ? '#9ca3af' : '#38bdf8';
            createParticles(res.x, res.y, pColor, 6);
            spawnFloatingText(res.x, res.y, "-1", "#fbbf24");

            if (res.hp <= 0) {
                if (res.type === 'tree') player.wood += Math.floor(Math.random() * 3) + 3;
                if (res.type === 'stone') player.stone += Math.floor(Math.random() * 3) + 2;
                if (res.type === 'ore') player.ore += Math.floor(Math.random() * 2) + 1;
                resources.splice(index, 1);
                updateHUD();
                saveGameData();
            }
        }
    });

    // Hit Enemies
    enemies.forEach((enemy, index) => {
        if (Math.hypot(enemy.x - player.x, enemy.y - player.y) <= player.weapon.range + enemy.radius) {
            let isCrit = Math.random() < 0.25;
            let dmg = isCrit ? Math.floor(player.weapon.damage * 1.5) : player.weapon.damage;
            
            enemy.hp -= dmg;
            enemy.hitFlash = 10; // Trigger visual hit flash
            const angle = Math.atan2(enemy.y - player.y, enemy.x - player.x);
            enemy.x += Math.cos(angle) * 35;
            enemy.y += Math.sin(angle) * 35;

            createParticles(enemy.x, enemy.y, '#f87171', 12);
            spawnFloatingText(enemy.x, enemy.y, isCrit ? `💥 CRIT -${dmg}` : `-${dmg}`, isCrit ? "#facc15" : "#f87171");

            if (enemy.hp <= 0) {
                createParticles(enemy.x, enemy.y, '#ef4444', 20);
                enemies.splice(index, 1);
                player.kills += 1;
                updateHUD();
            }
        }
    });
});

function createParticles(x, y, color, count) {
    for (let i = 0; i < count; i++) {
        particles.push({
            x: x, y: y,
            vx: (Math.random() - 0.5) * 8, vy: (Math.random() - 0.5) * 8,
            color: color, radius: Math.random() * 3 + 2, alpha: 1
        });
    }
}

function spawnFloatingText(x, y, text, color) {
    floatingTexts.push({ x: x, y: y, text: text, color: color, alpha: 1 });
}

function triggerDamageFlash() {
    const flashElem = document.getElementById('damage-flash');
    if (flashElem) {
        flashElem.style.opacity = '1';
        setTimeout(() => { flashElem.style.opacity = '0'; }, 150);
    }
}

function update() {
    if (player.hp <= 0) return;

    let dx = 0, dy = 0;
    if (keys['w']) dy -= 1;
    if (keys['s']) dy += 1;
    if (keys['a']) dx -= 1;
    if (keys['d']) dx += 1;

    if (dx !== 0 && dy !== 0) { dx *= 0.7071; dy *= 0.7071; }

    player.x = Math.max(player.radius, Math.min(WORLD_SIZE - player.radius, player.x + dx * player.speed));
    player.y = Math.max(player.radius, Math.min(WORLD_SIZE - player.radius, player.y + dy * player.speed));

    const cameraX = player.x - canvas.width / 2;
    const cameraY = player.y - canvas.height / 2;
    player.facingAngle = Math.atan2((mouseY + cameraY) - player.y, (mouseX + cameraX) - player.x);

    if (player.isAttacking) {
        player.attackProgress += 0.18;
        if (player.attackProgress >= 1) { player.isAttacking = false; player.attackProgress = 0; }
    }

    // Biome Check
    let biome = BIOMES.TOP_LEFT;
    if (player.x >= HALF_WORLD && player.y < HALF_WORLD) biome = BIOMES.TOP_RIGHT;
    else if (player.x < HALF_WORLD && player.y >= HALF_WORLD) biome = BIOMES.BOTTOM_LEFT;
    else if (player.x >= HALF_WORLD && player.y >= HALF_WORLD) biome = BIOMES.BOTTOM_RIGHT;

    if (player.currentBiome !== biome.name) {
        player.currentBiome = biome.name;
        showToast(biome.icon, "ENTERED: " + biome.name);
    }

    particles.forEach((p, i) => {
        p.x += p.vx; p.y += p.vy; p.alpha -= 0.04;
        if (p.alpha <= 0) particles.splice(i, 1);
    });

    // Enemy AI & Traits
    enemies.forEach(enemy => {
        if (enemy.hitFlash > 0) enemy.hitFlash--;

        const dist = Math.hypot(player.x - enemy.x, player.y - enemy.y);
        
        if (enemy.typeKey === 'phantom' && dist < 350) {
            enemy.teleportTimer += 1;
            if (enemy.teleportTimer > 180) {
                enemy.x = player.x + (Math.random() - 0.5) * 160;
                enemy.y = player.y + (Math.random() - 0.5) * 160;
                createParticles(enemy.x, enemy.y, '#a855f7', 14);
                enemy.teleportTimer = 0;
            }
        }

        if (dist < 480) {
            const angle = Math.atan2(player.y - enemy.y, player.x - enemy.x);
            enemy.x += Math.cos(angle) * enemy.speed;
            enemy.y += Math.sin(angle) * enemy.speed;
        }

        if (dist < player.radius + enemy.radius) {
            player.hp -= enemy.damage;
            triggerDamageFlash();
            updateHUD();
            if (player.hp <= 0) showToast("☠️", "YOU PERISHED!");
        }
    });
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const cameraX = player.x - canvas.width / 2;
    const cameraY = player.y - canvas.height / 2;

    // Biomes
    drawBiomeSquare(0, 0, HALF_WORLD, HALF_WORLD, BIOMES.TOP_LEFT, cameraX, cameraY);
    drawBiomeSquare(HALF_WORLD, 0, HALF_WORLD, HALF_WORLD, BIOMES.TOP_RIGHT, cameraX, cameraY);
    drawBiomeSquare(0, HALF_WORLD, HALF_WORLD, HALF_WORLD, BIOMES.BOTTOM_LEFT, cameraX, cameraY);
    drawBiomeSquare(HALF_WORLD, HALF_WORLD, HALF_WORLD, HALF_WORLD, BIOMES.BOTTOM_RIGHT, cameraX, cameraY);

    // Resources
    resources.forEach(res => {
        const rx = res.x - cameraX; const ry = res.y - cameraY;
        if (res.type === 'tree') {
            ctx.fillStyle = "#523a28"; ctx.fillRect(rx - 4, ry - 4, 8, 14);
            ctx.fillStyle = "#15803d"; ctx.beginPath(); ctx.arc(rx, ry - 12, 16, 0, Math.PI * 2); ctx.fill();
        } else if (res.type === 'stone') {
            ctx.fillStyle = "#6b7280"; ctx.beginPath(); ctx.arc(rx, ry, 12, 0, Math.PI * 2); ctx.fill();
        } else if (res.type === 'ore') {
            ctx.fillStyle = "#374151"; ctx.beginPath(); ctx.arc(rx, ry, 12, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = "#38bdf8"; ctx.beginPath(); ctx.arc(rx - 2, ry - 2, 6, 0, Math.PI * 2); ctx.fill();
        }
    });

    // Draw Enemies with UI Overhead Plates
    enemies.forEach(e => {
        const ex = e.x - cameraX, ey = e.y - cameraY;
        const config = ENEMY_TYPES[e.typeKey];

        // Draw Base Circle/Image
        if (config && config.img && config.img.complete && config.img.naturalWidth > 0) {
            ctx.save();
            ctx.beginPath();
            ctx.arc(ex, ey, e.radius, 0, Math.PI * 2);
            ctx.clip();
            ctx.drawImage(config.img, ex - e.radius, ey - e.radius, e.radius * 2, e.radius * 2);
            
            // Hit Flash tint
            if (e.hitFlash > 0) {
                ctx.fillStyle = "rgba(255, 255, 255, 0.65)";
                ctx.fill();
            }
            ctx.restore();

            ctx.strokeStyle = e.hitFlash > 0 ? "#ffffff" : config.color;
            ctx.lineWidth = e.hitFlash > 0 ? 3 : 2;
            ctx.beginPath(); ctx.arc(ex, ey, e.radius, 0, Math.PI * 2); ctx.stroke();
        } else {
            ctx.fillStyle = e.hitFlash > 0 ? "#ffffff" : (config ? config.color : "#dc2626");
            ctx.beginPath(); ctx.arc(ex, ey, e.radius, 0, Math.PI * 2); ctx.fill();
        }

        // --- ENEMY OVERHEAD UI PANEL ---
        const uiY = ey - e.radius - 18;

        // Enemy Name
        ctx.font = "800 11px 'Plus Jakarta Sans', sans-serif";
        ctx.textAlign = "center";
        ctx.fillStyle = "#ffffff";
        ctx.fillText(config.name, ex, uiY - 14);

        // Enemy Trait Badge
        ctx.font = "700 9px 'Plus Jakarta Sans', sans-serif";
        ctx.fillStyle = config.color;
        ctx.fillText(`• ${e.trait} •`, ex, uiY - 4);

        // Enemy Health Bar Outer
        const barW = 44;
        const barH = 5;
        ctx.fillStyle = "rgba(0, 0, 0, 0.6)";
        ctx.fillRect(ex - barW / 2, uiY, barW, barH);

        // Enemy Health Bar Inner
        const hpPct = Math.max(0, e.hp / e.maxHp);
        ctx.fillStyle = e.hitFlash > 0 ? "#ffffff" : (hpPct > 0.5 ? "#22c55e" : hpPct > 0.25 ? "#eab308" : "#ef4444");
        ctx.fillRect(ex - barW / 2, uiY, barW * hpPct, barH);
    });

    // Player Rendering
    const px = canvas.width / 2, py = canvas.height / 2;
    ctx.fillStyle = "#2563eb"; ctx.beginPath(); ctx.arc(px, py, player.radius, 0, Math.PI * 2); ctx.fill();

    // Weapon Swing Arc
    ctx.save(); ctx.translate(px, py);
    let swingAngle = player.facingAngle;
    if (player.isAttacking) swingAngle += Math.sin(player.attackProgress * Math.PI) * 1.5 - 0.75;
    ctx.rotate(swingAngle);
    ctx.fillStyle = player.weapon.color; ctx.fillRect(10, -3, player.weapon.range * 0.55, 6);
    ctx.restore();

    // Particles & Text
    particles.forEach(p => {
        ctx.fillStyle = p.color; ctx.globalAlpha = p.alpha;
        ctx.beginPath(); ctx.arc(p.x - cameraX, p.y - cameraY, p.radius, 0, Math.PI * 2); ctx.fill(); ctx.globalAlpha = 1.0;
    });

    floatingTexts.forEach((ft, i) => {
        ctx.fillStyle = ft.color; ctx.globalAlpha = ft.alpha;
        ctx.font = "800 14px 'Plus Jakarta Sans', sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(ft.text, ft.x - cameraX, ft.y - cameraY);
        ctx.globalAlpha = 1.0; ft.y -= 0.8; ft.alpha -= 0.035;
        if (ft.alpha <= 0) floatingTexts.splice(i, 1);
    });

    drawMinimap();
}

function drawBiomeSquare(x, y, w, h, biome, camX, camY) {
    ctx.fillStyle = biome.bg; ctx.fillRect(x - camX, y - camY, w, h);
}

function drawMinimap() {
    const scale = 150 / WORLD_SIZE;
    minimapCtx.clearRect(0, 0, 150, 150);

    // Biomes background
    minimapCtx.fillStyle = BIOMES.TOP_LEFT.bg; minimapCtx.fillRect(0, 0, 75, 75);
    minimapCtx.fillStyle = BIOMES.TOP_RIGHT.bg; minimapCtx.fillRect(75, 0, 75, 75);
    minimapCtx.fillStyle = BIOMES.BOTTOM_LEFT.bg; minimapCtx.fillRect(0, 75, 75, 75);
    minimapCtx.fillStyle = BIOMES.BOTTOM_RIGHT.bg; minimapCtx.fillRect(75, 75, 75, 75);

    // Draw enemies on minimap
    enemies.forEach(e => {
        minimapCtx.fillStyle = "#ef4444";
        minimapCtx.beginPath();
        minimapCtx.arc(e.x * scale, e.y * scale, 2, 0, Math.PI * 2);
        minimapCtx.fill();
    });

    // Draw player position on minimap
    minimapCtx.fillStyle = "#38bdf8";
    minimapCtx.beginPath();
    minimapCtx.arc(player.x * scale, player.y * scale, 3, 0, Math.PI * 2);
    minimapCtx.fill();
}

function loop() { update(); draw(); requestAnimationFrame(loop); }

function updateHUD() {
    const hpPct = Math.max(0, (player.hp / player.maxHp) * 100);
    document.getElementById('hp-bar').style.width = `${hpPct}%`;
    document.getElementById('hp-text').innerText = `${Math.ceil(player.hp)} / ${player.maxHp} HP`;
    document.getElementById('wood-val').innerText = player.wood;
    document.getElementById('stone-val').innerText = player.stone;
    document.getElementById('ore-val').innerText = player.ore;
    document.getElementById('kills-val').innerText = player.kills;
    document.getElementById('dps-val').innerText = player.weapon.damage;
    
    let wElem = document.getElementById('weapon-val');
    wElem.innerText = player.weapon.name;
    wElem.className = `rarity-${player.weapon.rarity}`;
}

function showToast(icon, msg) {
    const toast = document.getElementById('biome-toast');
    document.getElementById('toast-icon').innerText = icon;
    document.getElementById('toast-text').innerText = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2200);
}

function craftItem(type) {
    if (type === 'spear' && player.wood >= 10 && player.stone >= 10) {
        player.wood -= 10; player.stone -= 10; player.weaponKey = 'spear'; player.weapon = WEAPONS.spear;
        showToast("🗡️", "CRAFTED: Stone Spear!");
    } else if (type === 'hammer' && player.wood >= 15 && player.ore >= 20) {
        player.wood -= 15; player.ore -= 20; player.weaponKey = 'hammer'; player.weapon = WEAPONS.hammer;
        showToast("🔨", "CRAFTED: Ore Sledge!");
    } else if (type === 'blade' && player.wood >= 25 && player.stone >= 25 && player.ore >= 15) {
        player.wood -= 25; player.stone -= 25; player.ore -= 15; player.weaponKey = 'blade'; player.weapon = WEAPONS.blade;
        showToast("⚡", "CRAFTED: Plasma Sword!");
    } else if (type === 'scythe' && player.wood >= 40 && player.stone >= 40 && player.ore >= 30) {
        player.wood -= 40; player.stone -= 40; player.ore -= 30; player.weaponKey = 'scythe'; player.weapon = WEAPONS.scythe;
        showToast("🔮", "CRAFTED: Void Scythe!");
    } else if (type === 'heal' && player.wood >= 5 && player.stone >= 5) {
        player.wood -= 5; player.stone -= 5; player.hp = Math.min(100, player.hp + 45);
        showToast("🧪", "RECOVERED +45 HP!");
    } else {
        showToast("⚠️", "NOT ENOUGH MATERIALS!");
    }
    updateHUD();
    saveGameData();
}

updateHUD();
loop();
</script>
