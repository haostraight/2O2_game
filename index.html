<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Survival Realm: Multi-Dimensional Quest</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        :root {
            --font-sans: 'Plus Jakarta Sans', sans-serif;
            --font-display: 'Space Grotesk', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: #030712;
            color: #f9fafb;
            font-family: var(--font-sans);
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        #gameCanvas {
            display: block;
            width: 100vw;
            height: 100vh;
            background: #030712;
            cursor: crosshair;
        }

        .glass-panel {
            background: rgba(15, 23, 42, 0.90);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        .glass-panel-glow {
            box-shadow: 0 0 30px rgba(99, 102, 241, 0.2), 0 20px 50px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.2);
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.5); border-radius: 99px; }
        ::-webkit-scrollbar-thumb { background: rgba(99, 102, 241, 0.5); border-radius: 99px; }

        .hotbar-slot {
            width: 58px;
            height: 54px;
            position: relative;
            background: rgba(15, 23, 42, 0.85);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.12s ease-in-out;
            padding: 2px;
        }

        .hotbar-slot:hover {
            border-color: rgba(255, 255, 255, 0.6);
            background: rgba(30, 41, 59, 0.9);
        }

        .hotbar-slot.equipped {
            border-color: #38bdf8;
            box-shadow: 0 0 18px rgba(56, 189, 248, 0.8);
            background: rgba(14, 116, 144, 0.6);
            transform: translateY(-2px);
        }

        .hotbar-key-num {
            position: absolute;
            top: 2px;
            left: 4px;
            font-size: 9px;
            font-weight: 900;
            color: rgba(255, 255, 255, 0.7);
            font-family: var(--font-display);
        }

        .item-count {
            position: absolute;
            top: 2px;
            right: 4px;
            font-size: 9px;
            font-weight: 800;
            color: #38bdf8;
            background: rgba(0, 0, 0, 0.8);
            padding: 0 3px;
            border-radius: 4px;
        }

        .slot-title {
            font-size: 8px;
            font-weight: 700;
            color: #e2e8f0;
            text-align: center;
            line-height: 1;
            margin-top: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 52px;
        }
    </style>
</head>

<script>
const WORLD_SIZE = 8000;
const HALF_WORLD = WORLD_SIZE / 2;

// CANVAS SETUP
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false });

function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

// PRELOAD ENEMY IMAGES
const mobImageFiles = [
    { name: 'Gerard', src: 'images/gerard.jpeg' },
    { name: 'Jason', src: 'images/jason.jpeg' },
    { name: 'Liu-Ji', src: 'images/liu-ji.jpeg' },
    { name: 'Matthew', src: 'images/matthew.jpeg' },
    { name: 'Travia', src: 'images/travia.jpeg' },
    { name: 'Xayven', src: 'images/xayven.jpeg' },
    { name: 'Xuchen', src: 'images/xuchen.jpeg' }
];

const loadedMobImages = {};
mobImageFiles.forEach(item => {
    const img = new Image();
    img.src = item.src;
    img.onload = () => { loadedMobImages[item.name] = { img, loaded: true }; };
    img.onerror = () => { loadedMobImages[item.name] = { img: null, loaded: false }; };
});

// WEAPON & ARMOR DATA
const BASE_WEAPONS = {
    stick:  { id: 'stick', name: 'Wooden Stick', damage: 15, range: 65, color: '#a3e635', knockback: 10 },
    spear:  { id: 'spear', name: 'Stone Spear', damage: 30, range: 90, color: '#cbd5e1', knockback: 15 },
    hammer: { id: 'hammer', name: 'Ore Sledge', damage: 60, range: 75, color: '#38bdf8', knockback: 25 },
    blade:  { id: 'blade', name: 'Plasma Sword', damage: 95, range: 110, color: '#facc15', knockback: 18 },
    scythe: { id: 'scythe', name: 'Void Scythe', damage: 150, range: 130, color: '#c084fc', knockback: 22 },
    bow:    { id: 'bow', name: 'Frostbite Bow', damage: 75, range: 140, color: '#60a5fa', knockback: 15 }
};

const ARMORS = {
    padded: { id: 'padded', name: 'Reinforced Plating', icon: '🛡️', hpBonus: 30, desc: '+30 Max HP Protection' },
    shadow: { id: 'shadow', name: 'Shadow Cloak', icon: '🧥', hpBonus: 75, desc: '+75 Max HP Dark Shield' },
    aegis:  { id: 'aegis', name: 'Aegis Plate', icon: '🦾', hpBonus: 130, desc: '+130 Max HP Aegis Barrier' }
};

// HARDCODED CRAFTING COSTS & VALUES
const BASE_CRAFTABLES = [
    { id: 'padded', name: 'Reinforced Plating', type: 'armor', armorKey: 'padded', icon: '🛡️', stats: '+30 Max HP', cost: { wood: 60, stone: 80, ore: 20 } },
    { id: 'shadow', name: 'Shadow Cloak', type: 'armor', armorKey: 'shadow', icon: '🧥', stats: '+75 Max HP', cost: { wood: 100, stone: 100, ore: 80 } },
    { id: 'aegis', name: 'Aegis Plate', type: 'armor', armorKey: 'aegis', icon: '🦾', stats: '+130 Max HP', cost: { wood: 160, stone: 160, ore: 140 } },
    { id: 'spear', name: 'Stone Spear', type: 'weapon', weaponKey: 'spear', icon: '🗡️', stats: '+30 Damage', cost: { wood: 40, stone: 40, ore: 0 } },
    { id: 'hammer', name: 'Ore Sledge', type: 'weapon', weaponKey: 'hammer', icon: '🔨', stats: '+60 Damage', cost: { wood: 60, stone: 0, ore: 80 } },
    { id: 'bow', name: 'Frostbite Bow', type: 'weapon', weaponKey: 'bow', icon: '🏹', stats: '+75 Damage', cost: { wood: 120, stone: 60, ore: 40 } },
    { id: 'blade', name: 'Plasma Sword', type: 'weapon', weaponKey: 'blade', icon: '⚡', stats: '+95 Damage', cost: { wood: 100, stone: 100, ore: 60 } },
    { id: 'scythe', name: 'Void Scythe', type: 'weapon', weaponKey: 'scythe', icon: '🔮', stats: '+150 Damage', cost: { wood: 160, stone: 160, ore: 120 } },
    { id: 'heal', name: 'Health Salve', type: 'consumable', icon: '🧪', stats: '+45 Vitality', cost: { wood: 20, stone: 20, ore: 0 } },
    { id: 'elixir', name: 'Full Elixir', type: 'consumable', icon: '🍷', stats: 'Full Healing', cost: { wood: 60, stone: 60, ore: 40 } }
];

// HARDCODED SHARD REQUIREMENTS
let DIMENSION_SHARDS = {
    overworld: { name: 'Verdant Shard', label: '🌿 Verdant Shards', req: 10, unlock: 'nether' },
    nether:    { name: 'Crimson Shard', label: '🔥 Crimson Shards', req: 10, unlock: 'void' },
    void:      { name: 'Astral Shard',  label: '✨ Astral Shards', req: 10, unlock: null }
};

// =============================================================================
// PARTICLE SYSTEM CLASSES
// =============================================================================

class Particle {
    constructor(x, y, vx, vy, color, radius, maxLife) {
        this.x = x;
        this.y = y;
        this.vx = vx;
        this.vy = vy;
        this.color = color;
        this.radius = radius;
        this.life = maxLife;
        this.maxLife = maxLife;
        this.markedForDeletion = false;
    }

    update() {
        this.x += this.vx;
        this.y += this.vy;
        this.vx *= 0.95;
        this.vy *= 0.95;
        this.life--;
        if (this.life <= 0) this.markedForDeletion = true;
    }

    render(ctx) {
        ctx.save();
        ctx.globalAlpha = Math.max(0, this.life / this.maxLife);
        ctx.beginPath();
        ctx.arc(this.x, this.y, Math.max(0.1, this.radius * (this.life / this.maxLife)), 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.fill();
        ctx.restore();
    }
}

class VisualEffectSystem {
    constructor() {
        this.particles = [];
        this.swingTrails = [];
    }

    createExplosion(x, y, color = '#f97316', count = 35) {
        for (let i = 0; i < count; i++) {
            const angle = Math.random() * Math.PI * 2;
            const speed = Math.random() * 8 + 2;
            const vx = Math.cos(angle) * speed;
            const vy = Math.sin(angle) * speed;
            const radius = Math.random() * 6 + 3;
            const life = Math.floor(Math.random() * 25) + 20;
            const palette = [color, '#ef4444', '#facc15', '#ffffff'];
            const chosenColor = palette[Math.floor(Math.random() * palette.length)];
            this.particles.push(new Particle(x, y, vx, vy, chosenColor, radius, life));
        }
    }

    createTrail(x, y, color = '#f43f5e', count = 2) {
        for (let i = 0; i < count; i++) {
            const vx = (Math.random() - 0.5) * 1.5;
            const vy = (Math.random() - 0.5) * 1.5;
            const radius = Math.random() * 3 + 1.5;
            const life = Math.floor(Math.random() * 12) + 8;
            this.particles.push(new Particle(x, y, vx, vy, color, radius, life));
        }
    }

    addSwingTrail(x, y, angle, range, color) {
        this.swingTrails.push({
            x, y, angle, range, color,
            alpha: 1.0,
            life: 10
        });

        for (let i = 0; i < 5; i++) {
            const particleAngle = angle + (Math.random() - 0.5) * 0.8;
            const dist = Math.random() * range;
            const px = x + Math.cos(particleAngle) * dist;
            const py = y + Math.sin(particleAngle) * dist;
            const vx = Math.cos(particleAngle) * 3;
            const vy = Math.sin(particleAngle) * 3;
            this.particles.push(new Particle(px, py, vx, vy, color, Math.random() * 2 + 1, 12));
        }
    }

    update() {
        for (let i = this.particles.length - 1; i >= 0; i--) {
            this.particles[i].update();
            if (this.particles[i].markedForDeletion) {
                this.particles.splice(i, 1);
            }
        }

        for (let i = this.swingTrails.length - 1; i >= 0; i--) {
            this.swingTrails[i].life--;
            this.swingTrails[i].alpha = this.swingTrails[i].life / 10;
            if (this.swingTrails[i].life <= 0) {
                this.swingTrails.splice(i, 1);
            }
        }
    }

    render(ctx) {
        for (let trail of this.swingTrails) {
            ctx.save();
            ctx.globalAlpha = trail.alpha;
            ctx.beginPath();
            ctx.arc(trail.x, trail.y, trail.range, trail.angle - 0.4, trail.angle + 0.4);
            ctx.strokeStyle = trail.color;
            ctx.lineWidth = 6;
            ctx.stroke();
            ctx.restore();
        }

        for (let particle of this.particles) {
            particle.render(ctx);
        }
    }
}

const vfx = new VisualEffectSystem();

// =============================================================================
// OBJECT-ORIENTED CLASSES
// =============================================================================

class Entity {
    constructor(x, y, radius) {
        this.x = x;
        this.y = y;
        this.radius = radius;
        this.markedForDeletion = false;
    }
}

class Projectile extends Entity {
    constructor(x, y, targetX, targetY, speed, damage, color = '#ef4444') {
        super(x, y, 6);
        const angle = Math.atan2(targetY - y, targetX - x);
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        this.damage = damage;
        this.color = color;
        this.life = 180;
    }

    update() {
        this.x += this.vx;
        this.y += this.vy;
        this.life--;
        vfx.createTrail(this.x, this.y, this.color, 1);
        if (this.life <= 0) this.markedForDeletion = true;
    }

    render(ctx) {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.fill();
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 1.5;
        ctx.stroke();
    }
}

class Mob extends Entity {
    constructor(x, y, config) {
        super(x, y, config.hitboxRadius);
        this.name = config.name;
        this.imageName = config.imageName;
        this.color = config.color;
        this.borderColor = config.borderColor;
        this.maxHp = config.hp; // DIRECT HARDCODED VALUE
        this.hp = this.maxHp;
        this.damage = config.damage; // DIRECT HARDCODED VALUE
        this.speed = config.speed;
        this.visualRadius = config.visualRadius;
        this.shardDropChance = config.shardDropChance;
        this.vx = 0;
        this.vy = 0;
    }

    update(player, projectiles) {
        this.x += this.vx;
        this.y += this.vy;
        this.vx *= 0.82;
        this.vy *= 0.82;

        const dx = player.x - this.x;
        const dy = player.y - this.y;
        const angle = Math.atan2(dy, dx);
        
        this.x += Math.cos(angle) * this.speed;
        this.y += Math.sin(angle) * this.speed;

        const distSq = dx * dx + dy * dy;
        if (distSq < (player.radius + this.radius) ** 2) {
            player.takeDamage(this.damage / 60);
        }
    }

    onDeath(dimension, player) {
        player.wood += Math.floor(Math.random() * 4) + 2;
        player.stone += Math.floor(Math.random() * 3) + 1;
        
        vfx.createExplosion(this.x, this.y, this.color, 15);

        if (Math.random() < this.shardDropChance) {
            player.shards[dimension] += 1;
            showToast("✨ Shard Dropped", `Acquired +1 ${DIMENSION_SHARDS[dimension].name}!`);
        }
    }

    render(ctx) {
        const imgData = loadedMobImages[this.imageName];
        if (imgData && imgData.loaded) {
            ctx.save();
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.visualRadius, 0, Math.PI * 2);
            ctx.clip();
            ctx.drawImage(imgData.img, this.x - this.visualRadius, this.y - this.visualRadius, this.visualRadius * 2, this.visualRadius * 2);
            ctx.restore();

            ctx.beginPath();
            ctx.arc(this.x, this.y, this.visualRadius, 0, Math.PI * 2);
            ctx.strokeStyle = this.borderColor;
            ctx.lineWidth = 3;
            ctx.stroke();
        } else {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.visualRadius, 0, Math.PI * 2);
            ctx.fillStyle = this.color;
            ctx.fill();
        }

        ctx.font = 'bold 11px sans-serif';
        ctx.fillStyle = '#fca5a5';
        ctx.textAlign = 'center';
        ctx.shadowColor = 'black';
        ctx.shadowBlur = 4;
        ctx.fillText(this.name, this.x, this.y - this.visualRadius - 10);
        ctx.shadowBlur = 0;

        if (this.hp < this.maxHp) {
            ctx.fillStyle = 'rgba(0,0,0,0.6)';
            ctx.fillRect(this.x - 20, this.y - this.visualRadius - 22, 40, 4);
            ctx.fillStyle = '#ef4444';
            ctx.fillRect(this.x - 20, this.y - this.visualRadius - 22, (this.hp / this.maxHp) * 40, 4);
        }
    }
}

class RangedMob extends Mob {
    constructor(x, y, config) {
        super(x, y, config);
        this.shootCooldown = 0;
        this.shootInterval = config.shootInterval || 120;
        this.preferredDist = 250;
    }

    update(player, projectiles) {
        this.x += this.vx;
        this.y += this.vy;
        this.vx *= 0.82;
        this.vy *= 0.82;

        const dx = player.x - this.x;
        const dy = player.y - this.y;
        const dist = Math.hypot(dx, dy);
        const angle = Math.atan2(dy, dx);

        if (dist > this.preferredDist + 40) {
            this.x += Math.cos(angle) * this.speed;
            this.y += Math.sin(angle) * this.speed;
        } else if (dist < this.preferredDist - 40) {
            this.x -= Math.cos(angle) * this.speed;
            this.y -= Math.sin(angle) * this.speed;
        }

        this.shootCooldown++;
        if (this.shootCooldown >= this.shootInterval && dist < 500) {
            this.shootCooldown = 0;
            projectiles.push(new Projectile(this.x, this.y, player.x, player.y, 6, Math.round(this.damage * 0.8), '#f43f5e'));
            vfx.createTrail(this.x, this.y, '#f43f5e', 8);
        }
    }
}

class ExplodingMob extends Mob {
    constructor(x, y, config) {
        super(x, y, config);
        this.explosionRadius = config.explosionRadius || 120;
        this.explosionDamage = config.explosionDamage || 60;
    }

    onDeath(dimension, player) {
        super.onDeath(dimension, player);
        vfx.createExplosion(this.x, this.y, '#f97316', 50);

        const dist = Math.hypot(player.x - this.x, player.y - this.y);
        if (dist <= this.explosionRadius) {
            player.takeDamage(this.explosionDamage);
            showToast("💥 BOOM!", `${this.name} exploded! Took ${this.explosionDamage} damage!`);
        }
    }

    render(ctx) {
        super.render(ctx);
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.visualRadius + 4, 0, Math.PI * 2);
        ctx.strokeStyle = '#f97316';
        ctx.lineWidth = 2;
        ctx.setLineDash([4, 4]);
        ctx.stroke();
        ctx.setLineDash([]);
    }
}

class Resource extends Entity {
    constructor(id, x, y, type) {
        super(x, y, 22);
        this.id = id;
        this.type = type;
        const hpMap = { tree: 30, rock: 50, ore: 80, shard: 35 };
        this.maxHp = hpMap[type] || 30;
        this.hp = this.maxHp;
    }

    harvest(player, currentDim) {
        if (this.type === 'tree') player.wood += 6;
        else if (this.type === 'rock') player.stone += 6;
        else if (this.type === 'ore') player.ore += 4;
        else if (this.type === 'shard') {
            player.shards[currentDim] += 2;
            showToast("✨ Shard Harvested", `Harvested +2 ${DIMENSION_SHARDS[currentDim].name}s!`);
        }
        vfx.createExplosion(this.x, this.y, '#38bdf8', 12);
    }

    render(ctx) {
        const RESOURCE_TYPES = {
            tree:  { name: 'Ancient Tree', emoji: '🌳', color: '#15803d', borderColor: '#22c55e' },
            rock:  { name: 'Granite Rock', emoji: '🪨', color: '#475569', borderColor: '#94a3b8' },
            ore:   { name: 'Crystal Ore',  emoji: '💎', color: '#0284c7', borderColor: '#38bdf8' },
            shard: { name: 'Shard Cluster', emoji: '🔮', color: '#7e22ce', borderColor: '#c084fc' }
        };

        const resDef = RESOURCE_TYPES[this.type];
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = resDef.color;
        ctx.fill();
        ctx.strokeStyle = resDef.borderColor;
        ctx.lineWidth = 3;
        ctx.stroke();

        ctx.font = '16px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(resDef.emoji, this.x, this.y);

        ctx.font = 'bold 11px sans-serif';
        ctx.fillStyle = '#ffffff';
        ctx.shadowColor = 'black';
        ctx.shadowBlur = 4;
        ctx.fillText(resDef.name, this.x, this.y - this.radius - 8);
        ctx.shadowBlur = 0;

        if (this.hp < this.maxHp) {
            ctx.fillStyle = 'rgba(0,0,0,0.6)';
            ctx.fillRect(this.x - 20, this.y - this.radius - 20, 40, 4);
            ctx.fillStyle = '#22c55e';
            ctx.fillRect(this.x - 20, this.y - this.radius - 20, (this.hp / this.maxHp) * 40, 4);
        }
    }
}

        ];

        ctx.strokeStyle = '#818cf8';
        ctx.lineWidth = 3;

        ctx.font = 'bold 12px sans-serif';
        ctx.fillStyle = '#6366f1';
        ctx.textAlign = 'center';
        ctx.shadowColor = 'black';
        ctx.shadowBlur = 4;
        ctx.fillText('You', this.x, this.y - this.radius - 10);
        ctx.shadowBlur = 0;

        if (this.weapon) {
            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.rotate(this.facingAngle + (this.isAttacking ? this.attackAngle : 0));
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(this.weapon.range, 0);
            ctx.strokeStyle = this.weapon.color;
            ctx.lineWidth = this.isAttacking ? 6 : 3;
            ctx.stroke();
            ctx.restore();
        }
    }
}

let groundPatterns = {};
function createGroundPatterns() {
    const p1 = document.createElement('canvas'); p1.width = 128; p1.height = 128;
    const c1 = p1.getContext('2d');
    c1.fillStyle = '#112318'; c1.fillRect(0, 0, 128, 128);
    c1.fillStyle = '#162e20';
    for(let i = 0; i < 16; i++) c1.fillRect((i*29)%128, (i*47)%128, 24, 24);
    groundPatterns.overworld = ctx.createPattern(p1, 'repeat');

    const p2 = document.createElement('canvas'); p2.width = 128; p2.height = 128;
    const c2 = p2.getContext('2d');
    c2.fillStyle = '#2a0909'; c2.fillRect(0, 0, 128, 128);
    c2.fillStyle = '#3f0e0e';
    for(let i = 0; i < 12; i++) c2.fillRect((i*31)%128, (i*41)%128, 32, 32);
    groundPatterns.nether = ctx.createPattern(p2, 'repeat');

    const p3 = document.createElement('canvas'); p3.width = 128; p3.height = 128;
    const c3 = p3.getContext('2d');
    c3.fillStyle = '#090514'; c3.fillRect(0, 0, 128, 128);
    c3.strokeStyle = '#2e1065'; c3.lineWidth = 1.5;
    c3.strokeRect(0, 0, 128, 128);
    groundPatterns.void = ctx.createPattern(p3, 'repeat');
}

function generateDimension(dimKey) {
    const res = [];
    const count = dimKey === 'overworld' ? 320 : dimKey === 'nether' ? 280 : 240;
    
    for (let i = 0; i < count; i++) {
        let type = 'tree';
        let r = Math.random();
        if (dimKey === 'overworld') type = r < 0.4 ? 'tree' : r < 0.7 ? 'rock' : r < 0.85 ? 'ore' : 'shard';
        else if (dimKey === 'nether') type = r < 0.3 ? 'rock' : r < 0.6 ? 'ore' : 'shard';
        else type = r < 0.2 ? 'rock' : r < 0.5 ? 'ore' : 'shard';

        res.push(new Resource(
            i,
            Math.random() * (WORLD_SIZE - 200) + 100,
            Math.random() * (WORLD_SIZE - 200) + 100,
            type
        ));
    }

    const enemies = [];
    const mobPool = MOB_TEMPLATES[dimKey];
    const eCount = dimKey === 'overworld' ? 45 : dimKey === 'nether' ? 70 : 90;

    for (let i = 0; i < eCount; i++) {
        const mobTemplate = mobPool[Math.floor(Math.random() * mobPool.length)];
        const MobClass = mobTemplate.classType;
        
        enemies.push(new MobClass(
            Math.random() * (WORLD_SIZE - 200) + 100,
            Math.random() * (WORLD_SIZE - 200) + 100,
            mobTemplate.config
        ));
    }

    const chests = [];
    const chestCount = dimKey === 'overworld' ? 22 : dimKey === 'nether' ? 28 : 35;
    for (let i = 0; i < chestCount; i++) {
        chests.push(new Chest(
            i,
            Math.random() * (WORLD_SIZE - 200) + 100,
            Math.random() * (WORLD_SIZE - 200) + 100
        ));
    }

    dimEntities[dimKey] = { resources: res, enemies: enemies, chests: chests, projectiles: [] };
}

function loadSavedData() {
    const saved = localStorage.getItem('survival_realm_v8');
    if (saved) {
        try {
            const data = JSON.parse(saved);
            player.wood = data.wood || 0;
            player.stone = data.stone || 0;
            player.ore = data.ore || 0;
            player.shards = data.shards || { overworld: 0, nether: 0, void: 0 };
            player.unlockedDims = data.unlockedDims || { overworld: true, nether: false, void: false };
            player.hotbar = data.hotbar || player.hotbar;
            player.backpack = data.backpack || [];
            player.ownedWeapons = data.ownedWeapons || ['stick'];
            player.ownedArmors = data.ownedArmors || [];
            player.armorKey = data.armorKey || null;
            if (player.armorKey && ARMORS[player.armorKey]) {
                player.armor = ARMORS[player.armorKey];
                player.maxHp = player.baseMaxHp + player.armor.hpBonus;
            }
        } catch (e) { console.error(e); }
    }
}

function saveData() {
    const data = {
        wood: player.wood, stone: player.stone, ore: player.ore,
        shards: player.shards, unlockedDims: player.unlockedDims,
        hotbar: player.hotbar, backpack: player.backpack,
        ownedWeapons: player.ownedWeapons, ownedArmors: player.ownedArmors, armorKey: player.armorKey
    };
    localStorage.setItem('survival_realm_v8', JSON.stringify(data));
}

function showToast(title, msg) {
    const container = document.getElementById('toast-container');
    const toast = document.createElement('div');
    toast.className = 'glass-panel flex items-center gap-3 rounded-2xl px-4 py-3 shadow-2xl border-indigo-500/30';
    toast.innerHTML = `<div><div class="text-xs font-bold text-indigo-300">${title}</div><div class="text-[11px] text-gray-300">${msg}</div></div>`;
    container.appendChild(toast);
    setTimeout(() => toast.remove(), 2500);
}

    document.getElementById('crafting-panel').classList.toggle('hidden');
}

function pressHotbarSlot(index) {
    if (equippedSlotIndex === index) {
        equippedSlotIndex = -1;
        player.weapon = null;
        player.weaponKey = null;
    } else {
        equippedSlotIndex = index;
        const item = player.hotbar[index];
        if (item && item.type === 'weapon' && BASE_WEAPONS[item.weaponKey]) {
            player.weaponKey = item.weaponKey;
            player.weapon = BASE_WEAPONS[item.weaponKey];
        } else {
            player.weapon = null;
            player.weaponKey = null;
        }
    }
    updateHUD();
}

function useActiveItem() {
    if (equippedSlotIndex < 0) return;
    let item = player.hotbar[equippedSlotIndex];
    if (!item) return;

    if (item.type === 'consumable') {
        if (item.id === 'heal') {
            player.hp = Math.min(player.maxHp, player.hp + 45);
            showToast("🧪 Consumed Salve", "Restored +45 Vitality!");
        } else if (item.id === 'elixir') {
            player.hp = player.maxHp;
            showToast("🍷 Consumed Elixir", "Fully Restored Vitality!");
        }

        vfx.createExplosion(player.x, player.y, '#10b981', 15);
        item.count--;
        if (item.count <= 0) player.hotbar[equippedSlotIndex] = null;
        updateHUD();
        saveData();
    }
}

function switchDimension(dimKey) {
    if (dimKey === currentDim) return;

    if (!player.unlockedDims[dimKey]) {
        const reqConfig = dimKey === 'nether' ? DIMENSION_SHARDS.overworld : DIMENSION_SHARDS.nether;
        const reqDimKey = dimKey === 'nether' ? 'overworld' : 'nether';

        if (player.shards[reqDimKey] >= reqConfig.req) {
            player.unlockedDims[dimKey] = true;
            showToast("🌀 Realm Portal Unlocked", `Entered ${dimKey.toUpperCase()} Realm!`);
        } else {
            showToast("🔒 Realm Locked", `Need ${reqConfig.req}x ${reqConfig.name} from${reqDimKey.toUpperCase()} Realm!`);
            return;
        }
    }

    currentDim = dimKey;
    document.querySelectorAll('.dim-btn').forEach(btn => btn.classList.add('opacity-60', 'bg-white/5'));
    document.getElementById(`btn-${dimKey}`).classList.remove('opacity-60', 'bg-white/5');
    document.getElementById(`btn-${dimKey}`).classList.add('bg-indigo-600');
    updateHUD();
}

function renderCraftingUI() {
    document.getElementById('compact-craft-list').innerHTML = BASE_CRAFTABLES.map(item => {
        const isToolOwned = (item.type === 'weapon' && player.ownedWeapons.includes(item.weaponKey)) ||
                            (item.type === 'armor' && player.ownedArmors.includes(item.armorKey));

        const canAfford = !isToolOwned && player.wood >= item.cost.wood && player.stone >= item.cost.stone && player.ore >= item.cost.ore;

        return `
            <button onclick="craftItem('${item.id}')" ${!canAfford ? 'disabled' : ''} class="flex items-center justify-between rounded-xl border border-white/10 bg-white/[0.04] p-2 text-left hover:bg-white/[0.1] disabled:opacity-40 transition-all">
                <div>
                    <div class="text-xs font-bold ${isToolOwned ? 'text-emerald-400' : 'text-indigo-300'} flex items-center gap-1.5">
                        <span>${item.icon}</span> <span>${item.name}</span>${isToolOwned ? '✓' : ''}
                    </div>
                    <div class="text-[10px] text-gray-400">${item.stats}</div>
                </div>
                <div class="text-right text-[10px] font-mono text-gray-300">
                    ${isToolOwned ? '<span class="font-bold text-emerald-400">OWNED</span>' : `Wood: ${item.cost.wood}<br>Stone: ${item.cost.stone}<br>Ore: ${item.cost.ore}`}
                </div>
            </button>
        `;
    }).join('');
}

function craftItem(id) {
    const item = BASE_CRAFTABLES.find(c => c.id === id);
    if (!item) return;

    if (item.type === 'weapon' && player.ownedWeapons.includes(item.weaponKey)) {
        showToast("⚠️ Tool Owned", "You already own this weapon/tool!");
        return;
    }
    if (item.type === 'armor' && player.ownedArmors.includes(item.armorKey)) {
        showToast("⚠️ Armor Owned", "You already own this armor!");
        return;
    }

    if (player.wood >= item.cost.wood && player.stone >= item.cost.stone && player.ore >= item.cost.ore) {
        player.wood -= item.cost.wood;
        player.stone -= item.cost.stone;
        player.ore -= item.cost.ore;

        if (item.type === 'armor') {
            player.ownedArmors.push(item.armorKey);
            player.armorKey = item.armorKey;
            player.armor = ARMORS[item.armorKey];
            player.maxHp = player.baseMaxHp + player.armor.hpBonus;
            showToast("🛡️ Armor Equipped", `Equipped ${item.name}!`);
        } else if (item.type === 'weapon') {
            player.ownedWeapons.push(item.weaponKey);
            addItemToInventory({ ...item, count: 1 });
            showToast(`${item.icon} Weapon Crafted!`, `Acquired ${item.name}! Added to hotbar.`);
        } else {
            addItemToInventory({ ...item, count: 1 });
            showToast(`${item.icon} Consumable Crafted!`, `Created ${item.name}!`);
        }

        updateHUD();
        saveData();
    }
}

function addItemToInventory(newItem) {
    if (newItem.type === 'consumable') {
        let hotbarItem = player.hotbar.find(i => i && i.id === newItem.id);
        if (hotbarItem) { hotbarItem.count += (newItem.count || 1); return; }
        let backpackItem = player.backpack.find(i => i && i.id === newItem.id);
        if (backpackItem) { backpackItem.count += (newItem.count || 1); return; }
    }

    let emptySlot = player.hotbar.findIndex(slot => slot === null);
    if (emptySlot !== -1) {
        player.hotbar[emptySlot] = newItem;
    } else {
        player.backpack.push(newItem);
    }
}

function toggleBackpack(force) {
    const modal = document.getElementById('backpack-modal');
    if (force === false || !modal.classList.contains('hidden')) {
        modal.classList.replace('flex', 'hidden');
    } else {
        modal.classList.replace('hidden', 'flex');
    }
}

function renderBackpackUI() {
    document.getElementById('backpack-grid').innerHTML = player.backpack.map((item, i) => `
        <div onclick="equipFromBackpack(${i})" class="hotbar-slot border-indigo-500/20 flex-col hover:border-indigo-400 w-full h-20">
            <span class="text-xl mt-1">${item.icon}</span>
            <span class="slot-title">${item.name}</span>${item.count > 1 ? `<span class="item-count">x${item.count}</span>` : ''}
        </div>
    `).join('');
}

function equipFromBackpack(backpackIdx) {
    let item = player.backpack[backpackIdx];
    let emptySlot = player.hotbar.findIndex(slot => slot === null);

    if (emptySlot !== -1) {
        player.hotbar[emptySlot] = item;
        player.backpack.splice(backpackIdx, 1);
    } else {
        let activeIdx = equippedSlotIndex >= 0 ? equippedSlotIndex : 0;
        let temp = player.hotbar[activeIdx];
        player.hotbar[activeIdx] = item;
        player.backpack[backpackIdx] = temp;
    }

    updateHUD();
    saveData();
}

// INPUT EVENTS
window.addEventListener('keydown', e => {
    keys[e.key.toLowerCase()] = true;
    if (e.key === '`' || e.key === '~') { e.preventDefault(); toggleBackpack(); }
    if (e.key === 'Escape') toggleBackpack(false);
    if (e.key.toLowerCase() === 'e' && nearbyChest) nearbyChest.open(player, currentDim);

    if (['1','2','3','4','5','6','7','8','9'].includes(e.key)) {
        pressHotbarSlot(parseInt(e.key) - 1);
    }
});

window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
window.addEventListener('mousemove', e => { mousePos = { x: e.clientX, y: e.clientY }; });

window.addEventListener('mousedown', e => {
    if (e.button === 0) {
        if (nearbyChest) {
            nearbyChest.open(player, currentDim);
            return;
        }

        if (equippedSlotIndex >= 0 && player.hotbar[equippedSlotIndex] && player.hotbar[equippedSlotIndex].type === 'consumable') {
            useActiveItem();
            return;
        }

        if (!player.isAttacking && player.weapon) {
            player.isAttacking = true;
            player.attackAngle = -Math.PI / 3;
            performAttack();
        }
    }
});

function performAttack() {
    if (!player.weapon) return;
    const currentWeapon = player.weapon;
    const currentEnemies = dimEntities[currentDim].enemies;
    const currentResources = dimEntities[currentDim].resources;

    vfx.addSwingTrail(player.x, player.y, player.facingAngle, currentWeapon.range, currentWeapon.color);

    for (let i = currentEnemies.length - 1; i >= 0; i--) {
        const enemy = currentEnemies[i];
        const dx = enemy.x - player.x;
        const dy = enemy.y - player.y;
        if (dx * dx + dy * dy <= (currentWeapon.range + enemy.radius) ** 2) {
            enemy.hp -= currentWeapon.damage;

            const angle = Math.atan2(dy, dx);
            const kbForce = currentWeapon.knockback || 15;
            enemy.vx += Math.cos(angle) * kbForce;
            enemy.vy += Math.sin(angle) * kbForce;

            vfx.createExplosion(enemy.x, enemy.y, currentWeapon.color, 8);

            if (enemy.hp <= 0) {
                enemy.onDeath(currentDim, player);
                currentEnemies.splice(i, 1);
                updateHUD();
                saveData();
            }
        }
    }

    for (let i = currentResources.length - 1; i >= 0; i--) {
        const res = currentResources[i];
        const dx = res.x - player.x;
        const dy = res.y - player.y;
        if (dx * dx + dy * dy <= (currentWeapon.range + res.radius) ** 2) {
            res.hp -= currentWeapon.damage;
            vfx.createExplosion(res.x, res.y, '#e2e8f0', 5);
            if (res.hp <= 0) {
                res.harvest(player, currentDim);
                currentResources.splice(i, 1);
                updateHUD();
                saveData();
            }
        }
    }
}

// MAIN LOOP
let lastTime = performance.now();
const deltaStep = 1000 / 60;
let accum = 0;

function update(dt) {
    let dx = 0; let dy = 0;
    if (keys['w'] || keys['arrowup']) dy -= 1;
    if (keys['s'] || keys['arrowdown']) dy += 1;
    if (keys['a'] || keys['arrowleft']) dx -= 1;
    if (keys['d'] || keys['arrowright']) dx += 1;

    if (dx !== 0 && dy !== 0) { dx *= 0.7071; dy *= 0.7071; }

    player.x = Math.max(player.radius, Math.min(WORLD_SIZE - player.radius, player.x + dx * player.speed));
    player.y = Math.max(player.radius, Math.min(WORLD_SIZE - player.radius, player.y + dy * player.speed));

    const screenCenterX = canvas.width * 0.5;
    const screenCenterY = canvas.height * 0.5;
    player.facingAngle = Math.atan2(mousePos.y - screenCenterY, mousePos.x - screenCenterX);

    if (player.isAttacking) {
        player.attackAngle += 0.55;
        if (player.attackAngle >= Math.PI / 3) player.isAttacking = false;
    }

    nearbyChest = null;
    const currentChests = dimEntities[currentDim].chests;
    for (let chest of currentChests) {
        if (!chest.opened && Math.hypot(chest.x - player.x, chest.y - player.y) <= player.radius + chest.radius + 30) {
            nearbyChest = chest;
            break;
        }
    }

    const chestPrompt = document.getElementById('chest-prompt');
    if (nearbyChest) chestPrompt.classList.remove('hidden');
    else chestPrompt.classList.add('hidden');

    const currentEnemies = dimEntities[currentDim].enemies;
    const currentProjectiles = dimEntities[currentDim].projectiles;

    for (let i = 0; i < currentEnemies.length; i++) {
        currentEnemies[i].update(player, currentProjectiles);
    }

    for (let i = currentProjectiles.length - 1; i >= 0; i--) {
        const proj = currentProjectiles[i];
        proj.update();

        if (Math.hypot(player.x - proj.x, player.y - proj.y) <= player.radius + proj.radius) {
            player.takeDamage(proj.damage);
            vfx.createExplosion(proj.x, proj.y, proj.color, 18);
            proj.markedForDeletion = true;
        }

        if (proj.markedForDeletion) {
            currentProjectiles.splice(i, 1);
        }
    }

    vfx.update();
}

function render() {
    const camX = canvas.width * 0.5 - player.x;
    const camY = canvas.height * 0.5 - player.y;

    const viewLeft = player.x - canvas.width * 0.5 - 100;
    const viewRight = player.x + canvas.width * 0.5 + 100;
    const viewTop = player.y - canvas.height * 0.5 - 100;
    const viewBottom = player.y + canvas.height * 0.5 + 100;

    ctx.save();
    ctx.translate(camX, camY);
    ctx.fillStyle = groundPatterns[currentDim] || '#030712';
    ctx.fillRect(viewLeft, viewTop, canvas.width + 200, canvas.height + 200);

    const currentResources = dimEntities[currentDim].resources;
    for (let res of currentResources) {
        if (res.x >= viewLeft && res.x <= viewRight && res.y >= viewTop && res.y <= viewBottom) {
            res.render(ctx);
        }
    }

    const currentChests = dimEntities[currentDim].chests;
    for (let chest of currentChests) {
        if (!chest.opened && chest.x >= viewLeft && chest.x <= viewRight && chest.y >= viewTop && chest.y <= viewBottom) {
            chest.render(ctx);
        }
    }

    const currentEnemies = dimEntities[currentDim].enemies;
    for (let enemy of currentEnemies) {
        if (enemy.x >= viewLeft && enemy.x <= viewRight && enemy.y >= viewTop && enemy.y <= viewBottom) {
            enemy.render(ctx);
        }
    }

    const currentProjectiles = dimEntities[currentDim].projectiles;
    for (let proj of currentProjectiles) {
        if (proj.x >= viewLeft && proj.x <= viewRight && proj.y >= viewTop && proj.y <= viewBottom) {
            proj.render(ctx);
        }
    }

    player.render(ctx);
    vfx.render(ctx);

    ctx.restore();
}

function gameLoop(time) {
    const dt = time - lastTime;
    lastTime = time;
    accum += dt;

    while (accum >= deltaStep) {
        update(deltaStep);
        accum -= deltaStep;
    }

    render();
    requestAnimationFrame(gameLoop);
}

loadSavedData();
updateHUD();
requestAnimationFrame(gameLoop);
</script>
</body>
</html>
