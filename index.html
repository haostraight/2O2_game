<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Survival Realm</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.min.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #111; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; }
        #game-container { width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; }
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        
        /* Biome Announcement Popup */
        #biome-toast {
            position: absolute; top: 15%; left: 50%; transform: translate(-50%, -50%);
            font-size: 28px; font-weight: bold; font-family: monospace; letter-spacing: 2px;
            color: #fff; text-shadow: 2px 2px 8px #000; background: rgba(0,0,0,0.65);
            padding: 10px 24px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2);
            opacity: 0; transition: opacity 0.5s ease-in-out, transform 0.5s ease-in-out;
        }
        #biome-toast.show { opacity: 1; transform: translate(-50%, -30%); }

        /* Crafting Panel */
        #crafting-panel {
            position: absolute; bottom: 20px; left: 20px; background: rgba(15, 15, 20, 0.85);
            border: 2px solid #444; border-radius: 10px; padding: 12px; pointer-events: auto;
            max-width: 300px; backdrop-filter: blur(4px);
        }
        #crafting-panel h3 { margin: 0 0 8px 0; font-size: 16px; color: #ffcc00; text-transform: uppercase; }
        .craft-btn {
            display: block; width: 100%; margin: 4px 0; padding: 6px 10px; background: #222;
            color: #eee; border: 1px solid #555; border-radius: 4px; cursor: pointer; text-align: left;
            font-size: 13px; transition: 0.2s;
        }
        .craft-btn:hover { background: #3a3a4a; border-color: #ffcc00; }
        
        /* Player Stats HUD */
        #stats-hud {
            position: absolute; top: 20px; left: 20px; background: rgba(0,0,0,0.6);
            padding: 10px 16px; border-radius: 8px; border: 1px solid #333; font-family: monospace;
        }
        .stat-bar { margin: 4px 0; font-size: 14px; }
        .rarity-Common { color: #aaaaaa; }
        .rarity-Uncommon { color: #1eff00; }
        .rarity-Rare { color: #0070dd; }
        .rarity-Epic { color: #a335ee; }
        .rarity-Legendary { color: #ff8000; }
    </style>
</head>
<body>

<div id="game-container"></div>
<div id="ui-layer">
    <div id="biome-toast">DISCOVERED: PLAINS</div>
    <div id="stats-hud">
        <div class="stat-bar">❤️ HP: <span id="hp-val">100</span></div>
        <div class="stat-bar">🪵 Wood: <span id="wood-val">0</span> | 🪨 Stone: <span id="stone-val">0</span> | 💎 Ore: <span id="ore-val">0</span></div>
        <div class="stat-bar">⚔️ Weapon: <span id="weapon-val" class="rarity-Common">Wooden Stick (Common)</span></div>
        <div style="font-size: 11px; color: #888; margin-top: 6px;">[WASD] Move | [Click] Attack/Mine | [1-4] Craft Hotkeys</div>
    </div>
    
    <div id="crafting-panel">
        <h3>Crafting Station</h3>
        <button class="craft-btn" onclick="craftItem('spear')">🗡️ Stone Spear (10 W, 10 S)</button>
        <button class="craft-btn" onclick="craftItem('hammer')">🔨 Ore Sledge (15 W, 20 O)</button>
        <button class="craft-btn" onclick="craftItem('blade')">⚡ Plasma Sword (20 W, 20 S, 15 O)</button>
        <button class="craft-btn" onclick="craftItem('heal')">🧪 Healing Salve (5 W, 5 S)</button>
    </div>
</div>

<script>
// ============================================================================
// GAME CONFIGURATION & CUSTOMIZATION PARAMETERS
// Adjust these object variables easily to change game balance and behavior!
// ============================================================================
const CONFIG = {
    WORLD_SIZE: 3200,
    BIOME_SIZE: 800,
    PLAYER_SPEED: 220,
    MAX_ENEMIES: 25,
    RESOURCE_COUNT: 180,
    
    // Weapon Configurations & Rarities
    WEAPONS: {
        stick: { name: 'Wooden Stick', damage: 15, range: 45, rarity: 'Common', color: 0xaaaaaa, ability: 'None' },
        spear: { name: 'Stone Spear', damage: 30, range: 70, rarity: 'Uncommon', color: 0x1eff00, ability: 'Knockback' },
        hammer: { name: 'Ore Sledge', damage: 55, range: 50, rarity: 'Rare', color: 0x0070dd, ability: 'Stun' },
        blade: { name: 'Plasma Sword', damage: 90, range: 80, rarity: 'Legendary', color: 0xff8000, ability: 'Area Burst' }
    },

    // Biomes Definition
    BIOMES: [
        { name: 'GRASSLANDS', color: 0x3d8c40, resColor: 0x225522 },
        { name: 'DESERT DUNE', color: 0xd2b48c, resColor: 0x8b5a2b },
        { name: 'FROST TUNDRA', color: 0xa0c8f0, resColor: 0x4682b4 },
        { name: 'CORRUPTED WASTES', color: 0x4b0082, resColor: 0x8a2be2 }
    ]
};

// Global Inventory State
let playerState = {
    hp: 100, maxHp: 100,
    wood: 0, stone: 0, ore: 0,
    currentWeapon: CONFIG.WEAPONS.stick,
    currentBiome: ''
};

class SurvivalScene extends Phaser.Scene {
    constructor() {
        super({ key: 'SurvivalScene' });
    }

    preload() {
        // Generating procedural textures for clean minimal aesthetics
        const graphics = this.make.graphics({ x: 0, y: 0, add: false });
        
        // Player texture
        graphics.fillStyle(0x00aaff, 1);
        graphics.fillCircle(16, 16, 16);
        graphics.lineStyle(2, 0xffffff, 1);
        graphics.strokeCircle(16, 16, 16);
        graphics.generateTexture('player', 32, 32);
        graphics.clear();

        // Enemy texture
        graphics.fillStyle(0xff3333, 1);
        graphics.fillTriangle(16, 0, 32, 32, 0, 32);
        graphics.generateTexture('enemy', 32, 32);
        graphics.clear();

        // Resource nodes (Tree, Stone, Ore)
        graphics.fillStyle(0x8b5a2b); graphics.fillRect(10, 0, 12, 32);
        graphics.fillStyle(0x228b22); graphics.fillCircle(16, 10, 14);
        graphics.generateTexture('tree', 32, 32); graphics.clear();

        graphics.fillStyle(0x808080); graphics.fillCircle(16, 16, 14);
        graphics.generateTexture('stone', 32, 32); graphics.clear();

        graphics.fillStyle(0x00ffff); graphics.fillCircle(16, 16, 12);
        graphics.generateTexture('ore', 32, 32); graphics.clear();
    }

    create() {
        // World Bounds
        this.physics.world.setBounds(0, 0, CONFIG.WORLD_SIZE, CONFIG.WORLD_SIZE);

        // Draw Biome Grid Map Background
        this.createBiomes();

        // Player Setup
        this.player = this.physics.add.sprite(CONFIG.WORLD_SIZE / 2, CONFIG.WORLD_SIZE / 2, 'player');
        this.player.setCollideWorldBounds(true);
        this.cameras.main.startFollow(this.player, true, 0.08, 0.08);
        this.cameras.main.setBounds(0, 0, CONFIG.WORLD_SIZE, CONFIG.WORLD_SIZE);

        // Input Setup
        this.cursors = this.input.keyboard.addKeys({
            up: 'W', down: 'S', left: 'A', right: 'D',
            k1: 'ONE', k2: 'TWO', k3: 'THREE', k4: 'FOUR'
        });

        // Entity Groups
        this.resources = this.physics.add.staticGroup();
        this.enemies = this.physics.add.group();

        // Spawn Map Elements
        this.spawnResources();
        this.spawnEnemies();

        // Collisions & Overlaps
        this.physics.add.collider(this.player, this.resources);
        this.physics.add.collider(this.enemies, this.enemies);
        this.physics.add.collider(this.enemies, this.resources);
        this.physics.add.overlap(this.player, this.enemies, this.handlePlayerDamage, null, this);

        // Attack Event
        this.input.on('pointerdown', (pointer) => this.performAttack(pointer));

        // Minimap Camera setup
        this.minimap = this.cameras.add(window.innerWidth - 170, 20, 150, 150)
            .setZoom(150 / CONFIG.WORLD_SIZE)
            .setName('mini')
            .setBackgroundColor(0x000000)
            .startFollow(this.player);
        this.minimap.ignore([this.children.getByName('ui')]);

        // Window resize handle
        window.addEventListener('resize', () => {
            this.minimap.setPosition(window.innerWidth - 170, 20);
        });
    }

    createBiomes() {
        const bg = this.add.graphics();
        const halfSize = CONFIG.WORLD_SIZE / 2;
        
        // Quad-Biome Layout
        const regions = [
            { x: 0, y: 0, biome: CONFIG.BIOMES[0] },
            { x: halfSize, y: 0, biome: CONFIG.BIOMES[1] },
            { x: 0, y: halfSize, biome: CONFIG.BIOMES[2] },
            { x: halfSize, y: halfSize, biome: CONFIG.BIOMES[3] }
        ];

        regions.forEach(r => {
            bg.fillStyle(r.biome.color, 1);
            bg.fillRect(r.x, r.y, halfSize, halfSize);
        });

        // Grid accents for extra visual crispness
        bg.lineStyle(2, 0x000000, 0.15);
        for (let x = 0; x < CONFIG.WORLD_SIZE; x += 64) {
            bg.lineBetween(x, 0, x, CONFIG.WORLD_SIZE);
            bg.lineBetween(0, x, CONFIG.WORLD_SIZE, x);
        }
    }

    spawnResources() {
        const types = ['tree', 'stone', 'ore'];
        for (let i = 0; i < CONFIG.RESOURCE_COUNT; i++) {
            let x = Phaser.Math.Between(100, CONFIG.WORLD_SIZE - 100);
            let y = Phaser.Math.Between(100, CONFIG.WORLD_SIZE - 100);
            let type = Phaser.Utils.Array.GetRandom(types);
            
            let res = this.resources.create(x, y, type);
            res.setData('type', type);
            res.setData('hp', type === 'ore' ? 3 : type === 'stone' ? 2 : 1);
        }
    }

    spawnEnemies() {
        for (let i = 0; i < CONFIG.MAX_ENEMIES; i++) {
            let x = Phaser.Math.Between(100, CONFIG.WORLD_SIZE - 100);
            let y = Phaser.Math.Between(100, CONFIG.WORLD_SIZE - 100);
            
            // Keep enemies away from spawn point
            if (Phaser.Math.Distance.Between(x, y, CONFIG.WORLD_SIZE/2, CONFIG.WORLD_SIZE/2) < 300) continue;

            let enemy = this.enemies.create(x, y, 'enemy');
            enemy.setCollideWorldBounds(true);
            enemy.setData('hp', 50);
        }
    }

    update() {
        if (playerState.hp <= 0) return;

        // Player Movement Logic
        let vx = 0, vy = 0;
        if (this.cursors.left.isDown) vx -= 1;
        if (this.cursors.right.isDown) vx += 1;
        if (this.cursors.up.isDown) vy -= 1;
        if (this.cursors.down.isDown) vy += 1;

        let vec = new Phaser.Math.Vector2(vx, vy).normalize().scale(CONFIG.PLAYER_SPEED);
        this.player.setVelocity(vec.x, vec.y);

        // Enemy AI (Follow player)
        this.enemies.getChildren().forEach(enemy => {
            let dist = Phaser.Math.Distance.Between(enemy.x, enemy.y, this.player.x, this.player.y);
            if (dist < 400) {
                this.physics.moveToObject(enemy, this.player, 100);
            } else {
                enemy.setVelocity(0, 0);
            }
        });

        // Biome Check
        this.checkBiomeChange();

        // Hotkey Crafting
        if (Phaser.Input.Keyboard.JustDown(this.cursors.k1)) craftItem('spear');
        if (Phaser.Input.Keyboard.JustDown(this.cursors.k2)) craftItem('hammer');
        if (Phaser.Input.Keyboard.JustDown(this.cursors.k3)) craftItem('blade');
        if (Phaser.Input.Keyboard.JustDown(this.cursors.k4)) craftItem('heal');
    }

    checkBiomeChange() {
        const half = CONFIG.WORLD_SIZE / 2;
        let biome = CONFIG.BIOMES[0].name;

        if (this.player.x >= half && this.player.y < half) biome = CONFIG.BIOMES[1].name;
        else if (this.player.x < half && this.player.y >= half) biome = CONFIG.BIOMES[2].name;
        else if (this.player.x >= half && this.player.y >= half) biome = CONFIG.BIOMES[3].name;

        if (playerState.currentBiome !== biome) {
            playerState.currentBiome = biome;
            showToast("ENTERED: " + biome);
        }
    }

    performAttack(pointer) {
        let worldPoint = this.cameras.main.getWorldPoint(pointer.x, pointer.y);
        let weapon = playerState.currentWeapon;

        // Attack FX Arc/Circle
        let gfx = this.add.graphics();
        gfx.fillStyle(weapon.color, 0.4);
        gfx.fillCircle(this.player.x, this.player.y, weapon.range);
        this.tweens.add({ targets: gfx, alpha: 0, duration: 200, onComplete: () => gfx.destroy() });

        // Harvest Resources
        this.resources.getChildren().forEach(res => {
            if (Phaser.Math.Distance.Between(this.player.x, this.player.y, res.x, res.y) <= weapon.range) {
                let hp = res.getData('hp') - 1;
                res.setData('hp', hp);
                
                // Float text indicator
                this.showFloatingText(res.x, res.y, "-1", 0xffff00);

                if (hp <= 0) {
                    let type = res.getData('type');
                    if (type === 'tree') playerState.wood += Phaser.Math.Between(2, 5);
                    if (type === 'stone') playerState.stone += Phaser.Math.Between(2, 4);
                    if (type === 'ore') playerState.ore += Phaser.Math.Between(1, 3);
                    updateHUD();
                    res.destroy();
                }
            }
        });

        // Damage Enemies
        this.enemies.getChildren().forEach(enemy => {
            if (Phaser.Math.Distance.Between(this.player.x, this.player.y, enemy.x, enemy.y) <= weapon.range) {
                let hp = enemy.getData('hp') - weapon.damage;
                enemy.setData('hp', hp);

                // Knockback Ability Effect
                if (weapon.ability === 'Knockback' || weapon.ability === 'Area Burst') {
                    let angle = Phaser.Math.Angle.Between(this.player.x, this.player.y, enemy.x, enemy.y);
                    enemy.x += Math.cos(angle) * 40;
                    enemy.y += Math.sin(angle) * 40;
                }

                this.showFloatingText(enemy.x, enemy.y, `-${weapon.damage}`, 0xff3333);

                if (hp <= 0) {
                    enemy.destroy();
                }
            }
        });
    }

    handlePlayerDamage(player, enemy) {
        playerState.hp -= 0.3;
        updateHUD();
        if (playerState.hp <= 0) {
            this.physics.pause();
            this.player.setTint(0xff0000);
            showToast("GAME OVER! Refresh to Restart.");
        }
    }

    showFloatingText(x, y, msg, color) {
        let txt = this.add.text(x, y, msg, { font: 'bold 16px Arial', fill: Phaser.Display.Color.IntegerToColor(color).rgba });
        this.tweens.add({ targets: txt, y: y - 30, alpha: 0, duration: 600, onComplete: () => txt.destroy() });
    }
}

// Global UI Interactivity
function updateHUD() {
    document.getElementById('hp-val').innerText = Math.max(0, Math.floor(playerState.hp));
    document.getElementById('wood-val').innerText = playerState.wood;
    document.getElementById('stone-val').innerText = playerState.stone;
    document.getElementById('ore-val').innerText = playerState.ore;
    
    let wName = `${playerState.currentWeapon.name} (${playerState.currentWeapon.rarity})`;
    let wElem = document.getElementById('weapon-val');
    wElem.innerText = wName;
    wElem.className = `rarity-${playerState.currentWeapon.rarity}`;
}

function showToast(msg) {
    const toast = document.getElementById('biome-toast');
    toast.innerText = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2500);
}

function craftItem(type) {
    if (type === 'spear' && playerState.wood >= 10 && playerState.stone >= 10) {
        playerState.wood -= 10; playerState.stone -= 10;
        playerState.currentWeapon = CONFIG.WEAPONS.spear;
        showToast("CRAFTED: Stone Spear!");
    } else if (type === 'hammer' && playerState.wood >= 15 && playerState.ore >= 20) {
        playerState.wood -= 15; playerState.ore -= 20;
        playerState.currentWeapon = CONFIG.WEAPONS.hammer;
        showToast("CRAFTED: Ore Sledge!");
    } else if (type === 'blade' && playerState.wood >= 20 && playerState.stone >= 20 && playerState.ore >= 15) {
        playerState.wood -= 20; playerState.stone -= 20; playerState.ore -= 15;
        playerState.currentWeapon = CONFIG.WEAPONS.blade;
        showToast("CRAFTED: Plasma Sword!");
    } else if (type === 'heal' && playerState.wood >= 5 && playerState.stone >= 5) {
        playerState.wood -= 5; playerState.stone -= 5;
        playerState.hp = Math.min(100, playerState.hp + 40);
        showToast("HEALED +40 HP!");
    } else {
        showToast("NOT ENOUGH RESOURCES!");
    }
    updateHUD();
}

// Game Initialization
const gameConfig = {
    type: Phaser.AUTO,
    parent: 'game-container',
    width: window.innerWidth,
    height: window.innerHeight,
    physics: { default: 'arcade', arcade: { debug: false } },
    scene: [SurvivalScene]
};

const game = new Phaser.Game(gameConfig);
window.addEventListener('resize', () => game.scale.resize(window.innerWidth, window.innerHeight));
</script>
</body>
</html>
